// Lit les valeurs actuellement saisies dans la fiche de qualification (DOM), partagee par le
// bouton "Booker le rendez-vous" et le bouton "Enregistrer" — evite de dupliquer la liste des
// selecteurs et garantit que les deux boutons envoient exactement les memes champs au serveur.
function qlGatherPayload(main){
  var reasons = Array.prototype.filter.call(main.querySelectorAll('.ql-reason-cb'), function(c){ return c.checked; }).map(function(c){ return c.value; });
  return {
    unitsCount: (main.querySelector('#ql-units')||{}).value||'',
    buildingType: (main.querySelector('#ql-building')||{}).value||'',
    sealantColor: (main.querySelector('#ql-color')||{}).value||'',
    sealantColorOther: (main.querySelector('#ql-color-other')||{}).value||'',
    language: qualToggleValue(main, 'language'),
    reasons: reasons,
    reasonsOther: (main.querySelector('#ql-reasons-other')||{}).value||'',
    timeline: (main.querySelector('#ql-timeline')||{}).value||'',
    otherRenovations: qualToggleValue(main, 'otherRenovations'),
    otherRenovationsWhich: (main.querySelector('#ql-renovations-which')||{}).value||'',
    renovationPriority: (main.querySelector('#ql-renovation-priority')||{}).value||'',
    decisionMakerInvolved: qualToggleValue(main, 'decisionMaker'),
    apptNotBookedReason: (main.querySelector('#ql-not-booked-reason')||{}).value||'',
  };
}
function bindQualificationForm(main, l){
  // Autosauvegarde silencieuse (demande utilisateur 2026-09-23) — le vrai probleme signale n'etait
  // pas le bouton en soi mais des reponses perdues quand l'utilisateur remplissait la fiche puis
  // fermait/quittait sans penser a cliquer "Enregistrer". On sauvegarde donc maintenant en arriere-
  // plan, debounce 900ms apres la derniere modification, sur exactement les memes champs/le meme
  // endpoint que le bouton (qlGatherPayload + PATCH .../qualification, qui accepte deja les
  // sauvegardes partielles — voir le commentaire au-dessus du bouton manuel). Le bouton reste en
  // repli pour un retour immediat "il manque tel champ" si on le souhaite, mais n'est plus requis.
  // Pas de render()/reload bloquant a chaque frappe (perdrait le focus, fermerait le panneau
  // "raisons" ouvert, etc.) : on rafraichit juste S.adLeads en silence, et on ne rebascule vers le
  // resume en lecture seule QUE si la fiche devient reellement complete (meme comportement que le
  // bouton manuel dans ce cas precis).
  function autosaveQualification(){
    var payload = qlGatherPayload(main);
    var statusEl = main.querySelector('#ql-autosave-status');
    if(statusEl){ statusEl.textContent='Enregistrement...'; statusEl.style.color='var(--text-dim)'; }
    apiFetch('PATCH','/leads-crm/leads/'+l.id+'/qualification', payload).then(function(res){
      loadLeadsCrmData(); reloadMasterDbIfOwner();
      var statusEl2 = main.querySelector('#ql-autosave-status');
      if(res.complete){
        if(statusEl2){ statusEl2.textContent='✓ Fiche complétée'; statusEl2.style.color='#44AA44'; }
        toast('Fiche de qualification complétée!');
        openAdLeadSheet(l.id, false);
      } else if(statusEl2){
        statusEl2.textContent='✓ Enregistré automatiquement';
        statusEl2.style.color='#44AA44';
      }
    }).catch(function(e){
      var statusEl3 = main.querySelector('#ql-autosave-status');
      if(statusEl3){ statusEl3.textContent='⚠ Échec de l\'enregistrement automatique — '+e.message; statusEl3.style.color='#CC3333'; }
    });
  }
  // Delegation sur `main` : couvre tous les <input>/<select>/<textarea> de la fiche (ql-units,
  // ql-building, ql-color, ql-color-other, ql-reasons-other, ql-timeline, ql-renovations-which,
  // ql-renovation-priority, ql-not-booked-reason) sans avoir a lister/reattacher un listener par
  // champ. Les cases a cocher "raisons" (.ql-reason-cb) sont de vrais <input type=checkbox> donc
  // emettent aussi 'change' — deja couvertes ici. Les boutons toggle (Oui/Non, langue) ne sont PAS
  // des <input> et n'emettent ni 'input' ni 'change' : voir le handler dedie plus bas.
  main.addEventListener('input', function(e){
    if(e.target.closest('#ql-section')) debounce('ql-autosave-'+l.id, autosaveQualification, 900);
  });
  main.addEventListener('change', function(e){
    if(e.target.closest('#ql-section')) debounce('ql-autosave-'+l.id, autosaveQualification, 900);
  });
  var colorSel = main.querySelector('#ql-color');
  if(colorSel) colorSel.addEventListener('change', function(){
    var wrap = main.querySelector('#ql-color-other-wrap');
    if(wrap) wrap.style.display = this.value==='Autre' ? 'block' : 'none';
  });
  // Dropdown "raisons du calfeutrage" — bouton qui ouvre un panneau de cases a cocher (menu
  // deroulant a selection multiple). L'ecouteur de fermeture est scope a `main` (pas document),
  // donc il disparait avec le sheet — pas de fuite d'ecouteurs empiles (cf. bug precedent render()).
  var reasonsBtn = main.querySelector('#ql-reasons-btn');
  var reasonsPanel = main.querySelector('#ql-reasons-panel');
  var reasonsLabel = main.querySelector('#ql-reasons-label');
  function updateReasonsLabel(){
    var checked = Array.prototype.filter.call(main.querySelectorAll('.ql-reason-cb'), function(c){ return c.checked; }).map(function(c){ return c.value; });
    if(reasonsLabel) reasonsLabel.textContent = checked.length ? checked.join(', ') : 'Choisir...';
    var wrap = main.querySelector('#ql-reasons-other-wrap');
    if(wrap) wrap.style.display = checked.indexOf('Autre')>-1 ? 'block' : 'none';
  }
  if(reasonsBtn && reasonsPanel){
    reasonsBtn.addEventListener('click', function(e){
      e.stopPropagation();
      reasonsPanel.style.display = reasonsPanel.style.display==='none' ? 'block' : 'none';
    });
    main.querySelectorAll('.ql-reason-cb').forEach(function(cb){
      cb.addEventListener('change', updateReasonsLabel);
    });
    main.addEventListener('click', function(e){
      if(reasonsPanel.style.display!=='none' && !reasonsPanel.contains(e.target) && e.target!==reasonsBtn){
        reasonsPanel.style.display = 'none';
      }
    });
  }
  main.querySelectorAll('[data-ql-toggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var name = this.dataset.qlToggle;
      main.querySelectorAll('[data-ql-toggle="'+name+'"]').forEach(function(b){ b.classList.remove('on'); });
      this.classList.add('on');
      if(name==='otherRenovations'){
        var det = main.querySelector('#ql-renovations-detail');
        if(det) det.style.display = this.dataset.qlValue==='Oui' ? 'block' : 'none';
      }
      if(name==='decisionMaker'){
        var scr = main.querySelector('#ql-decision-script');
        if(scr) scr.style.display = this.dataset.qlValue==='Oui' ? 'block' : 'none';
      }
      // Ces boutons toggle ne sont pas des <input>, donc pas couverts par la delegation
      // input/change ci-dessus — on declenche l'autosauvegarde explicitement ici.
      debounce('ql-autosave-'+l.id, autosaveQualification, 900);
    });
  });
  var notBookedBtn = main.querySelector('#ql-not-booked-btn');
  if(notBookedBtn) notBookedBtn.addEventListener('click', function(){
    var wrap = main.querySelector('#ql-not-booked-wrap');
    if(wrap){ wrap.style.display='block'; var ta=main.querySelector('#ql-not-booked-reason'); if(ta) ta.focus(); }
  });
  // Ancien bouton "Choisir un rendez-vous dans le calendrier" (PATCH apptDate/apptHour direct,
  // sans vraie ligne appointments) retire de qualificationFormHtml — voir commentaire la-bas.
  // Le booking passe desormais uniquement par "Booker au calendrier d'un closer" (al-book-btn).
  var submitBtn = main.querySelector('#ql-submit-btn');
  if(submitBtn) submitBtn.addEventListener('click', async function(){
    var payload = qlGatherPayload(main);
    var reasons = payload.reasons;
    // Validation cote client — miroir de la validation serveur (routes/index.js) pour un retour
    // instantane, MAIS sans bloquer sur le rendez-vous : le serveur accepte deja les sauvegardes
    // partielles (il persiste les reponses fournies et renvoie complete:false tant qu'il en manque
    // — voir le bloc `else` plus bas qui affiche "Enregistré, mais incomplet"). Bloquer ici tant que
    // le RDV n'etait pas booke/explique empechait d'enregistrer la fiche du tout avant le RDV, ce
    // qui etait le bug rapporte le 2026-07-16 : desormais on peut enregistrer la fiche meme si
    // aucun rendez-vous n'a encore ete pris.
    var missing = [];
    if(!payload.unitsCount.trim()) missing.push('le nombre de fenêtres/portes/sections');
    if(!payload.buildingType) missing.push('le type de bâtiment');
    if(!payload.sealantColor) missing.push('la couleur du scellant');
    if(payload.sealantColor==='Autre' && !payload.sealantColorOther.trim()) missing.push('la précision de couleur');
    if(!payload.language) missing.push('la langue');
    if(!reasons.length) missing.push('au moins une raison');
    if(reasons.indexOf('Autre')>-1 && !payload.reasonsOther.trim()) missing.push('la précision de raison');
    if(!payload.timeline) missing.push('l\'échéancier souhaité');
    if(payload.otherRenovations!=='Oui' && payload.otherRenovations!=='Non') missing.push('la réponse sur les autres rénovations');
    if(payload.otherRenovations==='Oui' && !payload.otherRenovationsWhich.trim()) missing.push('lesquelles rénovations');
    if(payload.otherRenovations==='Oui' && !payload.renovationPriority.trim()) missing.push('la priorité de rénovation');
    if(payload.decisionMakerInvolved!=='Oui' && payload.decisionMakerInvolved!=='Non') missing.push('la réponse sur le conjoint/famille');
    if(missing.length){ toast('Champs manquants: '+missing.join(', ')); return; }

    submitBtn.disabled=true;
    try{
      var res = await apiFetch('PATCH','/leads-crm/leads/'+l.id+'/qualification', payload);
      await Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]);
      if(res.complete){ toast('Fiche de qualification complétée!'); }
      else { toast('Enregistré, mais incomplet: '+(res.missing||[]).join(', ')); }
      openAdLeadSheet(l.id, false);
    }catch(e){ toast('Erreur: '+e.message); submitBtn.disabled=false; }
  });
}

// ── Selecteur de rendez-vous "clic direct dans le calendrier" (Leads CRM) — remplace les champs
// manuels date/heure : affiche le calendrier complet avec TOUS les rendez-vous deja planifies
// (porte-a-porte ET Leads CRM confondus, pour eviter tout double-booking peu importe l'origine)
// et cree/reprogramme le rendez-vous des qu'une plage horaire LIBRE est selectionnee — meme
// experience que le calendrier principal du CRM (buildMonthCalendar). onPicked(dateStr, hour) est
// appele apres selection ; c'est lui qui fait l'appel API reel (le contexte differe legerement
// entre "premiere prise de RDV depuis la fiche de qualification" et "reprogrammation").
// Creneaux aux 30 minutes, de 8h00 a 22h00 (10h pm) — demande owner 2026-08-02 (setters +
// Leads CRM partagent ce meme picker, voir openApptPickerSheet plus bas).
var LEAD_APPT_HOURS = [8,8.5,9,9.5,10,10.5,11,11.5,12,12.5,13,13.5,14,14.5,15,15.5,16,16.5,17,17.5,18,18.5,19,19.5,20,20.5,21,21.5,22];
// excludeAdLeadId : exclut un lead Leads CRM (table ad_leads) de son propre calcul d'occupation.
// excludeApptId : exclut un rendez-vous porte-à-porte (table appointments) du sien — indispensable
// pour la REPROGRAMMATION (sinon le RDV qu'on est en train de deplacer apparaitrait "occupe" par
// lui-meme sur son creneau actuel). Les deux tables sont toujours combinees pour le calcul —
// un seul calendrier d'occupation, peu importe l'origine du RDV.
// opts.closerId (optionnel) : quand fourni, ne compte comme "occupe" QUE les RDV de ce closer
// precis — sinon le calendrier melangeait les RDV de TOUS les closers ensemble, donc un ⚠
// pouvait apparaitre a cause d'un closer totalement different (faux positif) pendant qu'un
// creneau reellement charge chez LE closer visé ne se distinguait pas des autres (faux negatif).
// Demande utilisateur : le setter doit voir le calendrier du closer pour lequel il booke, pas un
// agrégat de tout le monde.
function computeBusyApptSlots(opts){
  opts = opts || {};
  var busy = {};
  // BUG corrige (2026-07-30) : S.appts (porte-a-porte, table `appointments`) stocke la date/heure
  // sous appt_date/appt_hour — PAS .date/.hour (ces derniers n'existent que sur les objets
  // transformes par normAppt() pour l'affichage). Le code lisait .date/.hour ici, donc AUCUN
  // rendez-vous porte-a-porte n'etait jamais compte comme occupe : le calendrier de selection
  // pouvait laisser booker un creneau deja pris cote D2D. Meme correctif applique dans
  // buildLeadApptCalGrid ci-dessus (comptage par jour).
  (S.appts||[]).forEach(function(a){
    if(opts.excludeApptId && String(a.id)===String(opts.excludeApptId)) return;
    if(!a.appt_date || a.appt_hour==null) return;
    if(opts.closerId && a.closer_id!==opts.closerId) return;
    busy[a.appt_date+'|'+a.appt_hour] = true;
  });
  (S.adLeads||[]).forEach(function(l){
    if(opts.excludeAdLeadId && String(l.id)===String(opts.excludeAdLeadId)) return;
    if(!l.appt_date || l.appt_hour==null) return;
    if(opts.closerId && l.closer_id!==opts.closerId) return;
    busy[l.appt_date+'|'+l.appt_hour] = true;
  });
  return busy;
}
// opts.closerId : meme filtre que computeBusyApptSlots — les pastilles "N RDV" du mini-calendrier
// mensuel ne comptent que les RDV du closer visé quand on en connait un.
function buildLeadApptCalGrid(state){
  var yr=state.year, mo=state.month;
  var today=new Date(); today.setHours(0,0,0,0);
  var map={};
  // Meme correctif de champ que computeBusyApptSlots : S.appts utilise appt_date, pas .date.
  (S.appts||[]).forEach(function(a){ if(a.appt_date && (!state.closerId||a.closer_id===state.closerId)) map[a.appt_date]=(map[a.appt_date]||0)+1; });
  (S.adLeads||[]).forEach(function(l){ if(l.appt_date && (!state.closerId||l.closer_id===state.closerId)) map[l.appt_date]=(map[l.appt_date]||0)+1; });

  var h='<div style="display:flex;align-items:center;padding:4px 0;gap:6px">'
    +'<button class="btn-sm" id="lac-prev">&#8249;</button>'
    +'<div style="flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--text)">'+MNAMES[mo]+' '+yr+'</div>'
    +'<button class="btn-sm" id="lac-next">&#8250;</button>'
    +'</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;margin-bottom:2px">';
  DNAMES.forEach(function(d){ h+='<div style="text-align:center;font-size:9px;font-weight:700;color:var(--text-faint);padding:3px 0">'+d+'</div>'; });
  h+='</div>';

  var firstDay=new Date(yr,mo,1).getDay();
  var daysInMonth=new Date(yr,mo+1,0).getDate();
  h+='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">';
  for(var x=0;x<firstDay;x++) h+='<div style="min-height:40px"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dt=new Date(yr,mo,d); dt.setHours(0,0,0,0);
    var isPast=dt.getTime()<today.getTime();
    var isToday=dt.getTime()===today.getTime();
    var isSel=state.selDate===ds;
    var count=map[ds]||0;
    h+='<div class="calday'+(isSel?' sel':isToday?' today':'')+'" data-lac-day="'+ds+'" style="min-height:40px;padding:2px;'+(isPast?'opacity:.35':'cursor:pointer')+'">'
      +'<div style="text-align:center;font-size:11px;font-weight:'+(isToday||isSel?'700':'400')+';color:'+(isToday||isSel?'#FF4D4D':'#999')+'">'+d+'</div>'
      +(count?'<div style="text-align:center;font-size:8px;color:#1D4ED8">'+count+' RDV</div>':'')
      +'</div>';
  }
  h+='</div>';
  return h;
}
// opts: { initialDate, excludeAdLeadId, excludeApptId, closerId, closerName } — generique aux deux
// CRM (voir les 3 points d'appel : prise de RDV Leads CRM, reprogrammation Leads CRM,
// reprogrammation porte-à-porte). closerId/closerName : quand connus (les 3 appelants les
// connaissent toujours — a.closerId ou l.closer_id), le calendrier se limite au calendrier de CE
// closer (voir computeBusyApptSlots/buildLeadApptCalGrid) et la liste de ses RDV du jour selectionne
// s'affiche en clair sous le mini-calendrier — demande utilisateur : le setter doit pouvoir voir les
// autres rendez-vous deja dans le calendrier de ce closer, pas juste un badge ⚠ agrégé tout closer
// confondu.
function openApptPickerSheet(opts, onPicked){
  opts = opts || {};
  var now=new Date();
  var state={ year: now.getFullYear(), month: now.getMonth(), selDate: null, closerId: opts.closerId||'' };
  if(opts.initialDate){
    var dp=new Date(opts.initialDate+'T12:00:00');
    state.year=dp.getFullYear(); state.month=dp.getMonth(); state.selDate=opts.initialDate;
  }
  function dayApptsForCloser(ds){
    if(!state.closerId || !ds) return [];
    var list=[];
    (S.appts||[]).forEach(function(a){
      if(opts.excludeApptId && String(a.id)===String(opts.excludeApptId)) return;
      if(a.closer_id!==state.closerId || a.appt_date!==ds) return;
      list.push({hour:a.appt_hour, name:(a.name||((a.lead_first_name||'')+' '+(a.lead_last_name||'')).trim())||'?'});
    });
    (S.adLeads||[]).forEach(function(l){
      if(opts.excludeAdLeadId && String(l.id)===String(opts.excludeAdLeadId)) return;
      if(l.closer_id!==state.closerId || l.appt_date!==ds) return;
      list.push({hour:l.appt_hour, name:adLeadName(l)});
    });
    return list.sort(function(a,b){ return (a.hour||0)-(b.hour||0); });
  }
  function renderPicker(){
    var busy=computeBusyApptSlots(opts);
    // Un creneau "occupe" reste cliquable (pas de "disabled") — demande utilisateur : pouvoir
    // booker plusieurs RDV sur la meme heure, typiquement un callback en parallele d'un RDV
    // normal. Le badge ⚠ + le texte informent seulement, ne bloquent plus rien.
    var h='<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Sélectionnez une plage horaire — le calendrier affiche les rendez-vous déjà planifiés'
      +(state.closerId?' pour '+htmlEsc(opts.closerName||'ce closer'):' (porte-à-porte et Leads CRM)')
      +' à titre indicatif ; plusieurs RDV peuvent être placés à la même heure (ex: un callback en même temps qu\'un RDV).</div>';
    h+=buildLeadApptCalGrid(state);
    if(state.selDate){
      var dp2=new Date(state.selDate+'T12:00:00');
      var dayAppts=dayApptsForCloser(state.selDate);
      h+='<div class="sdiv" style="margin-top:10px">'+DNAMES[dp2.getDay()]+' '+dp2.getDate()+' '+MNAMES[dp2.getMonth()]
        +(state.closerId?' — calendrier de '+htmlEsc(opts.closerName||'ce closer'):'')+'</div>';
      // Blocages d'horaire de ce closer pour ce jour (journee complete OU plage partielle avec
      // raison) — demande utilisateur : le setter doit aussi voir les blocages, pas seulement
      // les RDV deja pris. Voir isDateFullyBlocked/isDateHourBlocked (definis plus haut, portee
      // globale) et openBlackoutSheet pour la meme convention d'affichage.
      var dayBlackoutsPk = state.closerId ? (S.closerBlackouts||[]).filter(function(b){ return b.closer_id===state.closerId && b.date===state.selDate; }) : [];
      if(dayBlackoutsPk.length){
        h+='<div style="margin:6px 0">'+dayBlackoutsPk.map(function(b){
          return '<div style="background:#77777722;border-left:2px solid #777;border-radius:4px;padding:4px 7px;margin-bottom:3px;font-size:11px;color:#777;font-weight:700">🚫 '+(b.all_day?'Journée bloquée':fh(b.start_hour)+' - '+fh(b.end_hour))+(b.reason?' — '+htmlEsc(b.reason):'')+'</div>';
        }).join('')+'</div>';
      }
      if(state.closerId){
        h+= dayAppts.length
          ? '<div style="background:var(--surface-3);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:11px;color:var(--text-dim)">'
            + dayAppts.map(function(x){ return '<div style="padding:2px 0">'+fh(x.hour)+' — '+htmlEsc(x.name)+'</div>'; }).join('')
            + '</div>'
          : '<div style="font-size:11px;color:var(--text-faint);margin:6px 0">Aucun RDV pour ce closer ce jour — disponible.</div>';
      }
      h+='<div style="font-size:11px;color:var(--text-dim);margin-top:6px">Plages horaires</div>';
      h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px">';
      var fullyBlockedPk = state.closerId && isDateFullyBlocked(state.closerId, state.selDate);
      LEAD_APPT_HOURS.forEach(function(hh){
        var isBusy=!!busy[state.selDate+'|'+hh];
        var isBlocked = fullyBlockedPk || (state.closerId && isDateHourBlocked(state.closerId, state.selDate, hh));
        var style = isBlocked
          ? 'background:#77777722;border:1px solid #777;color:#777;cursor:not-allowed'
          : (isBusy?'background:#FEF3C7;border:1px solid #F5C542;color:var(--text);cursor:pointer':'background:var(--surface-3);border:1px solid var(--border);color:var(--text);cursor:pointer');
        h+='<button class="btn-sm" '+(isBlocked?'disabled':'data-pick-hour="'+hh+'"')+' style="padding:10px 4px;'+style+'">'+fh(hh)+(isBlocked?' 🚫':(isBusy?' ⚠':''))+'</button>';
      });
      h+='</div>';
    } else {
      h+='<div style="padding:12px;text-align:center;color:var(--text-faint);font-size:12px">Choisissez d\'abord une date</div>';
    }
    return h;
  }
  function bindPicker(){
    var body=document.getElementById('sh-body');
    body.querySelectorAll('[data-lac-day]').forEach(function(el){
      el.addEventListener('click', function(){
        state.selDate=this.dataset.lacDay;
        body.innerHTML=renderPicker();
        bindPicker();
      });
    });
    var prev=body.querySelector('#lac-prev');
    var next=body.querySelector('#lac-next');
    if(prev) prev.addEventListener('click', function(){
      state.month--; if(state.month<0){state.month=11; state.year--;}
      body.innerHTML=renderPicker(); bindPicker();
    });
    if(next) next.addEventListener('click', function(){
      state.month++; if(state.month>11){state.month=0; state.year++;}
      body.innerHTML=renderPicker(); bindPicker();
    });
    body.querySelectorAll('[data-pick-hour]').forEach(function(btn){
      btn.addEventListener('click', function(){
        onPicked(state.selDate, parseFloat(this.dataset.pickHour));
      });
    });
  }
  openSheet('Choisir un rendez-vous', renderPicker());
  bindPicker();
}

// ── Detail d'un lead : statuts, fiche de qualification, prise de RDV (calendrier reel d'un
// closer/team_leader_vente) et fermeture (deal) sont reserves au OWNER depuis le 2026-09-15 (voir
// requireQueueOwner cote serveur — PATCH .../leads/:id, .../qualification, POST .../book) : la
// section Queue est maintenant admin-only, demande utilisateur "seulement moi (admin) qui aille
// acces". Ask for Cost, notes horodatees et le televersement de quote restent disponibles au
// lead_closer/lead_marketing (garder tel quel, voir demande utilisateur) — seules ces trois
// actions restent visibles hors owner, via `!readOnly` (le param readOnly d'origine, jamais
// passe a true par les appelants actuels, reste un verrou total pour un futur usage). Toute
// l'info du formulaire du lead (ville, type de batiment, etat du calfeutrage, zones, details,
// source) est desormais affichee ici — demande utilisateur "voir tout les infos qu'ils ont
// remplis dans le lead form".
function openAdLeadSheet(idStr, readOnly){
  var id=String(idStr);
  var l=(S.adLeads||[]).find(function(x){ return String(x.id)===id; });
  if(!l){ toast('Lead introuvable'); return; }
  var viewerRole=(S.impersonate||S.user||{}).role;
  var isOwner = viewerRole==='owner';
  var col=STATUS_COL[l.status]||'#44AA44';
  var name=adLeadName(l);
  var srcIcon=AD_LEAD_SRC_ICON[l.source]||'📣';
  var statuses=['New','Contacted','Appointment Set','No Show','Left Quote','Closed Won','Closed Lost','Not Qualified'];
  var quoteUrls = Array.isArray(l.quote_image_urls) ? l.quote_image_urls : [];
  var h='<div style="background:var(--surface-3);border-radius:9px;padding:11px;margin-bottom:10px">'
    +'<div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px">'+htmlEsc(name)+'</div>'
    +'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">'+srcIcon+' '+htmlEsc(l.source||'Autre')+'</div>'
    +'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">Tel: '+(l.phone?phoneLinkHtml(l.phone):'—')+'</div>'
    +(l.email?'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">Email: '+htmlEsc(l.email)+'</div>':'')
    +(l.appt_date?'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">RDV: '+l.appt_date+' · '+fh(l.appt_hour!=null?l.appt_hour:14)+(l.appointment_id?' 📅':'')+'</div>':'')
    +'<span class="badge" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'">'+l.status+'</span>'
    +(l.closer_name?'<div style="font-size:10px;color:var(--text-faint);margin-top:5px">Lead closer: '+htmlEsc(l.closer_name)+'</div>':'')
    +(l.notes?'<div style="font-size:10px;color:var(--text-faint);margin-top:2px">'+htmlEsc(l.notes)+'</div>':'')
    +'</div>';

  // Reponses du formulaire du site (voir insertAdLead()/POST /webhooks/ad-leads cote serveur) —
  // ville, type de batiment, etat du calfeutrage existant, zones a calfeutrer, details du projet,
  // source precise du formulaire. N'apparait que si au moins un champ est rempli (les leads plus
  // anciens ou ajoutes manuellement n'en ont souvent aucun).
  if(l.city || l.building_type || l.calfeutrage_condition || l.zones_to_seal || l.project_details || l.form_source){
    h += '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 5px;border-top:1px solid var(--border);margin-top:2px">Formulaire du site</div>'
      + (l.city?ir('Ville', htmlEsc(l.city)):'')
      + (l.building_type?ir('Type de bâtiment', htmlEsc(l.building_type)):'')
      + (l.calfeutrage_condition?ir('État du calfeutrage', htmlEsc(l.calfeutrage_condition)):'')
      + (l.zones_to_seal?ir('Zones à calfeutrer', htmlEsc(l.zones_to_seal)):'')
      + (l.project_details?ir('Détails du projet', htmlEsc(l.project_details)):'')
      + (l.form_source?ir('Source du formulaire', htmlEsc(l.form_source)):'');
  }

  // Fiche de qualification — s'affiche EN PREMIER (avant Quote/Notes/Statut) tant qu'elle n'est
  // pas completee : c'est le "pop-up" de la demande, en pratique la premiere chose vue en ouvrant
  // le lead. Reservee au owner (edition) — les autres roles voient toujours le resume en lecture
  // seule, meme lead non qualifie (voir requireQueueOwner cote serveur).
  h+='<div id="ql-section">';
  h += (isOwner && !readOnly && !isLeadQualified(l)) ? qualificationFormHtml(l) : qualificationSummaryHtml(l);
  h+='</div>';

  // Quote (image) — toujours visible/consultable des qu'une soumission existe, peu importe
  // l'etape actuelle du lead (Left Quote ou une etape ulterieure comme Closed Won/Lost).
  h+='<div class="sdiv">Quote (soumission)</div>';
  if(quoteUrls.length){
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px">'+quoteUrls.map(function(u){
      return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="Quote" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)"></a>';
    }).join('')+'</div>';
  } else {
    h+='<div style="font-size:11px;color:var(--text-dim);margin:4px 0 8px">Aucune soumission televersee</div>';
  }
  if(!readOnly){
    h+='<input type="file" id="al-quote-photos" accept="image/*" multiple style="display:block;margin-bottom:6px;font-size:11px;color:var(--text-dim)">'
      +'<button class="btn" id="al-upload-quote-btn" style="background:var(--surface-3);border:1px solid var(--border);margin-bottom:4px">Televerser la soumission</button>';
  }

  // Notes horodatees — historique append-only (voir /leads-crm/leads/:id/notes), distinct du
  // champ "notes" libre affiche plus haut. La liste est chargee de facon asynchrone apres
  // l'ouverture de la sheet (voir loadAdLeadNotes ci-dessous), y compris en lecture seule.
  h+='<div class="sdiv" style="margin-top:4px">Notes</div>'
    +'<div id="al-notes-list" style="margin:6px 0;max-height:180px;overflow-y:auto">Chargement...</div>';
  if(!readOnly){
    h+='<textarea id="al-note-input" placeholder="Ajouter une note (avant/apres le RDV, a tout moment)..." style="width:100%;min-height:56px"></textarea>'
      +'<button class="btn" id="al-add-note-btn" style="margin-top:4px;margin-bottom:4px;background:var(--surface-3);border:1px solid var(--border)">Ajouter la note</button>';
  }

  if(isOwner && !readOnly){
    h+='<div class="sdiv" style="margin-top:8px">Statut</div>'
      +'<div class="scgrid">'+statuses.map(function(s){ return '<button class="scc'+(l.status===s?' on':'')+'" data-set-adlead-status="'+s+'">'+s+'</button>'; }).join('')+'</div>';
    // Booking dans le VRAI calendrier d'un closer/team_leader_vente — demande utilisateur : "une
    // option pour booker le rendez vous dans l'horraire d'un des closer ou du team lead ventes".
    // Remplace l'ancienne prise de RDV "autonome" (simple champ appt_date/appt_hour) : voir POST
    // /leads-crm/leads/:id/book, qui cree une vraie ligne leads+appointments (meme mecanisme que
    // le porte-a-porte/Référencement) et relie ad_leads.appointment_id — c'est ce lien qui permet
    // ensuite au statut de se resynchroniser automatiquement quand le closer ferme le RDV
    // (Closed Won/Lost, voir PATCH /appointments/:id cote serveur).
    h+='<div class="sdiv" style="margin-top:8px">Rendez-vous</div>';
    if(l.appointment_id){
      h+='<div style="font-size:11px;color:#15803D;margin-bottom:4px">✓ RDV bloqué au calendrier'+(l.closer_name?' de '+htmlEsc(l.closer_name):'')+(l.appt_date?' — '+l.appt_date+' · '+fh(l.appt_hour!=null?l.appt_hour:14):'')+'</div>';
    }
    h+='<button class="btn btn-green" id="al-book-btn">📅 '+(l.appointment_id?'Reprogrammer':'Booker')+' au calendrier d\'un closer</button>';
    h+='<button class="btn" id="al-ask-cost-btn" style="margin-top:6px;background:var(--surface-3);border:1px solid #DE1212;color:#DE1212">Ask for Cost</button>';
    // Bouton persistant (meme logique que le "Creer un Deal" du CRM porte-a-porte, voir
    // openApptSheet ligne ~3397) : sans lui, le seul chemin pour creer le deal/ticket
    // d'installation etait la sheet auto-ouverte juste apres le clic "Closed Won" — si elle etait
    // fermee sans soumettre (photo/prix manquant, fermeture accidentelle), il n'y avait plus AUCUN
    // moyen de revenir dessus et le lead restait "Closed Won" sans jamais generer de ticket pour le
    // gestionnaire d'installation. Voir signalement utilisateur : "les deals de CRM leads
    // n'atterrissent pas dans la queue du gestionnaire d'installation".
    if(l.status==='Closed Won'){
      var hasDeal = (S.deals||[]).some(function(d){ return String(d.ad_lead_id)===String(l.id); });
      h += hasDeal
        ? '<div style="margin-top:6px;font-size:11px;color:#15803D">✓ Deal créé — ce lead a bien un dossier d\'installation.</div>'
        : '<button class="btn btn-green" id="al-deal-btn" style="margin-top:6px">Créer un Deal</button>';
    }
  } else if(!readOnly){
    // Non-owner (lead_marketing/lead_closer) : Queue devenue owner-only, mais on garde Ask for
    // Cost — demande utilisateur explicite de ne pas casser leur pipeline de cost/installation.
    h+='<button class="btn" id="al-ask-cost-btn" style="margin-top:8px;background:var(--surface-3);border:1px solid #DE1212;color:#DE1212">Ask for Cost</button>';
  }
  openSheet('Lead', h);
  setTimeout(function(){ loadAdLeadNotes(l.id); }, 0);
  if(readOnly) return;
  setTimeout(function(){
    var sheetMain = document.getElementById('sh-body');
    if(isOwner && !isLeadQualified(l)) bindQualificationForm(sheetMain||document, l);
    document.querySelectorAll('[data-set-adlead-status]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var s=this.dataset.setAdleadStatus;
        if(qualificationBlocksStatusChange(l, s)){
          toast(QUALIFICATION_LOCK_MESSAGE);
          var qlSection=document.getElementById('ql-section');
          if(qlSection && qlSection.scrollIntoView) qlSection.scrollIntoView({behavior:'smooth', block:'start'});
          return;
        }
        // "Appointment Set" doit toujours passer par le booking dans le vrai calendrier d'un
        // closer/team_leader_vente (POST /leads-crm/leads/:id/book, meme sheet que le bouton
        // "Booker au calendrier d'un closer" plus bas) plutot qu'un simple PATCH de statut — sinon
        // le lead se retrouvait "Appointment Set" sans aucun RDV reellement bloque a l'horaire
        // d'un closer. Voir demande utilisateur "quand je clique sur appointment set je dois
        // pouvoir placer le rendez-vous dans l'horaire d'un des closers". Le statut se met a jour
        // automatiquement cote serveur une fois le RDV booke (voir POST /book, nextStatus).
        if(s==='Appointment Set'){ openAdLeadBookSheet(l); return; }
        try{
          await apiFetch('PATCH','/leads-crm/leads/'+l.id,{status:s, claim:true});
          await Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]);
          toast('Statut: '+s);
          if(s==='Closed Won'){ closeSheet(); openAdLeadDealSheet(l); }
          else { openAdLeadSheet(l.id); }
        }catch(e){ toast('Erreur: '+e.message); }
      });
    });
    // Booking dans le vrai calendrier d'un closer/team_leader_vente — voir openAdLeadBookSheet
    // (picker closer + date/heure) et POST /leads-crm/leads/:id/book cote serveur.
    var bookBtn=document.getElementById('al-book-btn');
    if(bookBtn) bookBtn.addEventListener('click', function(){ openAdLeadBookSheet(l); });
    var askCostBtn=document.getElementById('al-ask-cost-btn');
    if(askCostBtn) askCostBtn.addEventListener('click', function(){
      closeSheet();
      openAskCostSheet({id:l.id, name:name, addr:''}, 'adlead');
    });
    var alDealBtn=document.getElementById('al-deal-btn');
    if(alDealBtn) alDealBtn.addEventListener('click', function(){ closeSheet(); openAdLeadDealSheet(l); });
    var uploadQuoteBtn=document.getElementById('al-upload-quote-btn');
    if(uploadQuoteBtn) uploadQuoteBtn.addEventListener('click', async function(){
      var input=document.getElementById('al-quote-photos');
      if(!input || !input.files.length){ toast('Choisir au moins une image'); return; }
      uploadQuoteBtn.disabled=true;
      try{
        var uploaded = await uploadPhotosBatched(input.files, 'quotes', uploadQuoteBtn, 'Televersement');
        var newUrls = uploaded.map(function(p){ return p.url; });
        var existing = Array.isArray(l.quote_image_urls) ? l.quote_image_urls : [];
        await apiFetch('PATCH','/leads-crm/leads/'+l.id,{quoteImageUrls: existing.concat(newUrls)});
        await Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]);
        toast('Soumission ajoutee!');
        openAdLeadSheet(l.id, false);
      }catch(e){ toast('Erreur: '+e.message); uploadQuoteBtn.disabled=false; }
    });
    var addNoteBtn=document.getElementById('al-add-note-btn');
    if(addNoteBtn) addNoteBtn.addEventListener('click', async function(){
      var inputEl=document.getElementById('al-note-input');
      var body=inputEl ? inputEl.value.trim() : '';
      if(!body){ toast('Ecrire une note avant d\'ajouter'); return; }
      addNoteBtn.disabled=true;
      try{
        await apiFetch('POST','/leads-crm/leads/'+l.id+'/notes',{body: body});
        toast('Note ajoutee');
        if(inputEl) inputEl.value='';
        loadAdLeadNotes(l.id);
      }catch(e){ toast('Erreur: '+e.message); }
      addNoteBtn.disabled=false;
    });
  },0);
}

// ── Booker un lead marketing dans le VRAI calendrier d'un closer/team_leader_vente (owner
// uniquement, voir requireQueueOwner et POST /leads-crm/leads/:id/book cote serveur) — remplace
// l'ancienne prise de RDV "autonome" (apptDate/apptHour directement sur ad_leads, jamais visible
// dans l'horaire du closer). Formulaire simple (closer + date + heure), meme convention que la
// fiche référencement (doBookReferralLead) plutot que le calendrier "clic direct" complet, pour
// garder l'action rapide depuis la fiche du lead.
function openAdLeadBookSheet(l){
  var closers = (S.users||[]).filter(function(u){ return (u.role==='closer'||u.role==='team_leader_vente') && u.status==='active'; })
    .sort(function(a,b){ return (a.first_name||'').localeCompare(b.first_name||''); });
  var opts = '<option value="">— Choisir —</option>' + closers.map(function(c){
    return '<option value="'+c.id+'"'+(c.id===l.closer_id?' selected':'')+'>'+htmlEsc(c.first_name+' '+c.last_name)+'</option>';
  }).join('');
  // Demande utilisateur : voir le calendrier COMPLET du closer (RDV existants + blocages
  // d'horaire) avant de choisir la date/heure, pour ne jamais double-booker ni prendre un
  // creneau ou le closer n'est pas disponible — l'ancien formulaire (date/heure en simples
  // champs, sans aucune visibilite sur l'horaire reel) ne montrait rien de tout ca. On choisit
  // maintenant le closer/ville ici, puis on ouvre le meme calendrier complet que le reste du CRM
  // (openApptPickerSheet, deja utilise pour le reschedule et l'ancien picker de la fiche de
  // qualification) scope a ce closer, avant de confirmer le POST /book.
  var h = '<div class="field"><label>Closer / Team lead ventes *</label><select id="alb-closer">'+opts+'</select></div>'
    + '<div class="field"><label>Ville'+(l.city?'':' *')+'</label><input id="alb-city" value="'+htmlEsc(l.city||'')+'"></div>'
    + '<button class="btn btn-green" id="alb-view-cal-btn">📅 Voir le calendrier du closer et choisir un créneau</button>';
  openSheet('Booker le rendez-vous', h);
  setTimeout(function(){
    var viewCalBtn=document.getElementById('alb-view-cal-btn');
    if(viewCalBtn) viewCalBtn.addEventListener('click', function(){
      var closerId=(document.getElementById('alb-closer')||{}).value||'';
      var city=(document.getElementById('alb-city')||{}).value||'';
      if(!closerId){ toast('Choisir un closer'); return; }
      var closer = closers.find(function(c){ return String(c.id)===String(closerId); });
      var closerName = closer ? (closer.first_name+' '+closer.last_name) : '';
      openApptPickerSheet({initialDate:l.appt_date, excludeAdLeadId:l.id, closerId:closerId, closerName:closerName}, async function(dateStr, hour){
        try{
          await apiFetch('POST','/leads-crm/leads/'+l.id+'/book',{closerId:closerId, apptDate:dateStr, apptHour:hour, city:city});
          toast('Rendez-vous booké!');
          await Promise.all([loadLeadsCrmData(), reloadAppts(), reloadLeads(), reloadMasterDbIfOwner()]);
          closeSheet();
          openAdLeadSheet(l.id);
        }catch(e){ toast('Erreur: '+e.message); }
      });
    });
  },0);
}

// Formatte un timestamp SQLite ("YYYY-MM-DD HH:MM:SS", heure serveur/UTC) en date+heure locale
// lisible pour l'historique de notes.
function fmtNoteTs(ts){
  var d = new Date((ts||'').replace(' ','T')+'Z');
  if(isNaN(d.getTime())) return ts||'';
  return d.toLocaleDateString('fr-CA')+' '+d.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
}
// Charge et affiche l'historique de notes horodatees d'un lead (voir GET
// /leads-crm/leads/:id/notes) — appele a chaque ouverture de la sheet, lecture seule incluse.
async function loadAdLeadNotes(leadId){
  var container=document.getElementById('al-notes-list');
  if(!container) return;
  try{
    var notes = await apiFetch('GET','/leads-crm/leads/'+leadId+'/notes');
    if(!notes.length){ container.innerHTML='<div style="font-size:11px;color:var(--text-dim)">Aucune note</div>'; return; }
    container.innerHTML = notes.map(function(n){
      return '<div style="border-bottom:1px solid var(--border);padding:5px 0">'
        +'<div style="font-size:9px;color:var(--text-dim)">'+fmtNoteTs(n.created_at)+' · '+htmlEsc(n.author_name||'—')+'</div>'
        +'<div style="font-size:12px;color:var(--text);white-space:pre-wrap">'+htmlEsc(n.body)+'</div>'
        +'</div>';
    }).join('');
  }catch(e){
    container.innerHTML='<div style="font-size:11px;color:#CC3333">Erreur de chargement des notes</div>';
  }
}

// Fermeture d'un lead = meme formulaire de deal que le CRM porte-a-porte (openDealSheet),
// juste sans la section "Representants" (le closer est deduit automatiquement cote serveur).
function openAdLeadDealSheet(l){
  openDealSheet(null, {
    adLeadId: l.id,
    hideReps: true,
    prefill: { name: adLeadName(l), phone: l.phone, email: l.email },
  });
}

// UTILITY
// ═══════════════════════════════════════════
function htmlEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Normalize appointment — API returns appt_date/appt_hour, local uses date/hour
// Bloc "Fiche de qualification" affiche dans le RDV du closer (openApptSheet) pour un RDV issu
// d'un lead marketing/Leads CRM — voir normAppt (champs qual*) et demande utilisateur "quand je
// book le lead dans l'horaire d'un closer, il doit voir toutes les infos de la fiche de
// prequalification". Rien ne s'affiche si le RDV n'a pas d'origine Leads CRM ou si la fiche n'a
// pas encore ete remplie (aucun champ qual* rempli).
function apptQualificationInfoHtml(a){
  if(!a.adLeadId) return '';
  var reasons = (a.qualReasons||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var rows = [
    ['Type de bâtiment', a.qualBuildingType2 || a.qualBuildingType],
    ['État du calfeutrage', a.qualCalfeutrageCondition],
    ['Zones à calfeutrer', a.qualZonesToSeal],
    ['Détails du projet', a.qualProjectDetails],
    ['Fenêtres/portes/sections', a.qualUnitsCount],
    ['Couleur du scellant', a.qualSealantColor==='Autre' ? a.qualSealantColorOther : a.qualSealantColor],
    ['Langue', a.qualLanguage],
    ['Raison(s)', reasons.indexOf('Autre')>-1 ? reasons.filter(function(r){return r!=='Autre';}).concat([a.qualReasonsOther]).join(', ') : reasons.join(', ')],
    ['Échéancier souhaité', a.qualTimeline],
    ['Autres rénovations prévues', a.qualOtherRenovations + (a.qualOtherRenovations==='Oui' ? ' — '+(a.qualOtherRenovationsWhich||'') : '')],
    ['Priorité rénovation', a.qualOtherRenovations==='Oui' ? a.qualRenovationPriority : ''],
    ['Conjoint/famille impliqué', a.qualDecisionMakerInvolved],
  ].filter(function(r){ return r[1] && String(r[1]).trim(); });
  if(!rows.length) return '';
  return '<div class="sdiv">📋 Fiche de qualification (lead marketing)</div>'
    + '<div style="background:var(--surface-3);border-radius:9px;padding:9px;margin:6px 0 10px">'
    + rows.map(function(r){ return ir(htmlEsc(r[0]), htmlEsc(String(r[1]))); }).join('')
    + '</div>';
}
function normAppt(a){
  return {
    id: a.id,
    name: a.name,
    firstName: a.lead_first_name||a.firstName||'',
    lastName: a.lead_last_name||a.lastName||'',
    phone: a.phone,
    email: a.email||'',
    addr: a.address||a.addr||'',
    city: a.city||'',
    postal: a.postal||'',
    setter: a.setter_name||a.setter||'',
    setterId: a.setter_id||a.setterId||'',
    closerId: a.closer_id||a.closerId||'',
    closerName: a.closer_name||a.closerName||'',
    notes: a.notes||'',
    date: a.appt_date||a.date||'',
    hour: a.appt_hour!=null?a.appt_hour:(a.hour||14),
    status: a.status||'Scheduled',
    photoUrls: Array.isArray(a.photo_urls)?a.photo_urls:(Array.isArray(a.photoUrls)?a.photoUrls:[]),
    // Raisons associees au verrou de changement de statut (Cancelled/Callback/Rescheduled/Closed
    // Lost) — demande utilisateur : closers/setters doivent justifier ces statuts avant de les
    // appliquer. Voir apptStatusGateFormHtml() et isApptStatusLockBlocking() cote serveur.
    cancellationReason: a.cancellation_reason||'',
    objection: a.objection||'',
    callbackNotes: a.callback_notes||'',
    rescheduleReason: a.reschedule_reason||'',
    closedLostReason: a.closed_lost_reason||'',
    // RDV issu d'un lead marketing (Leads CRM/ad_leads, voir POST /leads-crm/leads/:id/book) —
    // porte aussi les reponses de la fiche de qualification remplie par l'admin avant le booking,
    // pour que le closer les voie directement dans son propre RDV (demande utilisateur : "quand je
    // book le lead dans l'horaire d'un closer, il doit voir toutes les infos de la fiche de
    // prequalification").
    adLeadId: a.ad_lead_id||'',
    qualBuildingType2: a.al_building_type||'',
    qualCalfeutrageCondition: a.al_calfeutrage_condition||'',
    qualZonesToSeal: a.al_zones_to_seal||'',
    qualProjectDetails: a.al_project_details||'',
    qualUnitsCount: a.qual_units_count||'',
    qualBuildingType: a.qual_building_type||'',
    qualSealantColor: a.qual_sealant_color||'',
    qualSealantColorOther: a.qual_sealant_color_other||'',
    qualLanguage: a.qual_language||'',
    qualReasons: a.qual_reasons||'',
    qualReasonsOther: a.qual_reasons_other||'',
    qualTimeline: a.qual_timeline||'',
    qualOtherRenovations: a.qual_other_renovations||'',
    qualOtherRenovationsWhich: a.qual_other_renovations_which||'',
    qualRenovationPriority: a.qual_renovation_priority||'',
    qualDecisionMakerInvolved: a.qual_decision_maker_involved||'',
  };
}
function normLead(l){
  return {
    id: l.id,
    av: l.first_name?l.first_name[0]+(l.last_name?l.last_name[0]:''):'?',
    name: l.first_name&&l.last_name?l.first_name+' '+l.last_name:(l.name||''),
    addr: (l.address||l.addr||'')+(l.city?', '+l.city:''),
    phone: l.phone||'',
    setter: l.setter_name_full||l.setter||'',
    setterId: l.setter_id||l.setterId||'',
    closerId: l.closer_id||l.closerId||'',
    status: l.status||'Scheduled',
    date: l.appt_date||l.date||'',
  };
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
(async function init(){
  loadSavedData();
  S.crmMode = localStorage.getItem('protek_crm_mode') || null;

  // Lien "mot de passe oublié" cliqué depuis l'email (?resetToken=...) — prend TOUJOURS priorite
  // sur l'etat de connexion courant (meme deja connecte ailleurs) : bascule directement sur l'ecran
  // de choix du nouveau mot de passe, sans toucher au reste de l'init (pas besoin d'etre
  // authentifie pour reinitialiser). On retire le token de l'URL immediatement (history.replaceState)
  // pour qu'il ne reste jamais visible/partageable dans la barre d'adresse ou l'historique.
  var urlParams = new URLSearchParams(location.search);
  var resetTokenFromUrl = urlParams.get('resetToken');
  if(resetTokenFromUrl){
    S.resetToken = resetTokenFromUrl;
    S.view = 'resetPassword';
    if(window.history && window.history.replaceState){
      window.history.replaceState({}, document.title, location.pathname);
    }
    bindStaticShellEvents();
    render();
    return;
  }

  if(TOKEN){
    try {
      // Always fetch fresh user data from server — never trust localStorage cache
      var freshUser = await apiFetch('GET', '/auth/me');
      // Mini-app Soumission Calfeutrage — meme garde qu'a la connexion (voir doLogin()), pour une
      // session deja ouverte (token en localStorage) qui n'appartient pas a un owner.
      if(IS_SC_APP && freshUser.role!=='owner'){
        throw new Error('Acces reserve aux administrateurs.');
      }
      // Re-deriver le mode CRM depuis le role reel (jamais faire confiance au localStorage seul).
      // CRM unique pour l'admin — demande utilisateur 2026-09-27 : "je ne veux pas avoir besoin de
      // login et relog out a chaque fois pour aller dans leads crm et door crm". L'owner est
      // TOUJOURS fige sur 'd2d' (Field Sales CRM), qui est maintenant la seule vue admin — elle
      // inclut deja Queue (leads) et Cost fusionne (voir render()/renderInner() et buildChatPage).
      // On ignore volontairement tout protek_crm_mode='leads' laisse par une session precedente.
      var mode = roleCrmMode(freshUser.role);
      if(freshUser.role==='owner') S.crmMode = 'd2d';
      else if(mode!=='either') S.crmMode = mode;
      else if(!S.crmMode) S.crmMode = 'd2d';
      localStorage.setItem('protek_crm_mode', S.crmMode);
      // Memorise la famille CRM de ce compte sur cet appareil — purement cosmetique (branding de
      // l'ecran de connexion la prochaine fois), n'affecte plus l'acces (voir doLogin()).
      localStorage.setItem('protek_last_crm_family', S.crmMode);
      S.user = freshUser;
      localStorage.setItem('protek_user', JSON.stringify(freshUser));
      S.view = freshUser.status === 'pending' ? 'pending' : 'app';
      if(S.view === 'app'){
        await Promise.all([loadLeadsAndAppts(), loadUsers()]); // independants -> en parallele
        startPolling();
        ensurePushSubscription(); // resync silencieux a chaque reprise de session — voir commentaire ci-dessus
      }
    } catch(e) {
      // Token invalid or expired — force re-login. Demande utilisateur 2026-09-28 "je veux que
      // pour tout le monde ca soit le login direct" : direct sur l'ecran de connexion, plus jamais
      // l'ecran "Choisir un CRM" (celui-ci reste accessible via le lien "Changer de CRM" si besoin).
      TOKEN = null;
      localStorage.removeItem('protek_token');
      localStorage.removeItem('protek_user');
      S.crmMode = localStorage.getItem('protek_last_crm_family') || 'd2d';
      S.view = 'login';
    }
  } else {
    // Pas de session active (premiere visite ou deconnecte) — login direct pour tout le monde,
    // demande utilisateur 2026-09-28 "je veux que pour tout le monde ca soit le login direct".
    // L'ecran "Choisir un CRM" ne s'affiche plus jamais au chargement, meme sur un appareil tout
    // neuf qui n'a jamais servi (S.view demarre deja sur 'login', voir l'objet S plus haut) — on
    // utilise juste la famille memorisee sur cet appareil pour le branding par defaut ("Field
    // Sales CRM" vs "Leads CRM"), sans consequence sur l'acces (voir doLogin() : le role reel du
    // compte fait toujours foi). Le lien "Changer de CRM" sur l'ecran de connexion reste
    // disponible pour qui a vraiment besoin de choisir explicitement (double-role, poste partage).
    S.crmMode = localStorage.getItem('protek_last_crm_family') || 'd2d';
    S.view = 'login';
  }
  bindStaticShellEvents();
  render();
})();

// ═══════════════════════════════════════════
// RÉFÉRENCEMENT — leads de recommandation client (calfeutrageprotek.com/referencement).
// Visible uniquement owner/team_leader_vente (assignent à un closer) et closer (voit + booke
// SES leads assignés) — voir demande utilisateur. Filtrage par closer déjà fait côté serveur
// (GET /referencement/leads), ceci n'est que l'affichage.
// ═══════════════════════════════════════════
function buildReferencementPage(){
  var role = (S.impersonate||S.user||{}).role;
  var isAdmin = role==='owner'||role==='team_leader_vente';
  var rows = S.referralLeads||[];
  var h = stats([
    ['Nouveaux', rows.filter(function(r){return r.status==='Nouveau';}).length, '#CCAA00', ''],
    ['Assignés', rows.filter(function(r){return r.status==='Assigné';}).length, '#5599DD', ''],
    ['Bookés', rows.filter(function(r){return r.status==='Booké';}).length, '#44AA44', ''],
  ]);
  h += card('Référencement'+(isAdmin?'':' — mes leads'), rows.length ? rows.map(function(r){
    return '<div class="row" data-ref-id="'+r.id+'">'
      +'<div class="rav">'+htmlEsc(((r.first_name||'?')[0]||'?').toUpperCase())+'</div>'
      +'<div class="rmain"><div class="rn">'+htmlEsc((r.first_name||'')+' '+(r.last_name||''))+'</div>'
      +'<div class="rs">'+phoneLinkHtml(r.phone)+(r.city?' · '+htmlEsc(r.city):'')+(isAdmin&&r.closer_name?' · '+htmlEsc(r.closer_name):'')+'</div></div>'
      +'<div>'+bdg(r.status)+'</div></div>';
  }).join('') : empty('Aucun lead de référencement pour le moment'));
  return h;
}

function attachReferencementEvents(main){
  main.querySelectorAll('[data-ref-id]').forEach(function(el){
    el.addEventListener('click', function(){ openReferralLeadSheet(this.dataset.refId); });
  });
}

function openReferralLeadSheet(id){
  var lead = (S.referralLeads||[]).find(function(r){ return String(r.id)===String(id); });
  if(!lead) return;
  var role = (S.impersonate||S.user||{}).role;
  var me = (S.impersonate||S.user||{});
  var isAdmin = role==='owner'||role==='team_leader_vente';
  var h = ir('Nom', htmlEsc((lead.first_name||'')+' '+(lead.last_name||'')))
    + ir('Téléphone', phoneLinkHtml(lead.phone))
    + (lead.email?ir('Email', htmlEsc(lead.email)):'')
    + (lead.address?ir('Adresse', htmlEsc(lead.address)):'')
    + (lead.city?ir('Ville', htmlEsc(lead.city)):'')
    + ir('Statut', bdg(lead.status))
    + (lead.closer_name?ir('Closer', htmlEsc(lead.closer_name)):'')
    + (lead.notes?ir('Notes', htmlEsc(lead.notes)):'');

  // Réponses du référent (la personne qui a fait la référence, distincte du lead ci-dessus qui
  // est la personne référée) — demande utilisateur 2026-09-14 : chaque réponse du formulaire
  // /referencement doit être visible séparément dans la fiche, pas noyée dans un seul champ.
  if(lead.referrer_name || lead.referrer_phone || lead.referrer_email || lead.rep_name){
    h += '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 5px;border-top:1px solid var(--border);margin-top:8px">Référé par</div>'
      + (lead.referrer_name?ir('Nom du référent', htmlEsc(lead.referrer_name)):'')
      + (lead.referrer_phone?ir('Téléphone du référent', phoneLinkHtml(lead.referrer_phone)):'')
      + (lead.referrer_email?ir('Courriel du référent', htmlEsc(lead.referrer_email)):'')
      + (lead.rep_name?ir('Représentant', htmlEsc(lead.rep_name)):'');
  }

  if(isAdmin){
    var closers = (S.users||[]).filter(function(c){ return c.role==='closer' && c.status==='active'; })
      .sort(function(a,b){ return (a.first_name||'').localeCompare(b.first_name||''); });
    var opts = '<option value="">— Choisir —</option>' + closers.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===lead.closer_id?' selected':'')+'>'+htmlEsc(c.first_name+' '+c.last_name)+'</option>';
    }).join('');
    h += '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 5px;border-top:1px solid var(--border);margin-top:8px">Assigner à un closer</div>'
      + '<div class="field"><select id="ref-closer-sel">'+opts+'</select></div>'
      + '<button class="btn btn-red" id="ref-assign-btn">'+(lead.closer_id?'Réassigner':'Assigner')+'</button>';
  }

  if(role==='closer' && lead.closer_id===me.id && lead.status!=='Booké' && lead.status!=='Ferme' && lead.status!=='Perdu'){
    h += '<div style="font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;padding:10px 0 5px;border-top:1px solid var(--border);margin-top:8px">Booker le rendez-vous</div>'
      + '<div class="frow"><div class="field"><label>Date *</label><input type="date" id="ref-date"></div>'
      + '<div class="field"><label>Heure *</label><select id="ref-time">'
      + LEAD_APPT_HOURS.map(function(hh){ return '<option value="'+hh+'"'+(hh===14?' selected':'')+'>'+fh(hh)+'</option>'; }).join('')
      + '</select></div></div>'
      + '<div class="field"><label>Adresse</label><input id="ref-addr" value="'+htmlEsc(lead.address||'')+'"></div>'
      + '<div class="field"><label>Ville'+(lead.city?'':' *')+'</label><input id="ref-city" value="'+htmlEsc(lead.city||'')+'"></div>'
      + '<button class="btn btn-red" id="ref-book-btn">Booker RDV</button>';
  }

  if((isAdmin||(role==='closer'&&lead.closer_id===me.id)) && lead.status!=='Booké' && lead.status!=='Ferme' && lead.status!=='Perdu'){
    h += '<button class="btn-sm" id="ref-lost-btn" style="margin-top:10px;width:100%">Marquer perdu</button>';
  }

  // Suppression — owner UNIQUEMENT (demande utilisateur : "role admin seulement"), jamais
  // team_leader_vente ni closer, contrairement au reste de la fiche ci-dessus qui les autorise
  // pour assigner/gerer. Voir DELETE /referencement/leads/:id cote serveur (requireOwner strict).
  if(role==='owner'){
    h += '<button class="btn-sm" id="ref-delete-btn" style="margin-top:10px;width:100%;background:#FEE2E2;border:1px solid #CC3333;color:#CC3333">🗑️ Supprimer ce lead</button>';
  }

  openSheet('Lead référencement', h);
  setTimeout(function(){
    var aBtn=document.getElementById('ref-assign-btn');
    if(aBtn) aBtn.addEventListener('click', function(){ doAssignReferralLead(lead.id); });
    var bBtn=document.getElementById('ref-book-btn');
    if(bBtn) bBtn.addEventListener('click', function(){ doBookReferralLead(lead.id); });
    var lBtn=document.getElementById('ref-lost-btn');
    if(lBtn) lBtn.addEventListener('click', function(){ doUpdateReferralLeadStatus(lead.id, 'Perdu'); });
    var dBtn=document.getElementById('ref-delete-btn');
    if(dBtn) dBtn.addEventListener('click', function(){ doDeleteReferralLead(lead.id); });
  },0);
}

async function doAssignReferralLead(id){
  var sel=document.getElementById('ref-closer-sel');
  var closerId=sel?sel.value:'';
  if(!closerId){ toast('Choisir un closer'); return; }
  var btn=document.getElementById('ref-assign-btn');
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    await apiFetch('PATCH','/referencement/leads/'+id+'/assign',{closerId:closerId});
    toast('Lead assigné');
    closeSheet();
    await reloadReferralLeads();
    render();
  }catch(e){
    toast(e.message||'Erreur');
    if(btn){ btn.textContent='Assigner'; btn.disabled=false; }
  }
}

async function doBookReferralLead(id){
  var dateEl=document.getElementById('ref-date');
  var timeEl=document.getElementById('ref-time');
  var addrEl=document.getElementById('ref-addr');
  var cityEl=document.getElementById('ref-city');
  var date=dateEl?dateEl.value:'';
  if(!date){ toast('Choisir une date'); return; }
  var btn=document.getElementById('ref-book-btn');
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    await apiFetch('POST','/referencement/leads/'+id+'/book',{
      apptDate:date, apptHour:parseFloat(timeEl?timeEl.value:14),
      address:addrEl?addrEl.value:'', city:cityEl?cityEl.value:'',
    });
    toast('Rendez-vous booké');
    closeSheet();
    await Promise.all([reloadReferralLeads(), reloadAppts(), reloadLeads()]);
    render();
  }catch(e){
    toast(e.message||'Erreur');
    if(btn){ btn.textContent='Booker RDV'; btn.disabled=false; }
  }
}

async function doUpdateReferralLeadStatus(id, status){
  try{
    await apiFetch('PATCH','/referencement/leads/'+id,{status:status});
    toast('Lead mis à jour');
    closeSheet();
    await reloadReferralLeads();
    render();
  }catch(e){ toast(e.message||'Erreur'); }
}

// Suppression definitive d'un lead référencement — owner uniquement (voir DELETE
// /referencement/leads/:id cote serveur, qui supprime aussi le vrai RDV/lead lie s'il avait deja
// ete booke, pour ne pas laisser un RDV fantome dans l'horaire du closer).
async function doDeleteReferralLead(id){
  if(!confirm('Supprimer definitivement ce lead référencement ? Cette action est irreversible.')) return;
  var btn=document.getElementById('ref-delete-btn');
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    await apiFetch('DELETE','/referencement/leads/'+id);
    toast('Lead référencement supprimé');
    closeSheet();
    await Promise.all([reloadReferralLeads(), reloadAppts(), reloadLeads()]);
    render();
  }catch(e){
    toast(e.message||'Erreur');
    if(btn){ btn.textContent='🗑️ Supprimer ce lead'; btn.disabled=false; }
  }
}

// Demande utilisateur 2026-09-25 (suite a l'interface ordinateur) : sur un ordinateur avec
// une souris (pas de trackpad/geste tactile), rien ne permettait de faire defiler le pipeline
// kanban horizontalement pour voir les colonnes a droite (la barre de defilement etait cachee,
// style mobile — maintenant visible sur ordinateur, voir CSS >=1024px ci-dessus). On traduit
// aussi la molette verticale en defilement horizontal quand elle survole le board, comme la
// plupart des tableaux kanban de bureau (Trello, Linear, etc). N'affecte pas le trackpad : si
// le geste est deja plus horizontal que vertical (deltaX > deltaY), on laisse le navigateur
// faire son defilement natif.
document.addEventListener('wheel', function(e){
  var wrap = e.target.closest && e.target.closest('.kanban-wrap');
  if(!wrap) return;
  if(wrap.scrollWidth <= wrap.clientWidth) return;
  if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  wrap.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive:false });

// Register the service worker (enables "Add to Home Screen" install + instant reopen).
// Fails silently on browsers without support or if served over plain HTTP — never blocks
// the app itself.
// IS_SC_APP (voir plus haut) fait pointer la mini-app Soumission Calfeutrage vers son PROPRE
// service worker, scope /soumission-app/ — completement separe de /sw.js (app principale), avec
// son propre cache d'app shell et sa propre icone de notification par defaut.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var swPath = IS_SC_APP ? '/soumission-app/sw.js' : '/sw.js';
    var swScope = IS_SC_APP ? '/soumission-app/' : '/';
    navigator.serviceWorker.register(swPath, {scope: swScope}).catch(function (e) {
      console.warn('[sw] registration failed:', e.message);
    });
  });
}

// Resync push a chaque retour au premier plan de l'app (PWA restee en arriere-plan des jours,
// telephone redemarre, etc.) — meme correctif que ensurePushSubscription() appele au login/reprise
// de session ; couvre le cas ou l'app n'est jamais vraiment "rechargee" (onglet/PWA laisse ouvert)
// mais l'abonnement navigateur a quand meme expire/tourne entre-temps. No-op silencieux si pas
// connecte (S.user vide) ou permission non accordee (voir garde dans ensurePushSubscription).
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && TOKEN && S.user && typeof ensurePushSubscription==='function'){
    ensurePushSubscription();
  }
});
</script>

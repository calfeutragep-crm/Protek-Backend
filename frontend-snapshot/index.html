}

function attachTeamLeaderEvents(pg, main){
  if(pg==='cal'){
    bindPushBanner(main);
    main.querySelectorAll('[data-calday]').forEach(function(el){
      el.addEventListener('click', function(){
        S.calSelDate = S.calSelDate===this.dataset.calday ? null : this.dataset.calday;
        render();
      });
    });
    main.querySelectorAll('[data-appt-id]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        openApptSheet(this.dataset.apptId);
      });
    });
    main.querySelectorAll('[data-blackout-id]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var b=(S.closerBlackouts||[]).find(function(x){ return String(x.id)===String(el.dataset.blackoutId); });
        if(b) openBlackoutDetailSheet(b);
      });
    });
    var tlPrev=main.querySelector('#cal-prev');
    var tlNext=main.querySelector('#cal-next');
    if(tlPrev) tlPrev.addEventListener('click', function(){
      var now=new Date();
      if(S.calYear==null){S.calYear=now.getFullYear();S.calMonth=now.getMonth();}
      S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} S.calSelDate=null; render();
    });
    if(tlNext) tlNext.addEventListener('click', function(){
      var now=new Date();
      if(S.calYear==null){S.calYear=now.getFullYear();S.calMonth=now.getMonth();}
      S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} S.calSelDate=null; render();
    });
    // Blocages d'horaire — meme wiring que attachCloserEvents (voir plus bas), demande
    // utilisateur 2026-09-28.
    var tlAddBlackoutBtn=main.querySelector('#add-blackout-btn');
    if(tlAddBlackoutBtn) tlAddBlackoutBtn.addEventListener('click', function(){ openBlackoutSheet(); });
    main.querySelectorAll('[data-del-blackout]').forEach(function(el){
      el.addEventListener('click', async function(e){
        e.stopPropagation();
        if(!confirm('Retirer ce blocage ?')) return;
        try{ await apiFetch('DELETE','/closer-blackouts/'+this.dataset.delBlackout,{}); await reloadBlackouts(); toast('Blocage retiré'); render(); }
        catch(err){ toast('Erreur: '+err.message); }
      });
    });
    return;
  }
  if(pg==='deals'){
    var newDealBtn=main.querySelector('#new-deal-btn');
    if(newDealBtn) newDealBtn.addEventListener('click', function(){ openDealSheet(); });
    return;
  }
  if(pg!=='dash') return;
  bindPushBanner(main);
  main.querySelectorAll('[data-tl-mode]').forEach(function(btn){
    btn.addEventListener('click', function(){ S.tlMode=this.dataset.tlMode; render(); });
  });
  var prevBtn = main.querySelector('#tl-prev');
  var nextBtn = main.querySelector('#tl-next');
  if(prevBtn) prevBtn.addEventListener('click', function(){ teamLeaderShiftPeriod(-1); render(); });
  if(nextBtn) nextBtn.addEventListener('click', function(){ teamLeaderShiftPeriod(1); render(); });
}

// ═══════════════════════════════════════════
// MASTER DATABASE — owner uniquement. Source unique de verite pour absolument tous les clients
// jamais entres dans l'entreprise, porte-a-porte et leads marketing confondus (voir GET
// /database). Remplace les anciennes sections separees "Leads" et "Deals" du dashboard admin.
// ═══════════════════════════════════════════
var DB_SORT_FIELDS = [
  {key:'customerName', label:'Nom du client'},
  {key:'createdAt',    label:'Date de creation'},
  {key:'apptDate',     label:'Date de rendez-vous'},
  {key:'status',       label:'Statut'},
  {key:'leadSource',   label:'Source du lead'},
  {key:'crmLabel',     label:'Type de CRM'},
  {key:'closerName',   label:'Closer assigne'},
  {key:'techName',     label:'Technicien assigne'},
  {key:'city',         label:'Ville'},
  {key:'postal',       label:'Code postal'},
  {key:'saleAmount',   label:'Montant de vente'},
  {key:'jobCost',      label:'Cout du job'},
  {key:'installDate',  label:"Date d'installation"},
];
var DB_NUMERIC_SORT_KEYS = {saleAmount:1, jobCost:1};

// Base fusionnee — demande utilisateur 2026-09-27 : "un seul CRM", donc une seule Base plutot que
// deux vues cloisonnees (S.masterDb = porte-a-porte, S.leadsDb = leads pub — meme forme de ligne,
// voir loadLeadsAndAppts, deja chargees toutes les deux inconditionnellement pour l'owner). Le
// badge crmLabel/crmType (voir masterDbRowHtml) distingue deja visuellement l'origine de chaque
// ligne — ce merge n'est qu'un changement d'affichage, aucune donnee n'est dupliquee ou perdue.
function combinedDb(){
  return (S.masterDb||[]).concat(S.leadsDb||[]);
}

function masterDbUniqueValues(field){
  var seen = {};
  combinedDb().forEach(function(r){ var v=r[field]; if(v) seen[v]=1; });
  return Object.keys(seen).sort();
}

function getFilteredSortedDb(){
  var q = (S.dbQuery||'').toLowerCase().trim();
  var f = S.dbFilters||{};
  var rows = combinedDb().filter(function(r){
    if(q){
      var hay = ((r.customerName||'')+' '+(r.phone||'')+' '+(r.address||'')+' '+(r.email||'')+' '+(r.notes||'')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    if(f.crmType && r.crmLabel!==f.crmType) return false;
    if(f.status && r.status!==f.status) return false;
    if(f.source && r.leadSource!==f.source) return false;
    if(f.closer && r.closerName!==f.closer) return false;
    if(f.tech && r.techName!==f.tech) return false;
    if(f.city && (r.city||'').toLowerCase().indexOf(f.city.toLowerCase())===-1) return false;
    if(f.postal && (r.postal||'').toLowerCase().indexOf(f.postal.toLowerCase())!==0) return false;
    if(f.createdFrom && (r.createdAt||'') < f.createdFrom) return false;
    if(f.createdTo && (r.createdAt||'') > f.createdTo+'T23:59:59') return false;
    if(f.apptFrom && (r.apptDate||'') < f.apptFrom) return false;
    if(f.apptTo && (r.apptDate||'') && r.apptDate > f.apptTo) return false;
    if(f.installFrom && (r.installDate||'') < f.installFrom) return false;
    if(f.installTo && (r.installDate||'') && r.installDate > f.installTo) return false;
    if(f.saleMin!=='' && f.saleMin!=null && (r.saleAmount==null || r.saleAmount < parseFloat(f.saleMin))) return false;
    if(f.saleMax!=='' && f.saleMax!=null && (r.saleAmount==null || r.saleAmount > parseFloat(f.saleMax))) return false;
    if(f.costMin!=='' && f.costMin!=null && (r.jobCost==null || r.jobCost < parseFloat(f.costMin))) return false;
    if(f.costMax!=='' && f.costMax!=null && (r.jobCost==null || r.jobCost > parseFloat(f.costMax))) return false;
    return true;
  });
  var key=S.dbSort, dir=S.dbSortDir==='asc'?1:-1;
  rows = rows.slice().sort(function(a,b){
    var av=a[key], bv=b[key];
    if(DB_NUMERIC_SORT_KEYS[key]){
      av = (av==null) ? -Infinity : av;
      bv = (bv==null) ? -Infinity : bv;
      return (av-bv)*dir;
    }
    av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase();
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return 0;
  });
  return rows;
}

      +ir('Facade (avant)', htmlEsc(r.workFront||'—'))
      +ir('Cote droit', htmlEsc(r.workRight||'—'))
      +ir('Cote gauche', htmlEsc(r.workLeft||'—'))
      +ir('Derriere', htmlEsc(r.workRear||'—'))
      +ir('Obstacles a retirer', htmlEsc(r.obstaclesToRemove||'—'))
      +ir('Outils necessaires', htmlEsc(r.toolsNeeded||'—'))
      +(r.toolsNotes?ir('Notes outils', htmlEsc(r.toolsNotes)):'');

    h += '<div class="sdiv">Notes du setter (au RDV)</div><div style="font-size:12px;color:var(--text);padding:4px 0">'+htmlEsc(r.apptNotes)+'</div>';
  }
  if(r.notes){
    h += '<div class="sdiv">Notes generales</div><div style="font-size:12px;color:var(--text);padding:4px 0">'+htmlEsc(r.notes)+'</div>';
  }

    h += '<div class="sdiv">Photos ('+r.photos.length+')</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+r.photos.map(function(u){

      }).join('')+'</div>';
  }

  // Suppression — owner uniquement, action irreversible : confirmation en 2 clics (le bouton
  // change de texte/couleur au 1er clic, le 2e clic dans les 5s confirme vraiment).
  h += '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">'

    + '</div>';

  setTimeout(function(){
    var delBtn = document.getElementById('db-delete-btn');
    if(!delBtn) return;
    delBtn.addEventListener('click', function(){
      if(delBtn.dataset.armed!=='1'){
        delBtn.dataset.armed='1';
        delBtn.textContent='Confirmer la suppression ?';
        delBtn.style.background='#DE1212'; delBtn.style.color='#FFF';
        setTimeout(function(){
          if(delBtn.dataset.armed==='1'){
            delBtn.dataset.armed='0';
            delBtn.textContent='Supprimer ce client';
            delBtn.style.background='#FEE2E2'; delBtn.style.color='#B91C1C';
          }
        }, 5000);
        return;
      }
      delBtn.disabled=true; delBtn.textContent='Suppression...';
      apiFetch('DELETE','/database/'+encodeURIComponent(r.id)).then(function(){
        closeSheet();
        toast('Client supprime');
        return Promise.all([reloadMasterDbIfOwner(), reloadLeads(), reloadAppts(), reloadDeals(), reloadTickets(), loadLeadsCrmData()]);
      }).then(function(){ render(); }).catch(function(e){
        toast('Erreur: '+e.message);
        delBtn.disabled=false; delBtn.dataset.armed='0';
        delBtn.textContent='Supprimer ce client';
        delBtn.style.background='#FEE2E2'; delBtn.style.color='#B91C1C';
      });
    });
  }, 0);
}

// mais scopee UNIQUEMENT aux leads marketing (S.leadsDb, voir GET /leads-crm/database) : le
// porte-a-porte n'y apparait jamais. Pas de bouton Supprimer ici — reserve a l'owner via la
// Master Database (voir openMasterDbDetailSheet) pour ne pas dupliquer ce controle d'acces.

function leadsDbUniqueValues(field){
  var seen = {};
  (S.leadsDb||[]).forEach(function(r){ var v=r[field]; if(v) seen[v]=1; });
  return Object.keys(seen).sort();
}

function getFilteredSortedLeadsDb(){
  var q = (S.leadsDbQuery||'').toLowerCase().trim();
  var f = S.leadsDbFilters||{};
  var rows = (S.leadsDb||[]).filter(function(r){
    if(q){
      var hay = ((r.customerName||'')+' '+(r.phone||'')+' '+(r.address||'')+' '+(r.email||'')+' '+(r.notes||'')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    if(f.status && r.status!==f.status) return false;
    if(f.source && r.leadSource!==f.source) return false;
    if(f.closer && r.closerName!==f.closer) return false;
    if(f.tech && r.techName!==f.tech) return false;
    if(f.city && (r.city||'').toLowerCase().indexOf(f.city.toLowerCase())===-1) return false;
    if(f.postal && (r.postal||'').toLowerCase().indexOf(f.postal.toLowerCase())!==0) return false;
    if(f.createdFrom && (r.createdAt||'') < f.createdFrom) return false;
    if(f.createdTo && (r.createdAt||'') > f.createdTo+'T23:59:59') return false;
    if(f.apptFrom && (r.apptDate||'') < f.apptFrom) return false;
    if(f.apptTo && (r.apptDate||'') && r.apptDate > f.apptTo) return false;
    if(f.saleMin!=='' && f.saleMin!=null && (r.saleAmount==null || r.saleAmount < parseFloat(f.saleMin))) return false;
    if(f.saleMax!=='' && f.saleMax!=null && (r.saleAmount==null || r.saleAmount > parseFloat(f.saleMax))) return false;
    if(f.costMin!=='' && f.costMin!=null && (r.jobCost==null || r.jobCost < parseFloat(f.costMin))) return false;
    if(f.costMax!=='' && f.costMax!=null && (r.jobCost==null || r.jobCost > parseFloat(f.costMax))) return false;
    return true;
  });
  // Pas de dropdown de tri manuel (coherent avec la Master Database owner) — toujours le plus
  // recent en premier.
  rows = rows.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
  return rows;
}

    h += '<div class="sdiv">Notes</div><div style="font-size:12px;color:var(--text);padding:4px 0">'+htmlEsc(r.notes)+'</div>';
  }

  if(r.photos && r.photos.length){
    h += '<div class="sdiv">Photos ('+r.photos.length+')</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+r.photos.map(function(u){
        return '<a href="'+u+'" target="_blank" style="display:block;width:64px;height:64px;border-radius:7px;overflow:hidden;border:1px solid var(--border)"><img src="'+u+'" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy"></a>';
      }).join('')+'</div>';
  }

  // Suppression — owner uniquement (le marketing n'a pas ce controle, voir requete du role
  // marketing plus tot). Meme pattern 2-clics que la Master Database D2D (openMasterDbDetailSheet).
  var isOwner = (S.impersonate||S.user||{}).role==='owner';
  if(isOwner){
    h += '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">'
      + '<button class="btn" id="ldb-delete-btn" data-armed="0" style="background:#FEE2E2;border:1px solid #DE1212;color:#DE1212">Supprimer ce lead</button>'
      + '</div>';
  }

  openSheet('Fiche lead', h);
  if(!isOwner) return;
  setTimeout(function(){
    var delBtn = document.getElementById('ldb-delete-btn');
    if(!delBtn) return;
    delBtn.addEventListener('click', function(){
      if(delBtn.dataset.armed!=='1'){
        delBtn.dataset.armed='1';
        delBtn.textContent='Confirmer la suppression ?';
        delBtn.style.background='#DE1212'; delBtn.style.color='#FFF';
        setTimeout(function(){
          if(delBtn.dataset.armed==='1'){
            delBtn.dataset.armed='0';
            delBtn.textContent='Supprimer ce lead';
            delBtn.style.background='#FEE2E2'; delBtn.style.color='#B91C1C';
          }
        }, 5000);
        return;
      }
      delBtn.disabled=true; delBtn.textContent='Suppression...';
      apiFetch('DELETE','/database/'+encodeURIComponent(r.id)).then(function(){
        closeSheet();
        toast('Lead supprime');
        return Promise.all([reloadMasterDbIfOwner(), loadLeadsCrmData()]);
      }).then(function(){ render(); }).catch(function(e){
        toast('Erreur: '+e.message);
        delBtn.disabled=false; delBtn.dataset.armed='0';
        delBtn.textContent='Supprimer ce lead';
        delBtn.style.background='#FEE2E2'; delBtn.style.color='#B91C1C';
      });
    });
  }, 0);
}

// ── Export Excel — respecte TOUJOURS les filtres/recherche actifs (meme tableau que ce qui est
// affiche a l'ecran, via getFilteredSortedDb()) et inclut tous les champs jamais saisis (setter,
// closer, specificites du job, photos, statut...). SheetJS est charge a la demande (pas au
// demarrage de l'app) pour ne pas alourdir le PWA pour les roles qui ne l'utilisent jamais.
var XLSX_CDN_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
var xlsxLoadPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = XLSX_CDN_URL;
    s.onload = function(){ resolve(); };
    s.onerror = function(){ xlsxLoadPromise=null; reject(new Error('Impossible de charger la librairie Excel (verifier la connexion internet)')); };
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
var MASTER_DB_EXPORT_COLUMNS = [
  ['crmLabel','Type de CRM'], ['leadSource','Source du lead'], ['customerName','Nom du client'],
  ['phone','Telephone'], ['email','Courriel'], ['address','Adresse'], ['city','Ville'], ['postal','Code postal'],
  ['status','Statut'], ['createdAt','Date de creation'], ['apptDate','Date de rendez-vous'], ['apptHour','Heure du rendez-vous'],
  ['apptNotes','Notes du setter (RDV)'], ['setterName','Setter'], ['closerName','Closer'], ['techName','Technicien'],
  ['saleAmount','Montant de vente'], ['paymentMethod','Mode de paiement'],
  ['jobCost','Cout du job'], ['jobCostStatus','Statut du cout'],
  ['footageTotal','Pieds lineaires (total)'], ['footageWhite','Pi lin. Blanc'], ['footageBlack','Pi lin. Noir'], ['footageWheat','Pi lin. Wheat'], ['footageOther','Pi lin. Autres couleurs'],
  ['ladderHeight','Echelle requise'],
  ['workFront','Facade (avant)'], ['workRight','Cote droit'], ['workLeft','Cote gauche'], ['workRear','Derriere'],
  ['obstaclesToRemove','Obstacles a retirer'], ['toolsNeeded','Outils necessaires'], ['toolsNotes','Notes outils'],
  ['installDate',"Date d'installation"], ['notes','Notes generales'],
  ['photoCount','Nombre de photos'], ['photoUrls','Liens des photos'],
  ['leadId','ID lead'], ['apptId','ID rendez-vous'], ['dealId','ID deal'], ['ticketId','ID ticket'], ['adLeadId','ID lead marketing'],
];
// Coeur partage de l'export Excel — pris en parametre la liste de rows deja filtree/triee (memes
// filtres/recherche que ce qui est affiche a l'ecran) et un prefixe de nom de fichier, pour servir
// aussi bien la Base de donnees owner (D2D+marketing) que celle du Leads CRM (marketing seul).
async function exportDbRowsToExcel(rows, btn, filenamePrefix){
  if(!rows.length){ toast('Aucune ligne a exporter avec ces filtres'); return; }
  var origLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Preparation...'; }
  try{
    await loadXlsxLib();
    var data = rows.map(function(r){
      var out = {};
      MASTER_DB_EXPORT_COLUMNS.forEach(function(col){
        var key=col[0], label=col[1];
        var v;
        if(key==='photoCount') v = (r.photos||[]).length;
        else if(key==='photoUrls') v = (r.photos||[]).join(', ');
        else v = r[key];
        out[label] = (v==null) ? '' : v;
      });
      return out;
    });
    var ws = XLSX.utils.json_to_sheet(data);
    // Largeur de colonnes raisonnable — evite le "###" par defaut de Excel sur les dates/montants.
    ws['!cols'] = MASTER_DB_EXPORT_COLUMNS.map(function(col){ return {wch: Math.max(12, col[1].length+2)}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Base de donnees');
    var stamp = new Date().toISOString().slice(0,16).replace(':','h').replace('T','_');
    XLSX.writeFile(wb, filenamePrefix+'_'+stamp+'.xlsx');
    toast(rows.length+' ligne(s) exportee(s)');
  }catch(e){
    toast('Erreur export: '+e.message);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=origLabel; }
  }
}
function exportMasterDbToExcel(btn){
  return exportDbRowsToExcel(getFilteredSortedDb(), btn, 'Protek_Leads');
}
function exportLeadsDbToExcel(btn){
  return exportDbRowsToExcel(getFilteredSortedLeadsDb(), btn, 'Protek_LeadsCRM');
}

function buildSetterPage(pg){

  var acId=S.assignments[u.id]||'';
  var ac=S.users.find(function(c){ return c.id===acId; });

  if(pg==='dash'){
    // Notifications push (RDV, deal ferme, statut, etc.) — voir demande utilisateur "meme chose
    // pour tout le monde qui est dans le CRM", jusqu'ici le bandeau n'apparaissait que sur
    // Leads CRM et le dashboard owner.
    return pushBannerHtml() + '<div style="position:relative">'
      +stats([['Aujourd\'hui',myLeads.filter(function(l){ return l.date===todayStr(); }).length,'#EEE','leads'],['Total',myLeads.length,'#EEE','leads'],['Rendez-vous',myAppts.length,'#EEE','booker'],['Closer',ac?'✓':'—',ac?'#44AA44':'#555',closerLabel]])
      +card('Prochains Rendez-vous',

      +'<div class="fab">+</div></div>';

  if(pg==='leads2') return card('Mes Leads', myLeads.length ? myLeads.map(function(l){ return '<div class="row"><div class="rav">'+htmlEsc(l.av||'?')+'</div><div class="rmain"><div class="rn">'+htmlEsc(l.name||'')+'</div><div class="rs">'+htmlEsc(l.addr||'')+' · '+(l.date||'')+'</div></div><div>'+bdg(l.status||'Scheduled')+'</div></div>'; }).join('') : empty('Aucun lead — appuyez + pour commencer'));
  if(pg==='cal'){
    // Horaire COMPLET du closer assigne (tous les setters confondus), pas seulement les RDV
    // pris par ce setter — demande utilisateur explicite. Les RDV pris par un AUTRE setter
    // restent visibles comme creneau occupe ("RDV pris", voir buildMonthCalendar) mais sans
    // aucune info client (nom/telephone/adresse/ville/setter/statut) — seul le setter qui a
    // lui-meme pris le RDV en voit le detail complet.
    if(!acId) return buildMonthCalendar(myAppts);
    var closerAppts = S.appts.map(normAppt).filter(function(a){ return a.closerId===acId; })
      .map(function(a){ return a.setterId===u.id ? a : Object.assign({}, a, { masked:true }); });
    var closerBo = (S.closerBlackouts||[]).filter(function(b){ return b.closer_id===acId; });

  if(pg==='commissions') return buildMyCommissionsPage();
  return '';
}

  if(pg==='deals'){

    var cu2=S.impersonate||S.user;

      +card('Mes Deals',myDeals.length?myDeals.map(function(d){
        return '<div class="row"><div class="rav">'+htmlEsc((d.client_name||'?')[0].toUpperCase())+'</div><div class="rmain"><div class="rn">'+htmlEsc(d.client_name||'')+'</div><div class="rs">'+htmlEsc(d.address||'')+(d.install_date?' · '+htmlEsc(d.install_date):'')+'</div></div><div>'+bdg(d.status||'Pending Installation')+'</div></div>';
      }).join(''):empty('Aucun deal encore'),'<button class="btn-sm" id="new-deal-btn">+ Nouveau</button>');

function buildMonthCalendar(appts, idAttr, blackouts){
  idAttr = idAttr || 'appt-id';
  // Blocages d'horaire (vacances/indispo) affiches directement SUR la grille, comme les RDV —
  // demande utilisateur : jusqu'ici seule une liste texte sous le calendrier les montrait, ce qui
  // forcait a comparer mentalement dates/RDV pour savoir ou booker en faisant du porte-a-porte.
  blackouts = blackouts || [];
  var now=new Date();
  var yr=S.calYear!=null?S.calYear:now.getFullYear();
  var mo=S.calMonth!=null?S.calMonth:now.getMonth();
  var today=new Date(); today.setHours(0,0,0,0);

  // Build date map
  var map={};
  appts.forEach(function(a){
    if(!a.date) return;
    if(!map[a.date]) map[a.date]=[];
    map[a.date].push(a);
  });
  var blackoutMap={};
  blackouts.forEach(function(b){
    if(!b.date) return;
    if(!blackoutMap[b.date]) blackoutMap[b.date]=[];
    blackoutMap[b.date].push(b);
  });

  var h='<div style="display:flex;align-items:center;padding:8px 12px;gap:6px">'
    +'<button class="btn-sm" id="cal-prev">&#8249;</button>'
    +'<div style="flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--text)">'+MNAMES[mo]+' '+yr+'</div>'
    +'<button class="btn-sm" id="cal-next">&#8250;</button>'
    +'</div>';

  // Day headers
  h+='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;padding:0 4px;margin-bottom:2px">';
  DNAMES.forEach(function(d){ h+='<div style="text-align:center;font-size:9px;font-weight:700;color:var(--text-faint);padding:3px 0">'+d+'</div>'; });
  h+='</div>';

  var firstDay=new Date(yr,mo,1).getDay();
  var daysInMonth=new Date(yr,mo+1,0).getDate();

  h+='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:0 4px">';

  for(var x=0;x<firstDay;x++) h+='<div style="min-height:56px"></div>';

  for(var d=1;d<=daysInMonth;d++){
    var ds=yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dt=new Date(yr,mo,d); dt.setHours(0,0,0,0);
    var isToday=dt.getTime()===today.getTime();
    var isSel=S.calSelDate===ds;
    var dayAppts=map[ds]||[];
    var dayBlackouts=blackoutMap[ds]||[];
    var fullyBlocked=dayBlackouts.some(function(b){ return b.all_day; });

    h+='<div class="calday'+(isSel?' sel':isToday?' today':'')+'" data-calday="'+ds+'" style="min-height:56px;padding:2px'+(fullyBlocked?';background:#77777722':'')+'">'
      +'<div style="text-align:center;font-size:11px;font-weight:'+(isToday||isSel?'700':'400')+';color:'+(fullyBlocked?'#777':(isToday||isSel?'#FF4D4D':'#999'))+';margin-bottom:1px">'+d+'</div>';
    if(dayBlackouts.length){
      h+='<div style="background:#77777733;border-left:2px solid #777;border-radius:2px;padding:1px 2px;margin-bottom:1px;font-size:8px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">🚫 '+(fullyBlocked?'Bloqué':'Partiel')+'</div>';
    }
    dayAppts.slice(0,3).forEach(function(a){
      // RDV masque (voir buildSetterPage 'cal' — l'horaire complet du closer, RDV des autres
      // setters visibles seulement comme "creneau occupe", jamais le nom/les infos du client —
      // demande utilisateur explicite) : pastille neutre, aucune info identifiante.
      if(a.masked){
        // Ville, statut ET nom du setter visibles meme sur un RDV masque — demande utilisateur
        // (2026-09-22 puis 2026-09-28) : les setters veulent voir l'etat a jour
        // (Confirme/Callback/Annule/etc.), la ville des RDV pris par les autres setters (pour
        // reperer les secteurs deja couverts en porte-a-porte et savoir si un creneau vaut encore
        // la peine d'etre suivi), et desormais QUEL setter a pris ce RDV — sans voir le reste
        // (nom/telephone du client), qui demeure cache. La couleur de la pastille suit le statut
        // (STATUS_COL) au lieu d'un gris neutre fixe.
        var mcol=STATUS_COL[a.status]||'#777';
        h+='<div style="background:'+mcol+'33;border-left:2px solid '+mcol+';border-radius:2px;padding:1px 2px;margin-bottom:1px;font-size:8px;color:'+mcol+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">RDV pris'+(a.city?' ('+htmlEsc(a.city)+')':'')+(a.setter?' · '+htmlEsc(a.setter):'')+'</div>';
        return;
      }
      var col=STATUS_COL[a.status]||'#CCAA00';
      h+='<div style="background:'+col+'33;border-left:2px solid '+col+';border-radius:2px;padding:1px 2px;margin-bottom:1px;font-size:8px;color:'+col+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">'+htmlEsc((a.name||'').split(' ')[0])+'</div>';
    });
    if(dayAppts.length>3) h+='<div style="font-size:8px;color:var(--text-faint);text-align:center">+' +(dayAppts.length-3)+'</div>';
    h+='</div>';
  }
  h+='</div>';

  // Selected day detail
  if(S.calSelDate){
    var selAppts=map[S.calSelDate]||[];
    var selBlackouts=blackoutMap[S.calSelDate]||[];
    var dp=new Date(S.calSelDate+'T12:00:00');
    h+='<div style="margin:8px 12px 4px;font-size:12px;font-weight:700;color:var(--text);padding-bottom:6px;border-bottom:1px solid var(--border)">'+DNAMES[dp.getDay()]+' '+dp.getDate()+' '+MNAMES[dp.getMonth()]+'</div>';
    // Blocages ET rendez-vous tries ENSEMBLE par heure — demande utilisateur 2026-09-28 : "les
    // blocages doivent toujours etre places aux heures appropriees en correspondance avec les
    // autres rendez-vous". Avant ce correctif, les blocages s'affichaient TOUJOURS en premier
    // (peu importe leur heure) et les RDV n'etaient pas tries du tout (ordre d'arrivee de
    // l'API) — un blocage a 15h pouvait ainsi apparaitre au-dessus d'un RDV a 9h. On fusionne
    // maintenant les deux listes dans un seul tableau, avec une heure de tri commune (un
    // blocage "journee complete" est traite comme 00h00, donc toujours en tete de journee — ce
    // qui reste logique : il couvre toute la journee), puis on trie par heure croissante.
    var dayEntries = selBlackouts.map(function(b){ return {kind:'blackout', sortHour: b.all_day?-1:(b.start_hour!=null?b.start_hour:0), data:b}; })
      .concat(selAppts.map(function(a){ return {kind:'appt', sortHour: a.hour!=null?a.hour:0, data:a}; }));
    dayEntries.sort(function(x,y){ return x.sortHour-y.sortHour; });
    if(!dayEntries.length) h+='<div style="padding:12px;text-align:center;color:var(--text-faint);font-size:12px">Aucun rendez-vous ce jour</div>';
    else dayEntries.forEach(function(entry){
      if(entry.kind==='blackout'){
        var b=entry.data;
        // Cliquable — demande utilisateur : retirer un blocage doit se faire en cliquant la date
        // puis le timeslot bloque puis "Retirer" (voir openBlackoutDetailSheet), pas seulement via
        // l'ancienne liste "Mes blocages d'horaire" plus bas dans la page (gardee en plus, pas a la
        // place — l'un ou l'autre selon ce qui est sous la main).
        h+='<div class="acard2" data-blackout-id="'+b.id+'" style="border-left:3px solid #777;background:#77777722;cursor:pointer">'
          +'<div style="font-size:13px;font-weight:700;color:#777">🚫 '+(b.all_day?'Journée bloquée':fh(b.start_hour)+' - '+fh(b.end_hour))+'</div>'
          +(b.reason?'<div style="font-size:11px;color:var(--text-dim);margin-top:3px">'+htmlEsc(b.reason)+'</div>':'')
          +'</div>';
        return;
      }
      var a=entry.data;
      // RDV pris par un AUTRE setter, vu depuis l'horaire complet du closer (voir buildSetterPage
      // 'cal') — carte neutre, non cliquable (pas de data-idAttr, donc aucun handler ne l'ouvre),
      // seulement l'heure et "RDV pris". Aucun nom, ville, telephone, setter ni statut affiche.
      if(a.masked){
        // Ville, badge de statut ET nom du setter visibles ici aussi (meme raison que dans la
        // grille du mois ci-dessus, demande utilisateur 2026-09-28) — seuls nom/telephone du
        // CLIENT demeurent caches pour un RDV pris par un autre setter. Carte volontairement non
        // cliquable (pas de data-idAttr) : la fiche complete reste inaccessible.
        var mcol2=STATUS_COL[a.status]||'#777';
        h+='<div class="acard2" style="border-left:3px solid '+mcol2+';background:'+mcol2+'22">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">'
          +'<div style="font-size:13px;font-weight:700;color:var(--text)">'+(a.hour!=null?fh(a.hour)+' — ':'')+'RDV pris'+(a.city?' ('+htmlEsc(a.city)+')':'')+'</div>'
          +bdg(a.status)
          +'</div>'
          +(a.setter?'<div style="font-size:11px;color:var(--text-dim);margin-top:2px">👤 '+htmlEsc(a.setter)+'</div>':'')
          +'</div>';
        return;
      }
      var col=STATUS_COL[a.status]||'#CCAA00';
      var bg=a.status==='Closed Won'?'#DCFCE7':a.status==='No Answer'?'#F3E8FF':a.status==='Closed Lost'?'#FEE2E2':a.status==='Callback'?'#CFFAFE':a.status==='Confirmed'?'#DBEAFE':'#FEF3C7';
      // Ville entre parentheses a cote du nom — meme convention que la carte "RDV Aujourd'hui"
      // du dashboard closer (voir buildCloserPage 'dash' plus haut). C'est CETTE liste (jour
      // selectionne du calendrier) que le closer regarde le plus au quotidien — signalement
      // utilisateur (closer) "la ville ne s'affiche pas encore ici".
      h+='<div class="acard2" data-'+idAttr+'="'+a.id+'" style="border-left:3px solid '+col+';background:'+bg+'">'
        +'<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:13px;font-weight:700;color:var(--text)">'+htmlEsc(a.name||'')+(a.city?' ('+htmlEsc(a.city)+')':'')+'</div><div style="display:flex;align-items:center;gap:5px">'+(a.origin?originDot(a.origin):'')+bdg(a.status)+'</div></div>'
        +'<div style="font-size:11px;color:var(--text-dim);margin-top:3px">'+(a.hour!=null?fh(a.hour)+' · ':'')+(a.phone||'')+(a.setter?' · '+a.setter:'')+'</div>'
        +'</div>';
    });
  } else {
    h+='<div style="padding:12px;text-align:center;color:var(--text-faint);font-size:12px">Appuyez sur un jour pour voir les rendez-vous</div>';
  }
  return h;
}

function openAfterSalesSheet(idStr){

  // roles D2D) plutot que de dupliquer l'info cote after_sales_requests.
  var linkedTicket = r.ticket_id ? (S.tickets||[]).find(function(t){ return String(t.id)===String(r.ticket_id); }) : null;
  var techs = (S.users||[]).filter(function(u){ return u.role==='tech'&&u.status==='active'; });
  var h = '<div style="background:var(--surface-3);border-radius:9px;padding:11px;margin-bottom:10px">'

    +(r.install_date?'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">Date d\'installation: '+htmlEsc(r.install_date)+'</div>':'')
    +(r.invoice_number?'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">N° facture: '+htmlEsc(r.invoice_number)+'</div>':'')
    +'<span class="badge" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'">'+(AFTER_SALES_STATUS_LABEL[r.status]||r.status)+'</span>'

    +'<div style="font-size:12px;color:var(--text);padding:4px 0 10px;white-space:pre-wrap">'+htmlEsc(r.description||'—')+'</div>'

    // signale par le client, ou prise par le gerant/technicien au besoin).
    +'<div class="sdiv">Photos</div>'
    +(photoUrls.length
      ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px">'+photoUrls.map(function(u){
          return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="Photo" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)"></a>';
        }).join('')+'</div>'
      : '<div style="font-size:11px;color:var(--text-dim);margin:4px 0 8px">Aucune photo</div>')
    +'<input type="file" id="as-photos" accept="image/*" multiple style="display:block;margin-bottom:6px;font-size:11px;color:var(--text-dim)">'
    +'<button class="btn" id="as-upload-photos-btn" type="button" style="background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px">📷 Ajouter des photos</button>'
    +'<div class="sdiv">Statut</div>'
    +'<div class="scgrid">'+AFTER_SALES_STATUSES.map(function(s){ return '<button class="scc'+(r.status===s?' on':'')+'" data-set-as-status="'+s+'" data-as-id2="'+r.id+'">'+AFTER_SALES_STATUS_LABEL[s]+'</button>'; }).join('')+'</div>'
    // Assignation a un technicien — cree/maj un ticket d'installation qui va directement dans SON
    // PROPRE horaire (voir POST /after-sales/:id/assign), exactement comme une installation

    +'<div class="sdiv" style="margin-top:8px">Assigner à un technicien</div>'
    +(linkedTicket
      ? '<div style="font-size:11px;color:#15803D;margin:4px 0 8px">✓ Ticket créé'+(linkedTicket.tech_name?' — assigné à '+htmlEsc(linkedTicket.tech_name):' — en attente d\'assignation')+(linkedTicket.scheduled_install_date?' · '+linkedTicket.scheduled_install_date:'')+'</div>'
      : '')
    +(techs.length
      ? '<div class="frow"><div class="field"><label>Technicien</label><select id="as-tech-sel"><option value="">Choisir...</option>'
        +techs.map(function(t){ return '<option value="'+t.id+'">'+htmlEsc(t.first_name+' '+t.last_name)+'</option>'; }).join('')
        +'</select></div><div class="field"><label>Date prévue</label><input type="date" id="as-tech-date"></div></div>'
        +'<button class="btn btn-green" id="as-assign-btn" type="button">'+(linkedTicket?'Réassigner':'Assigner')+'</button>'
      : '<div class="info-yellow">Aucun technicien actif</div>')

    +'<textarea id="as-notes" placeholder="Notes de suivi (visibles admin/gérant seulement)..." style="width:100%;min-height:70px">'+htmlEsc(r.admin_notes||'')+'</textarea>'

          return reloadAfterSales();
        }).then(function(){ toast('Statut: '+AFTER_SALES_STATUS_LABEL[s]); openAfterSalesSheet(rid); render(); })

      saveBtn.disabled=true; saveBtn.textContent='...';

        await apiFetch('PATCH','/after-sales/'+r.id,{adminNotes:(document.getElementById('as-notes')||{}).value||''});

      }catch(e){ toast('Erreur: '+e.message); }
      saveBtn.disabled=false; saveBtn.textContent='Enregistrer les notes';
    });
    var uploadBtn=document.getElementById('as-upload-photos-btn');
    if(uploadBtn) uploadBtn.addEventListener('click', async function(){
      var input=document.getElementById('as-photos');
      if(!input || !input.files.length){ toast('Choisir au moins une image'); return; }
      uploadBtn.disabled=true;
      try{
        var uploaded = await uploadPhotosBatched(input.files, 'after-sales', uploadBtn, 'Televersement');
        var newUrls = uploaded.map(function(p){ return p.url; });
        var existing = Array.isArray(r.photo_urls) ? r.photo_urls : [];
        await apiFetch('PATCH','/after-sales/'+r.id,{photoUrls: existing.concat(newUrls)});
        await reloadAfterSales();
        toast('Photo(s) ajoutee(s)!');
        openAfterSalesSheet(r.id);
      }catch(e){ toast('Erreur: '+e.message); uploadBtn.disabled=false; uploadBtn.textContent='📷 Ajouter des photos'; }
    });
    var assignBtn=document.getElementById('as-assign-btn');
    if(assignBtn) assignBtn.addEventListener('click', async function(){
      var techId=(document.getElementById('as-tech-sel')||{}).value||'';
      var schedDate=(document.getElementById('as-tech-date')||{}).value||'';
      if(!techId){ toast('Choisir un technicien'); return; }
      assignBtn.disabled=true; assignBtn.textContent='...';
      try{
        await apiFetch('POST','/after-sales/'+r.id+'/assign',{techId:techId, scheduledDate:schedDate||null});
        await Promise.all([reloadAfterSales(), reloadTickets()]);
        toast('Assigné au technicien — ajouté à son horaire');
        openAfterSalesSheet(r.id);
      }catch(e){ toast('Erreur: '+e.message); assignBtn.disabled=false; assignBtn.textContent='Assigner'; }
    });
    var deleteBtn=document.getElementById('as-delete-btn');
    if(deleteBtn) deleteBtn.addEventListener('click', async function(){
      if(!confirm('Supprimer definitivement cette demande après-vente ?')) return;
      deleteBtn.disabled=true; deleteBtn.textContent='...';
      try{
        await apiFetch('DELETE','/after-sales/'+r.id);
        await reloadAfterSales();
        toast('Demande supprimée');
        closeSheet(); render();
      }catch(e){ toast('Erreur: '+e.message); deleteBtn.disabled=false; deleteBtn.textContent='🗑 Supprimer la demande'; }
    });
  },0);
}

// SOUMISSION CALFEUTRAGE — leads du site https://soumissioncalfeutrage.com/ (projet Lovable
// separe de calfeutrageprotek.com). Demande utilisateur 2026-09-29 : "je veux que les leads qui
// viennent de soumissioncalfeutrage.com se rendent directement dans crm protek, dans une queue
// completement differente (soumission calfeutrage), meme systeme de queue, mais uniquement pour
// ces leads" — precise ensuite par 2 choix explicites : "Suivi simple seulement" (AUCUN bouton de
// booking calendrier closer ici, contrairement a Queue/ad_leads et Referencement) et "Admin
// seulement" (owner uniquement — voir requireOwner cote serveur sur /soumission-calfeutrage/*,
// jamais team_leader_vente/closer/setter/manager). Table dediee (soumission_calfeutrage_leads),
// jamais melangee a ad_leads/referral_leads/after_sales_requests. Notes horodatees reutilisant
// EXACTEMENT le meme systeme que Queue (voir loadAdLeadNotes/al-notes-list plus haut), juste
// pointees vers /soumission-calfeutrage/:id/notes.
var SOUMISSION_CALF_STATUSES = ['Nouveau','Contacté','Prix envoyé','Fermé','Perdu'];
var SOUMISSION_CALF_STATUS_COL = {'Nouveau':'#5599DD','Contacté':'#CCAA00','Prix envoyé':'#9955DD','Fermé':'#44AA44','Perdu':'#CC3333'};
// Progression lineaire simple pour le bouton "Avancer" du kanban (voir AD_LEAD_STAGES /
// nextAdLeadStage plus bas — meme pattern, reutilise ici). "Perdu" reste volontairement HORS de
// cette liste : sortie manuelle du pipeline uniquement (bouton dedie sur la carte), jamais
// atteinte via "Avancer →", exactement comme "Not Qualified" pour les leads Ad. Pas de verrou de
// qualification ni de gate photo/raison ici : demande utilisateur = "suivi simple seulement".
var SOUMISSION_CALF_STAGES = ['Nouveau','Contacté','Prix envoyé','Fermé'];
var SOUMISSION_CALF_KANBAN_COLUMNS = SOUMISSION_CALF_STAGES.concat(['Perdu']);
function nextSoumissionCalfStage(status){
  var i = SOUMISSION_CALF_STAGES.indexOf(status);
  if(i<0 || i>=SOUMISSION_CALF_STAGES.length-1) return null;
  return SOUMISSION_CALF_STAGES[i+1];
}
function soumissionCalfQueueHtml(rows){
  function rowHtml(r){
    var col = SOUMISSION_CALF_STATUS_COL[r.status]||'#5599DD';
    return '<div class="row" data-sc-id="'+r.id+'">'
      +'<div class="rav" style="background:'+col+'22;border:1px solid '+col+';color:'+col+'">'+(r.full_name||'?')[0].toUpperCase()+'</div>'
      +'<div class="rmain">'
        +'<div class="rn">'+htmlEsc(r.full_name||'')+'</div>'
        +'<div class="rs">'+htmlEsc(r.city||'')+(r.created_at?' · '+r.created_at.slice(0,10):'')+'</div>'
      +'</div>'
      +'<span class="badge" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'">'+htmlEsc(r.status)+'</span>'
      +'</div>';
  }
  return rows.length ? rows.map(rowHtml).join('') : empty('Aucun lead pour le moment');
}
function soumissionCalfKanbanCardHtml(r){
  var col = SOUMISSION_CALF_STATUS_COL[r.status]||'#5599DD';
  var next = nextSoumissionCalfStage(r.status);
  var canLose = r.status!=='Fermé' && r.status!=='Perdu';
  var h = '<div class="kcard" style="border-left-color:'+col+'" data-sc-id="'+r.id+'">'
    + '<div class="kcard-name">'+htmlEsc(r.full_name||'')+'</div>'
    + (r.city?'<div class="kcard-meta">📍 '+htmlEsc(r.city)+'</div>':'')
    + (r.phone?'<div class="kcard-meta">📞 '+phoneLinkHtml(r.phone)+'</div>':'')
    + (r.created_at?'<div class="kcard-meta">🗓 '+r.created_at.slice(0,10)+'</div>':'');
  if(next||canLose){
    h += '<div class="kcard-actions">';
    if(next) h += '<button class="kmove" data-move-sc="'+r.id+'" data-move-to="'+next+'">Avancer → '+next+'</button>';
    if(canLose) h += '<button class="kmove" style="background:var(--surface-3);border:1px solid #D4D4D4;color:var(--text)" data-move-sc="'+r.id+'" data-move-to="Perdu">🚫 Perdu</button>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function buildSoumissionCalfKanban(rows){
  var html = '<div class="kanban-wrap">';
  SOUMISSION_CALF_KANBAN_COLUMNS.forEach(function(st){
    var items = rows.filter(function(r){ return (r.status||'Nouveau')===st; });
    var col = SOUMISSION_CALF_STATUS_COL[st]||'#555';
    html += '<div class="kcol">'
      + '<div class="kcol-hdr" style="border-top:3px solid '+col+'"><span>'+st+'</span><span class="kcol-count">'+items.length+'</span></div>'
      + '<div class="kcol-body">'
      + (items.length ? items.map(soumissionCalfKanbanCardHtml).join('') : '<div class="kcol-empty">Vide</div>')
      + '</div></div>';
  });
  html += '</div>';
  return html;
}
function buildSoumissionCalfeutragePage(){
  var rows = S.soumissionLeads||[];
  var newCount = rows.filter(function(r){return r.status==='Nouveau';}).length;
  var quotedCount = rows.filter(function(r){return r.status==='Prix envoyé';}).length;

  return pushBannerHtml()

  var h = '<div style="background:var(--surface-3);border-radius:9px;padding:11px;margin-bottom:10px">'

    +'</div>'
    +'<div class="sdiv">Formulaire du site</div>'
    + (r.property_type?ir('Type de propriété', htmlEsc(r.property_type)):'')
    + (serviceTypes.length?ir('Services demandés', htmlEsc(serviceTypes.join(', '))):'')
    + (symptoms.length?ir('Symptômes observés', htmlEsc(symptoms.join(', '))):'')
    + (r.urgency?ir('Urgence', htmlEsc(r.urgency)):'')
    + (r.requested_call_date?ir('Date de rappel souhaitée', htmlEsc(r.requested_call_date)+(r.requested_call_window?' · '+r.requested_call_window:'')):'')
    + (r.scope_notes?'<div class="sdiv">Description du projet (client)</div><div style="font-size:12px;color:var(--text);padding:4px 0 10px;white-space:pre-wrap">'+htmlEsc(r.scope_notes)+'</div>':'')
    +'<div class="sdiv" style="margin-top:8px">Prix soumis (CAD)</div>'
    +'<div class="frow"><div class="field" style="flex:1"><input type="number" step="0.01" id="sc-price-input" placeholder="Ex: 450.00" value="'+(r.quoted_price!=null?r.quoted_price:'')+'"></div>'
    +'<button class="btn" id="sc-save-price-btn" style="background:var(--surface-3);border:1px solid var(--border)">Enregistrer</button></div>'
    +'<div class="sdiv" style="margin-top:8px">Statut</div>'
    +'<div class="scgrid">'+SOUMISSION_CALF_STATUSES.map(function(s){ return '<button class="scc'+(r.status===s?' on':'')+'" data-set-sc-status="'+s+'">'+s+'</button>'; }).join('')+'</div>'
    // Notes horodatees — meme systeme que Queue (ad_lead_notes / #al-notes-list), voir demande
    // utilisateur "meme systeme de queue". Endpoints dedies /soumission-calfeutrage/:id/notes.
    +'<div class="sdiv" style="margin-top:8px">Notes</div>'
    +'<div id="sc-notes-list" style="margin:6px 0;max-height:180px;overflow-y:auto">Chargement...</div>'
    +'<textarea id="sc-note-input" placeholder="Ajouter une note de suivi..." style="width:100%;min-height:56px"></textarea>'
    +'<button class="btn" id="sc-add-note-btn" style="margin-top:4px;margin-bottom:4px;background:var(--surface-3);border:1px solid var(--border)">Ajouter la note</button>'
    +'<button class="btn" id="sc-delete-btn" type="button" style="margin-top:14px;background:#FEE2E2;border:1px solid #CC3333;color:#CC3333">🗑 Supprimer le lead</button>';
  openSheet('Soumission Calfeutrage', h);
  loadSoumissionCalfLeadNotes(r.id);
  setTimeout(function(){
    document.querySelectorAll('[data-set-sc-status]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var s=this.dataset.setScStatus;
        apiFetch('PATCH','/soumission-calfeutrage/'+r.id,{status:s}).then(function(){
          return reloadSoumissionLeads();
        }).then(function(){ toast('Statut: '+s); openSoumissionCalfeutrageSheet(r.id); render(); })
          .catch(function(e){ toast('Erreur: '+e.message); });
      });
    });
    var savePriceBtn=document.getElementById('sc-save-price-btn');
    if(savePriceBtn) savePriceBtn.addEventListener('click', async function(){
      var val=(document.getElementById('sc-price-input')||{}).value;
      savePriceBtn.disabled=true; savePriceBtn.textContent='...';
      try{
        await apiFetch('PATCH','/soumission-calfeutrage/'+r.id,{quotedPrice: val===''?null:parseFloat(val)});
        await reloadSoumissionLeads();
        toast('Prix enregistré');
        openSoumissionCalfeutrageSheet(r.id);
      }catch(e){ toast('Erreur: '+e.message); }
      savePriceBtn.disabled=false; savePriceBtn.textContent='Enregistrer';
    });
    var addNoteBtn=document.getElementById('sc-add-note-btn');
    if(addNoteBtn) addNoteBtn.addEventListener('click', async function(){
      var inputEl=document.getElementById('sc-note-input');
      var body=inputEl ? inputEl.value.trim() : '';
      if(!body){ toast('Ecrire une note avant d\'ajouter'); return; }
      addNoteBtn.disabled=true;
      try{
        await apiFetch('POST','/soumission-calfeutrage/'+r.id+'/notes',{body: body});
        toast('Note ajoutée');
        if(inputEl) inputEl.value='';
        loadSoumissionCalfLeadNotes(r.id);
      }catch(e){ toast('Erreur: '+e.message); }
      addNoteBtn.disabled=false;
    });
    var deleteBtn=document.getElementById('sc-delete-btn');
    if(deleteBtn) deleteBtn.addEventListener('click', async function(){
      if(!confirm('Supprimer définitivement ce lead ?')) return;
      deleteBtn.disabled=true; deleteBtn.textContent='...';
      try{
        await apiFetch('DELETE','/soumission-calfeutrage/'+r.id);
        await reloadSoumissionLeads();
        toast('Lead supprimé');
        closeSheet(); render();
      }catch(e){ toast('Erreur: '+e.message); deleteBtn.disabled=false; deleteBtn.textContent='🗑 Supprimer le lead'; }
    });
  },0);
}

async function loadSoumissionCalfLeadNotes(leadId){
  var container=document.getElementById('sc-notes-list');
  if(!container) return;
  try{
    var notes = await apiFetch('GET','/soumission-calfeutrage/'+leadId+'/notes');
    if(!notes.length){ container.innerHTML='<div style="font-size:11px;color:var(--text-dim)">Aucune note</div>'; return; }
    container.innerHTML = notes.map(function(n){
      return '<div style="border-bottom:1px solid var(--border);padding:5px 0">'
        +'<div style="font-size:9px;color:var(--text-dim)">'+fmtNoteTs(n.created_at)+' · '+htmlEsc(n.author_name||'—')+'</div>'
        +'<div style="font-size:12px;color:var(--text);white-space:pre-wrap">'+htmlEsc(n.body)+'</div>'
        +'</div>';
    }).join('');
  }catch(e){
    container.innerHTML='<div style="font-size:11px;color:#CC3333">Erreur de chargement des notes</div>';
  }
}

function buildInstallationsPage(){
  // Page "Installations" (admin + manager) — demande utilisateur 2026-09-28 : "admin et manager
  // doivent voir l'horraire des installations. en haut, 2 options. horraire et en attente ou
  // toutes les deals postés sont en attente detre assignés a un technicien et de confirmer la
  // date d'installation". Reutilise EXACTEMENT le calendrier ('cal') et le rendu de ticket deja
  // en place dans buildManagerPage — S.tickets est deja charge inconditionnellement pour owner et
  // manager (voir loadLeadsAndAppts), donc aucune donnee/backend a toucher, purement additif.
  var tab = S.installTab || 'horaire';
  var pending = S.tickets.filter(function(t){ return t.status==='New' || t.status==='Assigned'; });

  function ticketRow(t){
    var dt=t.scheduled_install_date||t.preferred_install_date||'';
    var photoCount=Array.isArray(t.photo_urls)?t.photo_urls.length:0;
    return '<div class="row" data-ticket-id="'+t.id+'">'
      +'<div class="rav" style="background:#FFEDD5;border:1px solid #FDBA74;color:#C2410C">'+(t.client_name||'?')[0].toUpperCase()+'</div>'
      +'<div class="rmain">'
        +'<div class="rn">'+htmlEsc(t.client_name)+'</div>'
        +'<div class="rs">'+htmlEsc(t.address||'')+(dt?' · '+dt:'')+'</div>'
        +(t.tech_name?'<div style="font-size:10px;color:#44AA44;margin-top:2px">👷 '+htmlEsc(t.tech_name)+'</div>':'<div style="font-size:10px;color:#CC3333;margin-top:2px">À assigner</div>')
        +(photoCount>0?'<div style="font-size:10px;color:#1D4ED8;margin-top:1px">📷 '+photoCount+' photo(s)</div>':'')
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+originDot(t.origin)+bdg(t.status)+'</div>'
      +'</div>';
  }

  var h='<div class="tabs"><button class="tab'+(tab==='horaire'?' on':'')+'" data-install-tab="horaire">Horaire</button><button class="tab'+(tab==='attente'?' on':'')+'" data-install-tab="attente">En attente ('+pending.length+')</button></div>';

  if(tab==='attente'){
    return h + (pending.length
      ? '<div class="card" style="margin-top:8px">'+pending.map(ticketRow).join('')+'</div>'
      : empty('Aucune installation en attente — tous les tickets sont assignés et programmés'));
  }

  var calItems=S.tickets.filter(function(t){return t.scheduled_install_date||t.preferred_install_date;}).map(function(t){
    return {id:t.id, date:t.scheduled_install_date||t.preferred_install_date, hour:null, name:t.client_name, phone:t.phone, status:t.status, setter:t.tech_name, origin:t.origin};
  });
  return h + buildMonthCalendar(calItems, 'ticket-id');
}

  var today2=todayStr();
  var todayJobs=myJobs.filter(function(t){return (t.scheduled_install_date||t.preferred_install_date)===today2;});
  var activeJobs=myJobs.filter(function(t){return t.status!=='Completed';});

      +'<div class="rav" style="background:#FFEDD5;border:1px solid #FDBA74;color:#C2410C">'+(t.client_name||'?')[0].toUpperCase()+'</div>'
      +'<div class="rmain">'
        +'<div class="rn">'+htmlEsc(t.client_name)+'</div>'
        +'<div class="rs">'+htmlEsc(t.address||'')+(dt?' · '+dt:'')+'</div>'

    ['Actifs',       activeJobs.length,'#EEE',   'jobs'],
    ['Complétés',    doneJobs.length,  '#44AA44','total'],
    ['En cours',     myJobs.filter(function(t){return t.status==='In Progress';}).length,'#AA66FF','maintenant']
  ])+card("Jobs Aujourd'hui", todayJobs.length ? todayJobs.map(techRow).join('') : empty('Aucun job aujourd\'hui'));

        return da>db2?1:-1;
      });
    return card('Mon Calendrier d\'installation',
      withDate.length ? withDate.map(function(t){
        var dt=t.scheduled_install_date||t.preferred_install_date;
        var photoCount=Array.isArray(t.photo_urls)?t.photo_urls.length:0;

          +'<div class="rav" style="background:#FFEDD5;border:1px solid #FDBA74;color:#C2410C">'+(t.client_name||'?')[0].toUpperCase()+'</div>'
          +'<div class="rmain">'
            +'<div class="rn">'+htmlEsc(t.client_name)+(isToday?' <span style="font-size:9px;color:#44AA44">• Aujourd\'hui</span>':'')+'</div>'
            +'<div class="rs">'+dt+' · '+htmlEsc(t.address||'')+'</div>'
            +(photoCount>0?'<div style="font-size:10px;color:#1D4ED8;margin-top:1px">📷 '+photoCount+' photo(s) disponible(s)</div>':'')
          +'</div>'
          +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+originDot(t.origin)+bdg(t.status)+'</div>'
          +'</div>';
      }).join('') : empty('Aucun job programmé — le gestionnaire vous assignera des travaux')
    );
  }
  if(pg==='jobs') return card('Tous mes Jobs', myJobs.length ? myJobs.map(techRow).join('') : empty('Aucun job assigné'));
  return '';
}

function attachOwnerEvents(page, main){
  if(page==='overview') bindPushBanner(main);
  if(page==='commissions') attachCommissionsEvents(main);
  // Admin tabs
  main.querySelectorAll('[data-admin-tab]').forEach(function(btn){
    btn.addEventListener('click', function(){
      S.adminTab = this.dataset.adminTab;
      render();
    });
  });

  // Recherche par nom — Equipe > Actifs (admin), voir buildOwnerPage('users').
  var adminSearchEl = main.querySelector('#admin-search');
  if(adminSearchEl) adminSearchEl.addEventListener('input', function(){ S.adminSearch=this.value; debounce('admin-search', render); });

  // Affiche/masque en direct, pendant l'approbation d'un compte en attente :
  // - "Assigner closer" : visible seulement pour "Setter" (une entreprise marketing n'a pas de
  //   closer sous elle) ;
  // - "Autre acces CRM" (double role) : masque pour "Marketing" (lead_marketing) — ce role ne
  //   doit avoir acces qu'au Leads CRM, jamais au porte-a-porte, donc pas d'acces double possible.
  // On vide aussi la valeur du select masque, pour ne jamais soumettre un choix fait avant de
  // changer d'avis sur le role principal.
  main.querySelectorAll('[data-approve-role]').forEach(function(sel){
    sel.addEventListener('change', function(){
      var id = this.dataset.approveRole;
      var clSel = main.querySelector('[data-assign-cl="'+id+'"]');
      if(clSel){
        if(this.value==='setter'){ clSel.style.display=''; }
        else { clSel.style.display='none'; clSel.value=''; }
      }
      var secSel = main.querySelector('[data-approve-secondary-role="'+id+'"]');
      if(secSel){
        if(this.value==='lead_marketing'){ secSel.style.display='none'; secSel.value=''; }
        else { secSel.style.display=''; }
      }
    });
  });

  // Approve/Reject/Suspend
  main.querySelectorAll('[data-approve]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var id = this.dataset.approve;
      var roleSel = main.querySelector('[data-approve-role="'+id+'"]');
      var roleName = roleSel ? roleSel.value : '';
      if(!roleName){ toast('Choisir un role avant d\'approuver.'); return; }
      var secSel = main.querySelector('[data-approve-secondary-role="'+id+'"]');
      // Filet de securite en plus du toggle live sur data-approve-role : le role Marketing
      // n'a jamais d'acces double CRM, meme si le select secondaire avait garde une valeur.
      var secondaryRoleName = (secSel && roleName!=='lead_marketing') ? secSel.value : '';
      // Le 2e menu (acces CRM additionnel) offre TOUS les roles, car le role principal n'est
      // choisi qu'au moment du clic — on verifie donc ici que les deux sont bien dans des CRM
      // differents (sinon "acces double" n'a pas de sens : ex Setter + Manager sont tous deux
      // porte-a-porte).
      if(secondaryRoleName && roleFamily(secondaryRoleName)===roleFamily(roleName)){
        toast('L\'acces additionnel doit venir de l\'AUTRE CRM que le role principal.');
        return;
      }
      var sel = main.querySelector('[data-assign-cl="'+id+'"]');
      var closerId = (sel && roleName==='setter') ? sel.value : '';
      try{
        var roles = await apiFetch('GET','/roles').catch(function(){ return []; });
        var r = roles.find(function(r){ return r.name===roleName; });
        if(!r){ toast('Role introuvable'); return; }
        var sr = secondaryRoleName ? roles.find(function(r){ return r.name===secondaryRoleName; }) : null;
        await apiFetch('POST','/users/'+id+'/approve',{roleId:r.id, secondaryRoleId: sr?sr.id:null});
        if(closerId){
          S.assignments[id]=closerId;
          await apiFetch('PUT','/assignments',{setterId:id, closerId:closerId});
        }
        toast('Approuve!' + (closerId?' Closer assigne.':'') + (sr?' Acces double CRM.':''));
        // Approuver un compte ne change que la table users (+ assignments, deja mis a jour
        // localement ci-dessus) — inutile de retelecharger tout le CRM pour ca.
        await Promise.all([loadUsers(), reloadMasterDbIfOwner()]);
        render();
      }catch(e){ toast('Erreur: '+e.message); }
    });
  });
  main.querySelectorAll('[data-reject]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      try{ await apiFetch('POST','/users/'+this.dataset.reject+'/reject',{}); toast('Rejete'); await loadUsers(); render(); }catch(e){ toast('Erreur'); }
    });
  });
  main.querySelectorAll('[data-suspend]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      try{ await apiFetch('POST','/users/'+this.dataset.suspend+'/suspend',{}); toast('Suspendu'); await loadUsers(); render(); }catch(e){ toast('Erreur'); }
    });
  });

  // Role change
  main.querySelectorAll('[data-role-change]').forEach(function(sel){
    sel.addEventListener('change', async function(){
      var id=this.dataset.roleChange, role=this.value;
      var roles=await apiFetch('GET','/roles').catch(function(){ return []; });
      var r=roles.find(function(r){ return r.name===role; });
      if(!r){ toast('Role introuvable'); return; }
      try{
        var body = {roleId:r.id};
        // Si le nouveau role principal tombe dans la MEME famille CRM que l'acces secondaire
        // deja assigne, ce dernier n'a plus de sens (ex: passer de Closer+LeadCloser a
        // Marketing laisserait deux roles "leads") — on le retire automatiquement.
        var u = S.users.find(function(x){ return x.id===id; });
        var clearedSecondary = false;
        if(u && u.secondary_role && roleFamily(u.secondary_role)===roleFamily(role)){
          body.secondaryRoleId = null;
          clearedSecondary = true;
        }
        await apiFetch('PATCH','/users/'+id, body);
        toast('Role mis a jour - le membre verra le changement a sa prochaine connexion'
          + (clearedSecondary?' (acces CRM secondaire retire, meme CRM que le nouveau role)':''));
        await loadUsers();
        render();
      }catch(e){ toast('Erreur: '+e.message); }
    });
  });

  // Secondary CRM access change (acces double CRM pour un membre deja actif)
  main.querySelectorAll('[data-secondary-role-change]').forEach(function(sel){
    sel.addEventListener('change', async function(){
      var id=this.dataset.secondaryRoleChange, role=this.value;
      try{
        var secondaryRoleId = null;
        if(role){
          var roles=await apiFetch('GET','/roles').catch(function(){ return []; });
          var r=roles.find(function(r){ return r.name===role; });
          if(!r){ toast('Role introuvable'); return; }
          secondaryRoleId = r.id;
        }
        await apiFetch('PATCH','/users/'+id,{secondaryRoleId: secondaryRoleId});
        toast(role ? 'Acces double CRM active ('+ROLE_LABELS[role]+')' : 'Acces double CRM retire');
        await loadUsers();
        render();
      }catch(e){ toast('Erreur: '+e.message); }
    });
  });

  // Assign closer dropdown
  main.querySelectorAll('[data-assign-cl]').forEach(function(sel){
    sel.addEventListener('change', function(){
      var setterId=this.dataset.assignCl, closerId=this.value;
      if(!closerId) return;
      S.assignments[setterId]=closerId;
      saveAssignments(setterId, closerId);
      var closer=S.users.find(function(u){ return u.id===closerId; });
      var setter=S.users.find(function(u){ return u.id===setterId; });
      toast((setter?setter.first_name:'')+' → '+(closer?closer.first_name:'')+' OK');
      render();
    });
  });

  // Impersonate
  main.querySelectorAll('[data-imp-id]').forEach(function(row){
    row.addEventListener('click', async function(){
      var id=this.dataset.impId, role=this.dataset.impRole, name=this.dataset.impName;
      S.impersonate={id:id,role:role,name:name};
      var defaults={setter:'dash',closer:'cal',manager:'dash',tech:'dash',lead_marketing:'cal',lead_closer:'cal'};
      S.page[role]=defaults[role]||'dash';
      if(role==='closer'||role==='setter'){S.calYear=null;S.calMonth=null;S.calSelDate=null;}
      // Les RDV/leads/deals/chat affiches jusqu'ici sont ceux du VRAI role (owner/team leader) —
      // sans ce rechargement cible, un RDV pris entre-temps par la personne qu'on vient de
      // "Vue de" n'apparaitrait qu'au prochain login/refresh complet. On rend une premiere fois
      // tout de suite (feedback instantane sur le changement de vue) puis on rafraichit les
      // donnees scopees a ce role et on re-rend des qu'elles arrivent.
      render();
      await loadLeadsAndAppts();
      render();
    });
  });

  // Lead search
  var searchEl=main.querySelector('#lead-search');
  if(searchEl) searchEl.addEventListener('input', function(){ S.leadQ=this.value; debounce('lead-search', render); });

  // Master database (page === 'database')
  attachMasterDbEvents(main);

  // Installations (page === 'installs') — demande utilisateur 2026-09-28, voir buildInstallationsPage.
  if(page==='installs'){
    main.querySelectorAll('[data-ticket-id]').forEach(function(row){
      row.addEventListener('click', function(){ openTicketDetailSheet(this.dataset.ticketId); });
    });
    main.querySelectorAll('[data-install-tab]').forEach(function(el){
      el.addEventListener('click', function(){ S.installTab=this.dataset.installTab; render(); });
    });
    if(S.installTab!=='attente'){
      main.querySelectorAll('[data-calday]').forEach(function(el){
        el.addEventListener('click', function(){
          S.calSelDate = S.calSelDate===this.dataset.calday ? null : this.dataset.calday;
          render();
        });
      });
      var instPrev=main.querySelector('#cal-prev');
      var instNext=main.querySelector('#cal-next');
      if(instPrev) instPrev.addEventListener('click', function(){
        var now=new Date();
        if(S.calYear==null){S.calYear=now.getFullYear();S.calMonth=now.getMonth();}
        S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} S.calSelDate=null; render();
      });
      if(instNext) instNext.addEventListener('click', function(){
        var now=new Date();
        if(S.calYear==null){S.calYear=now.getFullYear();S.calMonth=now.getMonth();}
        S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} S.calSelDate=null; render();
      });
    }
  }
}

// CHAT — setter, closer, owner uniquement. Sous-chats multiples (canaux).
// Aucune donnee client (nom, prix, photo de deal) n'y transite jamais : seulement des
// messages libres, des photos, et des notifications automatiques "+1 rendez-vous" / "+1 deal".
// ═══════════════════════════════════════════
// Bannieres "hype" pour les notifications automatiques (+1 RDV / +1 deal) — gras, colore, avec
// une legere pulsation (voir .hypecard / @keyframes hypePulse) pour que l'equipe les remarque et
// reste motivee. Detection du type via les emojis deja presents dans le texte envoye par le
// backend (📅 = RDV, 💰 = deal) plutot qu'un champ dedie, pour rester simple.
function systemMessageHtml(body){
  var isDeal = body.indexOf('💰')>-1;
  var isRdv = body.indexOf('📅')>-1;
  var col = isDeal ? '#A16207' : isRdv ? '#15803D' : '#1D4ED8';
  var bg = isDeal ? 'linear-gradient(135deg,#FEF9C3,#FDE68A)' : isRdv ? 'linear-gradient(135deg,#F0FDF4,#DCFCE7)' : '#F2F2F2';
  var lines = htmlEsc(body).split('\n').map(function(l){ return '<div>'+l+'</div>'; }).join('');
  return '<div class="hypecard" style="--hc:'+col+';align-self:center;text-align:center;max-width:72%;background:'+bg+';border:1.5px solid '+col+';border-radius:10px;padding:5px 10px;font-weight:700;font-size:10.5px;line-height:1.35;color:'+col+';letter-spacing:.1px">'+lines+'</div>';
}
function chatMessageHtml(m, meId, myRole){
  if(m.type==='system'){
    return systemMessageHtml(m.body||'');
  }
  // Demande de prix Leads CRM fusionnee dans le canal Cost (voir buildChatPage) — pas un vrai
  // message de chat, juste tagge pour partager le meme rendu/tri que les cost_request door.
  if(m.__adLeadCost){
    return costTicketHtml(m, myRole, 'adlead-');
  }
  if(m.type==='cost_request'){
    return costTicketHtml(m, myRole);
  }
  var mine = String(m.sender_id)===String(meId);
  var name = ((m.sender_first_name||'')+' '+(m.sender_last_name||'')).trim()||'?';
  var h = '<div style="align-self:'+(mine?'flex-end':'flex-start')+';max-width:78%;display:flex;flex-direction:column;align-items:'+(mine?'flex-end':'flex-start')+'">'
    + (!mine ? '<div style="font-size:10px;color:var(--text-dim);margin-bottom:2px;padding:0 4px">'+htmlEsc(name)+'</div>' : '');
  if(m.image_url){
    h += '<a href="'+m.image_url+'" target="_blank" style="display:block;border-radius:12px;overflow:hidden;border:1px solid var(--border);max-width:220px;line-height:0">'
      + '<img src="'+m.image_url+'" style="width:100%;display:block" loading="lazy"></a>';
    // white-space:pre-wrap ajoute ici et ci-dessous — sans ca les retours a la ligne d'un message
    // (meme une fois preserves cote <textarea>, voir buildChatPage) etaient quand meme ecrases a
    // l'affichage par le CSS par defaut (les <div> collapsent les \n comme du HTML normal).
    if(m.body) h += '<div style="margin-top:4px;background:'+(mine?'var(--red)':'var(--surface-3)')+';color:'+(mine?'#FFF':'var(--text)')+';border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.4;word-break:break-word;white-space:pre-wrap">'+htmlEsc(m.body)+'</div>';
  } else {
    var bodyLines = (m.body||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    var isMultiLine = bodyLines.length>=2;
    var mode = CHAT_VIEW_MODE[m.id] || (isStreetListBody(m.body) ? 'checklist' : 'text');
    if(isMultiLine && mode==='checklist'){
      h += streetChecklistBubbleHtml(m, bodyLines, mine);
    } else {
      h += '<div style="background:'+(mine?'var(--red)':'var(--surface-3)')+';color:'+(mine?'#FFF':'var(--text)')+';border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.4;word-break:break-word;white-space:pre-wrap">'+htmlEsc(m.body)+'</div>';
      // Message sur plusieurs lignes qui n'a pas ete auto-detecte comme liste (ou dont la vue a
      // ete repassee en texte) — toujours proposer la bascule manuelle, l'heuristique peut se
      // tromper dans les deux sens (voir isStreetListBody).
      if(isMultiLine) h += '<button type="button" data-street-view-toggle="'+m.id+'" style="align-self:'+(mine?'flex-end':'flex-start')+';background:transparent;border:none;color:var(--text-dim);font-size:10px;text-decoration:underline;cursor:pointer;padding:2px 4px 0">📋 Afficher en liste à cocher</button>';
    }
  }
  h += '</div>';
  return h;
}
function chatMessagesHtml(msgs, meId, q, myRole){
  var filtered = q ? msgs.filter(function(m){ return (m.body||'').toLowerCase().indexOf(q)>-1 || (m.client_name||'').toLowerCase().indexOf(q)>-1; }) : msgs;
  if(!filtered.length){
    return empty(q ? 'Aucun message ne correspond a "'+htmlEsc(q)+'"' : 'Aucun message pour le moment');
  }
  return filtered.map(function(m){ return chatMessageHtml(m, meId, myRole); }).join('');
}
// Carte "ticket" pour une demande de prix (type: cost_request), envoyee par un closer via
// "Ask for Cost" depuis un rendez-vous. L'owner y renseigne le prix (input inline ci-dessous) ;
// une fois priced, le prix est visible par tous dans le canal Cost — utile pour la paie du closer.
// idPrefix (optionnel) : demande utilisateur 2026-09-27 "pour cost, seulement un cost [...] toutes
// les cost que ca sois un lead ou un rdv door vont a la meme place" — buildChatPage() fusionne les
// demandes de prix Leads CRM (S.adLeadCostRequests, systeme separe historiquement) aux cotes des
// vrais messages de chat type cost_request dans le canal "Cost". Comme les deux systemes ont des
// id independants (tables differentes), idPrefix ('adlead-') distingue les attributs data-* pour
// que le clic "Confirmer"/"Modifier" route vers le bon endpoint (voir #chat-scroll plus bas) —
// omis (comportement par defaut, chaine vide) partout ailleurs, donc aucun changement pour les 2
// autres appelants (buildLeadCloserPage/buildLeadsCrmOwnerPage, page 'cost' du Leads CRM seul).
function costTicketHtml(m, myRole, idPrefix){
  idPrefix = idPrefix || '';
  var dataId = idPrefix + m.id;
  var name = ((m.sender_first_name||'')+' '+(m.sender_last_name||'')).trim()||'?';
  var photos = m.photo_urls;
  if(typeof photos === 'string'){ try{ photos=JSON.parse(photos||'[]'); }catch(e){ photos=[]; } }
  if(!Array.isArray(photos)) photos=[];
  var h = '<div style="align-self:stretch;max-width:100%;background:var(--surface-3);border:1px solid var(--border);border-left:3px solid #DE1212;border-radius:10px;padding:12px 13px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    + '<div style="font-size:11px;font-weight:700;color:#DE1212;letter-spacing:.5px">📋 DEMANDE DE PRIX'+(idPrefix?' · LEAD':'')+'</div>'
    + '<div style="font-size:10px;color:var(--text-dim)">'+htmlEsc(name)+'</div></div>';
  h += '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px">'+htmlEsc(m.client_name||'Client')+'</div>';
  h += ir('Linear feet', htmlEsc(m.footage_total||'—'));
  h += ir('Necessary ladder', htmlEsc(m.ladder_type||'—'));
  h += ir('Tools needed', htmlEsc(m.tools_needed||'—'));
  h += ir('To remove', htmlEsc(m.obstacles_to_remove||'—'));
  if(photos.length){
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + photos.map(function(u){
      return '<a href="'+u+'" target="_blank" style="display:block;width:56px;height:56px;border-radius:7px;overflow:hidden;border:1px solid var(--border)"><img src="'+u+'" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy"></a>';
    }).join('') + '</div>';
  }
  h += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">';
  var isPriced = m.cost_status==='priced' && m.cost;
  if(isPriced && !(myRole==='owner' && EDITING_COST[dataId])){
    h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
      + '<div style="font-size:18px;font-weight:700;color:#44AA44">$'+Number(m.cost).toFixed(2)+'</div>'
      + (myRole==='owner' ? '<button type="button" class="btn-sm" data-edit-cost-btn="'+dataId+'" style="flex-shrink:0">Modifier</button>' : '')
      + '</div>';
  } else if(myRole==='owner'){
    h += '<div style="display:flex;gap:8px;align-items:center">'
      + '<input type="number" inputmode="decimal" placeholder="Prix $" value="'+(m.cost!=null?Number(m.cost):'')+'" data-cost-input="'+dataId+'" style="flex:1;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);outline:none;font-family:Arial,sans-serif">'
      + '<button type="button" class="btn-sm" data-set-cost-btn="'+dataId+'" style="flex-shrink:0;background:#DE1212;color:#FFF;border-color:#DE1212">Confirmer</button>'
      + '</div>';
  } else {
    h += '<span class="badge" style="background:#FEF3C7;color:#B45309;border:1px solid #FDE68A">En attente de prix</span>';
  }
  h += '</div></div>';
  return h;
}
// Classement hebdomadaire (S.leaderboard, alimente par GET /leaderboard + /poll toutes les 15s)
// — RDV pris pour les setters, deals fermes pour les closers, remis a zero automatiquement
// chaque lundi (voir computeLeaderboard() cote backend, aucune action manuelle necessaire).
function leaderboardHtml(){
  var lb = S.leaderboard || {setters:[], closers:[]};
  function medalCol(i){ return i===0?'#FFD700':i===1?'#CCCCCC':i===2?'#CD7F32':'#555'; }
  function medal(i){ return i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1); }
  function rowsHtml(list, unit){
    if(!list.length) return '<div style="padding:10px 4px;text-align:center;color:var(--text-faint);font-size:11px">Personne pour l\'instant</div>';
    return list.map(function(u,i){
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 2px'+(i<list.length-1?';border-bottom:1px solid var(--border)':'')+'">'
        +'<div style="width:26px;text-align:center;font-size:12px;font-weight:800;color:'+medalCol(i)+'">'+medal(i)+'</div>'
        +'<div style="flex:1;font-size:12px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+htmlEsc(u.name)+'</div>'
        +'<div style="font-size:12px;font-weight:800;color:#DE1212;flex-shrink:0">'+u.count+' '+unit+'</div>'
        +'</div>';

  }
  return '<div style="padding:10px 12px;background:var(--surface-3);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px">'
    +'<div style="font-size:9px;color:var(--text-dim);text-align:center">Semaine en cours (lundi → dimanche) — remise a zero automatique chaque lundi</div>'
    +'<div style="background:var(--surface-3);border:1px solid var(--border);border-radius:11px;padding:9px 10px">'
      +'<div style="font-size:10px;font-weight:800;color:#15803D;letter-spacing:.5px;margin-bottom:4px">📅 SETTERS — RDV CETTE SEMAINE</div>'

    +'</div>'
    +'<div style="background:var(--surface-3);border:1px solid var(--border);border-radius:11px;padding:9px 10px">'
      +'<div style="font-size:10px;font-weight:800;color:#A16207;letter-spacing:.5px;margin-bottom:4px">💰 CLOSERS — DEALS CETTE SEMAINE</div>'
      +rowsHtml(lb.closers,'deals')
    +'</div>'
    +'</div>';
}
function buildChatPage(){
  var msgs = S.chatMessages||[];
  var me = S.impersonate||S.user;
  var channels = S.chatChannels||[];
  var isOwner = me.role==='owner';
  var activeCh = channels.find(function(c){ return c.id===S.activeChannelId; });

  // Fusion des demandes de prix — demande utilisateur 2026-09-27 : "pour cost, seulement un cost
  // (on clique sur chat et ensuite cost. toutes les cost que ca sois un lead ou un rdv door vont
  // a la meme place". Les demandes de prix Leads CRM (S.adLeadCostRequests, systeme separe
  // historiquement — voir doSubmitAdLeadCostRequest) sont deja chargees inconditionnellement pour
  // l'owner (voir loadLeadsCrmData). Ici, uniquement quand l'owner regarde le canal "Cost", on les
  // ajoute a l'affichage aux cotes des vrais messages cost_request du chat porte-a-porte, triees
  // ensemble par date — un merge d'AFFICHAGE seulement, rien n'est deplace/duplique cote serveur,
  // et le Leads CRM (role lead_marketing/lead_closer) garde son propre onglet Cost inchange.
  if(isOwner && activeCh && activeCh.name==='Cost'){
    var adLeadItems = (S.adLeadCostRequests||[]).map(function(c){
      var tagged = {}; for(var k in c){ if(Object.prototype.hasOwnProperty.call(c,k)) tagged[k]=c[k]; }
      tagged.__adLeadCost = true;
      return tagged;
    });
    msgs = msgs.concat(adLeadItems).sort(function(a,b){ return (a.created_at||'').localeCompare(b.created_at||''); });
  }

  // Wrapper plein-hauteur : en-tete et composeur ont une taille fixe (flex-shrink:0),
  // seule la liste de messages (#chat-scroll) grandit et scrolle (flex:1). Ainsi le
  // composeur reste toujours colle au bas de l'ecran, meme s'il y a peu de messages.
  var h = '<div style="display:flex;flex-direction:column;height:100%">';

  h += '<div style="flex-shrink:0;background:var(--surface-3);border-bottom:1px solid var(--border)">';
  h += '<div style="display:flex;gap:6px;overflow-x:auto;padding:9px 10px;scrollbar-width:none">';
  channels.forEach(function(c){
    var on = c.id===S.activeChannelId;
    h += '<button type="button" class="btn-sm" data-channel-id="'+c.id+'" style="flex-shrink:0;white-space:nowrap'+(on?';background:#DE1212;color:#FFF;border-color:#DE1212':'')+'">💬 '+htmlEsc(c.name)+'</button>';
  });
  h += '<button type="button" class="btn-sm" id="chat-leaderboard-btn" style="flex-shrink:0;white-space:nowrap'+(S.showLeaderboard?';background:#FFD700;color:var(--text);border-color:#A16207':'')+'">🏆 Classement</button>';
  if(isOwner) h += '<button type="button" class="btn-sm" id="chat-new-channel-btn" style="flex-shrink:0;white-space:nowrap">+ Canal</button>';
  h += '</div>';
  h += '<div style="padding:0 10px 9px"><input id="chat-search" type="text" value="'+htmlEsc(S.chatSearch||'')+'" placeholder="🔍 Rechercher dans '+htmlEsc(activeCh?activeCh.name:'ce chat')+'..." style="width:100%;font-size:12px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);outline:none;font-family:Arial,sans-serif"></div>';
  h += '</div>';

  if(S.showLeaderboard) h += leaderboardHtml();

  var q = (S.chatSearch||'').toLowerCase().trim();
  h += '<div id="chat-scroll" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:10px 12px">'
    + chatMessagesHtml(msgs, me.id, q, me.role)
    + '</div>';

  // #chat-input etait un <input type="text"> — un <input> supprime TOUJOURS les retours a la
  // ligne de sa valeur (algorithme de nettoyage HTML standard), meme au paste. C'est la VRAIE
  // cause du bug signale "liste de rues collee = gros bloc de paragraphe compact" : coller une
  // liste multi-lignes dans un <input> fusionnait deja toutes les lignes en une seule AVANT meme
  // l'envoi au serveur, quel que soit le rendu cote affichage. Passe en <textarea> (auto-grow,
  // voir attachChatEvents) qui preserve les retours a la ligne ; Entree envoie toujours le
  // message (comportement inchange), Maj+Entree insere un retour a la ligne.
  h += '<div style="flex-shrink:0;background:var(--surface);display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);align-items:flex-end">'
    + '<input type="file" id="chat-photo-input" accept="image/*" multiple style="display:none">'
    + '<button type="button" id="chat-photo-btn" style="flex-shrink:0;width:40px;height:40px;border-radius:9px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center" '+(!S.activeChannelId?'disabled':'')+'>📷</button>'
    + '<textarea id="chat-input" rows="1" placeholder="Ecrire un message... (colle une liste de rues, une ligne par rue)" style="flex:1;font-size:13px;padding:10px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface-3);color:var(--text);outline:none;font-family:Arial,sans-serif;resize:none;max-height:120px;overflow-y:auto;line-height:1.4" '+(!S.activeChannelId?'disabled':'')+'></textarea>'
    + '<button class="btn btn-red" id="chat-send-btn" style="width:auto;margin-top:0;padding:0 16px;flex-shrink:0;align-self:stretch" '+(!S.activeChannelId?'disabled':'')+'>Envoyer</button>'
    + '</div>';

  h += '</div>';
  return h;
}
function scrollChatToBottom(){

}
async function switchChatChannel(channelId){

function openNewChannelSheet(){

    + '<button class="btn btn-green" id="create-channel-btn">Creer le canal</button>';
  openSheet('Nouveau canal de chat', h);
  setTimeout(function(){
    var btn = document.getElementById('create-channel-btn');
    if(!btn) return;
    btn.addEventListener('click', async function(){
      var nameEl = document.getElementById('new-channel-name');
      var name = nameEl ? nameEl.value.trim() : '';
      if(!name){ toast('Nom du canal requis'); return; }
      btn.disabled = true;
      try{
        var res = await apiFetch('POST', '/chat/channels', {name:name});
        S.chatChannels = await apiFetch('GET', '/chat/channels');

        S.chatSearch = '';
        closeSheet();
        render();
        toast('Canal cree: '+name);

async function sendChatPhotos(files){
  if(!files || !files.length || !S.activeChannelId) return;
  var sendBtn = document.getElementById('chat-send-btn');
  var photoBtn = document.getElementById('chat-photo-btn');
  if(sendBtn) sendBtn.disabled = true;
  if(photoBtn) photoBtn.disabled = true;
  try{
    for(var i=0;i<files.length;i++){
      var formData = new FormData();
      formData.append('photos', files[i]);
      formData.append('folder', 'chat');
      var uploadRes = await fetch(API_URL+'/upload', {method:'POST', headers:{Authorization:'Bearer '+TOKEN}, body: formData});
      var uploadData = await uploadRes.json();
      if(!uploadRes.ok) throw new Error(uploadData.error||'Upload echoue');
      var url = uploadData.urls && uploadData.urls[0] ? uploadData.urls[0].url : null;
      if(url) await apiFetch('POST', '/chat/messages', {imageUrl:url, channelId:S.activeChannelId});
    }
    await loadChatMessages();
    render();
    setTimeout(scrollChatToBottom, 0);
  } catch(e){ toast('Erreur photo: '+e.message); }
  if(sendBtn) sendBtn.disabled = false;
  if(photoBtn) photoBtn.disabled = false;
}
function attachChatEvents(main){
  var sendBtn = main.querySelector('#chat-send-btn');
  var input = main.querySelector('#chat-input');
  var photoBtn = main.querySelector('#chat-photo-btn');
  var photoInput = main.querySelector('#chat-photo-input');
  var searchInput = main.querySelector('#chat-search');
  var newChBtn = main.querySelector('#chat-new-channel-btn');
  var lbBtn = main.querySelector('#chat-leaderboard-btn');
  scrollChatToBottom();

  main.querySelectorAll('[data-channel-id]').forEach(function(btn){
    btn.addEventListener('click', function(){ switchChatChannel(this.dataset.channelId); });
  });
  if(newChBtn) newChBtn.addEventListener('click', function(){ openNewChannelSheet(); });
  if(lbBtn) lbBtn.addEventListener('click', function(){
    S.showLeaderboard = !S.showLeaderboard;
    if(S.showLeaderboard) reloadLeaderboard().then(render);
    else render();
  });

  if(searchInput){
    searchInput.addEventListener('input', function(){
      S.chatSearch = this.value;
      var scrollEl = document.getElementById('chat-scroll');
      var me = S.impersonate||S.user;
      if(scrollEl) scrollEl.innerHTML = chatMessagesHtml(S.chatMessages||[], me.id, this.value.toLowerCase().trim(), me.role);
    });
  }

  // Delegation sur #chat-scroll (persiste meme quand la recherche remplace innerHTML) —
  // permet a l'owner de confirmer un prix sur une carte "cost_request" (voir costTicketHtml).
  var scrollEl = main.querySelector('#chat-scroll');
  if(scrollEl && !scrollEl.dataset.costBound){
    scrollEl.dataset.costBound = '1';
    scrollEl.addEventListener('click', async function(e){
      var editBtn = e.target.closest('[data-edit-cost-btn]');
      if(editBtn){ EDITING_COST[editBtn.dataset.editCostBtn] = true; render(); return; }
      // Bascule manuelle texte <-> liste a cocher pour un message multi-lignes (voir
      // isStreetListBody / streetChecklistBubbleHtml) — demande utilisateur "liste de rues".
      var viewToggle = e.target.closest('[data-street-view-toggle]');
      if(viewToggle){
        var vmid = viewToggle.dataset.streetViewToggle;
        var vmsg = (S.chatMessages||[]).find(function(x){ return String(x.id)===String(vmid); });
        var curMode = CHAT_VIEW_MODE[vmid] || (isStreetListBody(vmsg?vmsg.body:'') ? 'checklist' : 'text');
        CHAT_VIEW_MODE[vmid] = curMode==='checklist' ? 'text' : 'checklist';
        render();
        return;
      }
      var setBtn = e.target.closest('[data-set-cost-btn]');
      if(!setBtn) return;
      var msgId = setBtn.dataset.setCostBtn;
      var inputEl = scrollEl.querySelector('[data-cost-input="'+msgId+'"]');
      var val = inputEl ? parseFloat(inputEl.value) : NaN;
      if(!val || val<=0){ toast('Enter a valid price'); return; }
      setBtn.disabled = true;
      // Carte fusionnee depuis le Leads CRM (voir buildChatPage/costTicketHtml, prefixe
      // 'adlead-') — route vers le bon endpoint (table separee) au lieu du chat porte-a-porte.
      var isAdLead = msgId.indexOf('adlead-')===0;
      try{
        if(isAdLead){
          await apiFetch('PATCH', '/leads-crm/cost-requests/'+msgId.slice(7)+'/cost', {cost: val});
          EDITING_COST[msgId] = false;
          await Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]);
        } else {
          await apiFetch('PATCH', '/chat/messages/'+msgId+'/cost', {cost: val});
          EDITING_COST[msgId] = false;
          await loadChatMessages();
        }
        render();
        toast('Price saved');
      } catch(err){ toast('Error: '+err.message); setBtn.disabled=false; }
    });
  }
  // Cases a cocher des listes de rues — evenement 'change' distinct (pas 'click', pour un
  // <input type=checkbox> natif) et mise a jour DOM ciblee (pas de render() complet) pour ne
  // pas perdre le scroll du chat a chaque coche pendant que le setter marche dans la rue.
  if(scrollEl && !scrollEl.dataset.streetCheckBound){
    scrollEl.dataset.streetCheckBound = '1';
    scrollEl.addEventListener('change', function(e){
      var cb = e.target.closest('[data-street-check]');
      if(!cb) return;
      var parts = cb.dataset.streetCheck.split(':');
      setStreetCheck(parts[0], parts[1], cb.checked);
      var label = cb.closest('label');
      if(label){
        var span = label.querySelector('span');
        if(span){ span.style.textDecoration = cb.checked?'line-through':'none'; span.style.opacity = cb.checked?'.55':'1'; }
      }
      var bubble = cb.closest('[data-street-bubble]');
      if(bubble){
        var countEl = bubble.querySelector('[data-street-count]');
        if(countEl){
          var totalN = bubble.querySelectorAll('[data-street-check]').length;
          var doneN = bubble.querySelectorAll('[data-street-check]:checked').length;
          countEl.textContent = doneN+'/'+totalN;
        }
      }
    });
  }

  if(photoBtn && photoInput){
    photoBtn.addEventListener('click', function(){ photoInput.click(); });
    photoInput.addEventListener('change', function(){
      var files = this.files;
      this.value='';
      sendChatPhotos(files);
    });
  }
  if(!sendBtn || !input) return;
  async function send(){
    var v = input.value.trim();
    if(!v || !S.activeChannelId) return;
    sendBtn.disabled = true;
    try{
      await apiFetch('POST', '/chat/messages', {text:v, channelId:S.activeChannelId});
      input.value='';
      input.style.height='';
      await loadChatMessages();
      render();
      setTimeout(scrollChatToBottom, 0);
    } catch(e){ toast('Erreur: '+e.message); }
    sendBtn.disabled = false;
  }
  sendBtn.addEventListener('click', send);
  // Entree envoie (comportement inchange) ; Maj+Entree insere un retour a la ligne — necessaire
  // maintenant que #chat-input est un textarea (voir buildChatPage) pour pouvoir quand meme
  // taper/coller un message multi-lignes volontairement avant l'envoi.
  input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  // Auto-grow jusqu'a max-height (120px, voir CSS inline) puis scroll interne — evite qu'une
  // liste de rues collee de 15 lignes n'ecrase le reste de l'ecran.
  input.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
}

// Upload de photos par LOTS — un closer peut selectionner un nombre illimite de photos (aucune
// limite cote UI/input), mais les envoyer en UNE seule requete multipart cassait au-dela de 10
// fichiers (plafond serveur, voir upload.array('photos', 20) cote backend) et pouvait timeout/
// planter sur de grosses selections (beaucoup de photos haute resolution dans un seul POST). On
// decoupe donc en lots de UPLOAD_BATCH_SIZE, envoyes sequentiellement (avec un essai de retry par
// lot en cas d'erreur reseau transitoire), en accumulant les URLs Cloudinary retournees — le deal/
// la demande de prix ne se soumet qu'une fois TOUTES les photos uploadees avec succes.
var UPLOAD_BATCH_SIZE = 15;
async function uploadPhotosBatched(fileList, folder, btn, baseLabel){
  var files = Array.prototype.slice.call(fileList||[]);
  var allUrls = [];
  if(!files.length) return allUrls;
  var total = files.length;
  for(var i=0;i<total;i+=UPLOAD_BATCH_SIZE){
    var batch = files.slice(i, i+UPLOAD_BATCH_SIZE);
    var uploadedSoFar = Math.min(i+batch.length, total);
    if(btn) btn.textContent = baseLabel+' ('+uploadedSoFar+'/'+total+')';
    var formData = new FormData();
    batch.forEach(function(f){ formData.append('photos', f); });
    formData.append('folder', folder);
    var lastErr = null;
    for(var attempt=0; attempt<2; attempt++){
      try{
        var res = await fetch(API_URL+'/upload', {method:'POST', headers:{Authorization:'Bearer '+TOKEN}, body:formData});
        var data = await res.json().catch(function(){ return {}; });
        if(!res.ok) throw new Error(data.error||'Upload echoue');
        allUrls = allUrls.concat(data.urls||[]);
        lastErr = null;
        break;
      }catch(e){ lastErr = e; }
    }
    if(lastErr) throw new Error('Envoi photos interrompu ('+allUrls.length+'/'+total+' envoyees): '+lastErr.message);
  }
  return allUrls;
}

// ═══════════════════════════════════════════
// POLLING — temps réel pour manager + tech
// ═══════════════════════════════════════════
function startPolling(){
  if(S.pollInterval) clearInterval(S.pollInterval);
  var role=S.user&&S.user.role;
  if(!role) return;
  S.pollInterval=setInterval(async function(){
    if(!TOKEN||S.view!=='app') return;
    try{
      var since=S.pollTime||new Date(Date.now()-30000).toISOString();
      var data=await apiFetch('GET','/poll?since='+encodeURIComponent(since));
      S.pollTime=data.serverTime||new Date().toISOString();
      // Un poll qui reussit a nouveau efface le signal "notifications potentiellement manquees"
      // pose par les echecs consecutifs ci-dessous (voir catch).
      if(S.syncErrors.polling){ markSyncOk('polling'); render(); }
      S._pollFailStreak = 0;
      var changed=false;
      // Manager: merge new/updated tickets into S.tickets
      if(data.newTickets&&data.newTickets.length>0){
        data.newTickets.forEach(function(nt){
          var idx=S.tickets.findIndex(function(t){return t.id===nt.id;});
          if(idx>=0) S.tickets[idx]=nt; else { S.tickets.unshift(nt); changed=true; toast('Nouveau ticket: '+nt.client_name); }
        });
        changed=true;
      }
      // Tech: merge updated jobs
      if(data.updatedJobs&&data.updatedJobs.length>0){
        data.updatedJobs.forEach(function(uj){
          var idx=S.tickets.findIndex(function(t){return t.id===uj.id;});
          if(idx>=0) S.tickets[idx]=uj; else S.tickets.unshift(uj);
        });
        changed=true;
      }
      // Setter/closer/owner: merge new chat messages (aucune donnee client dedans).
      // Seuls les messages du canal actuellement ouvert sont ajoutes a la liste affichee ;
      // les autres declenchent juste une notification (le canal sera rafraichi a l'ouverture).
      if(data.newChatMessages&&data.newChatMessages.length>0){
        var curRole=(S.impersonate||S.user).role;
        var onChatPage = S.page[curRole]==='chat';
        var otherChannelHit=false, sameChannelHit=false;
        data.newChatMessages.forEach(function(m){
          if(m.channel_id===S.activeChannelId){
            var idx=S.chatMessages.findIndex(function(x){return x.id===m.id;});
            // idx>=0 = message deja affiche mais MODIFIE depuis (ex: cost_request qui vient de
            // recevoir son prix) — on remplace au lieu d'ignorer, sinon le prix n'apparait
            // jamais sans changer de canal ou recharger l'app.
            if(idx<0){ S.chatMessages.push(m); changed=true; sameChannelHit=true; }
            else if(JSON.stringify(S.chatMessages[idx])!==JSON.stringify(m)){ S.chatMessages[idx]=m; changed=true; sameChannelHit=true; }
          } else {
            otherChannelHit=true;
          }
        });
        if(!onChatPage && sameChannelHit) toast('Nouveau message dans le chat');
        if(otherChannelHit) toast('Nouveau message dans un autre canal du chat');
      }
      // Leads CRM (owner/lead_marketing/lead_closer): merge new/updated ad_leads et cost
      // requests dans S.adLeads/S.adLeadCostRequests — sans ca, un lead entrant par webhook
      // (Zapier/GoHighLevel/Meta/Google) n'apparaissait qu'apres un refresh manuel de la page,
      // meme si le backend le renvoyait deja via /poll (data etait recue mais jamais consommee
      // cote front). Meme pattern d'upsert-par-id que newTickets ci-dessus.
      if(data.newAdLeads&&data.newAdLeads.length>0){
        S.adLeads=S.adLeads||[];
        data.newAdLeads.forEach(function(nl){
          var idx=S.adLeads.findIndex(function(l){return l.id===nl.id;});
          if(idx>=0) S.adLeads[idx]=nl;
          else { S.adLeads.unshift(nl); changed=true; toast('🆕 Nouveau lead: '+(nl.first_name||'')+' '+(nl.last_name||'')); }
        });
        changed=true;
      }
      if(data.newAdLeadCostRequests&&data.newAdLeadCostRequests.length>0){
        S.adLeadCostRequests=S.adLeadCostRequests||[];
        data.newAdLeadCostRequests.forEach(function(cr){
          var idx=S.adLeadCostRequests.findIndex(function(c){return c.id===cr.id;});
          if(idx>=0) S.adLeadCostRequests[idx]=cr; else S.adLeadCostRequests.unshift(cr);
        });
        changed=true;
      }
      // Leaderboard hebdomadaire — recalcule cote serveur a chaque poll ; on ne redeclenche un
      // render() que si le classement a reellement change (evite un re-render toutes les 15s
      // pour rien quand personne n'a bouge de RDV/deal cette minute-la).
      if(data.leaderboard){
        var lbChanged = JSON.stringify(data.leaderboard) !== JSON.stringify(S.leaderboard);
        S.leaderboard = data.leaderboard;
        if(lbChanged) changed = true;
      }
      if(changed) render();
    }catch(e){
      // Le poll rate silencieusement AVANT ne signalait jamais qu'on pouvait etre en train de
      // rater des notifications temps reel (nouveau ticket, message, lead) — voir audit securite
      // 2026-09-05. On tolere quelques echecs isoles (reseau instable, 15s de polling) avant
      // d'afficher le bandeau, pour ne pas alarmer sur un simple blip.
      console.error('[sync] poll failed:', e);
      S._pollFailStreak = (S._pollFailStreak||0) + 1;
      if(S._pollFailStreak>=3 && !S.syncErrors.polling){ markSyncFail('polling', e); render(); }
    }
  }, 15000); // every 15 seconds
}

function stopPolling(){
  if(S.pollInterval){ clearInterval(S.pollInterval); S.pollInterval=null; }
}

    // changement de closer utile (voir son calendrier, pas juste choisir un nom a l'aveugle).
    // Filtre aussi les heures bloquees par le closer (voir isDateHourBlocked/isDateFullyBlocked) —
    // s'applique aussi bien au setter qui booke qu'au closer qui se booke lui-meme (selfBooking).
    var closerSel=document.getElementById('nl-closer');
    var dateSel=document.getElementById('nl-date');
    var timeSel=document.getElementById('nl-time');
    var infoEl=document.getElementById('nl-closer-day-info');
    // Demande utilisateur : le setter doit voir TOUS les autres RDV (porte-a-porte ET Leads CRM
    // confondus, meme convention que dayApptsForCloser/openApptPickerSheet plus bas) ainsi que
    // les blocages d'horaire (journee complete OU plage partielle avec la raison) du closer
    // choisi — pas seulement un compte d'heures muet ou des options de <select> desactivees sans
    // explication. Remplace le simple texte par une vraie petite liste, comme le reste du CRM.
    function dayApptsForCloserNL(clId, ds){
      var list=[];
      (S.appts||[]).forEach(function(a){
        if(a.closer_id!==clId || a.appt_date!==ds) return;
        list.push({hour:a.appt_hour, name:(a.name||((a.lead_first_name||'')+' '+(a.lead_last_name||'')).trim())||'?'});
      });
      (S.adLeads||[]).forEach(function(l){
        if(l.closer_id!==clId || l.appt_date!==ds) return;
        list.push({hour:l.appt_hour, name:adLeadName(l)});
      });
      return list.sort(function(a,b){ return (a.hour||0)-(b.hour||0); });
    }
    function dayBlackoutsForCloserNL(clId, ds){
      return (S.closerBlackouts||[]).filter(function(b){ return b.closer_id===clId && b.date===ds; });
    }
    function refreshCloserDayInfo(){
      if(!infoEl) return;
      var clId=closerSel?closerSel.value:acId;
      var ds=(dateSel||{}).value;
      if(timeSel) Array.prototype.forEach.call(timeSel.options, function(opt){ opt.disabled=false; });
      if(!clId){ infoEl.innerHTML=''; return; }
      if(!ds){ infoEl.innerHTML='Choisissez une date pour voir le calendrier de ce closer.'; return; }
      var blackouts=dayBlackoutsForCloserNL(clId, ds);
      var fullyBlocked=isDateFullyBlocked(clId, ds);
      if(timeSel) Array.prototype.forEach.call(timeSel.options, function(opt){
        opt.disabled = fullyBlocked || isDateHourBlocked(clId, ds, parseFloat(opt.value));
      });
      var dayAppts=dayApptsForCloserNL(clId, ds);
      var h='';
      if(blackouts.length){

        }).join('')+'</div>';

        infoEl.innerHTML=h;
        return;
      }
      h+= dayAppts.length
        ? '<div>'+dayAppts.length+' RDV déjà pris ce jour :</div>'
          +dayAppts.map(function(a){ return '<div>'+fh(a.hour)+' — '+htmlEsc(a.name)+'</div>'; }).join('')
        : '<div>Aucun RDV pour ce closer ce jour — disponible.</div>';
      infoEl.innerHTML=h;
    }
    if(closerSel) closerSel.addEventListener('change', refreshCloserDayInfo);
    if(dateSel) dateSel.addEventListener('change', refreshCloserDayInfo);
    refreshCloserDayInfo();
  },0);
}

// BLOCAGES D'HORAIRE CLOSER — vacances, sport, indisponibilite. Bloque la prise de RDV pour tout
// le monde (voir isSlotBlocked() cote serveur) — pas seulement le bouton + du closer lui-meme.
// ═══════════════════════════════════════════
function isDateHourBlocked(closerId, dateStr, hour){
  if(!closerId || !dateStr) return false;
  return (S.closerBlackouts||[]).some(function(b){
    if(b.closer_id!==closerId || b.date!==dateStr) return false;
    if(b.all_day) return true;
    if(hour==null || b.start_hour==null || b.end_hour==null) return false;
    return hour>=b.start_hour && hour<b.end_hour;
  });
}
function isDateFullyBlocked(closerId, dateStr){
  if(!closerId || !dateStr) return false;
  return (S.closerBlackouts||[]).some(function(b){ return b.closer_id===closerId && b.date===dateStr && b.all_day; });
}

// Genere les dates d'une recurrence hebdomadaire (meme jour de semaine que `startDate`, chaque
// 7 jours, jusqu'a `untilDate` inclus). Plafonne a 52 occurrences (~1 an) — garde-fou simple
// contre une erreur de saisie (date de fin tres eloignee) qui spammerait des dizaines de POST.
function weeklyRecurrenceDates(startDate, untilDate){
  var out=[startDate];
  var cur=new Date(startDate+'T12:00:00');
  var until=new Date(untilDate+'T12:00:00');
  var guard=0;
  while(guard<52){
    cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7);
    if(cur.getTime()>until.getTime()) break;
    out.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));
    guard++;
  }
  return out;
}

async function doAddBlackout(){
  var date=(document.getElementById('bo-date')||{}).value||'';
  var allDay=!!(document.getElementById('bo-allday')||{}).checked;
  var startH=(document.getElementById('bo-start')||{}).value;
  var endH=(document.getElementById('bo-end')||{}).value;
  var reason=(document.getElementById('bo-reason')||{}).value||'';
  var repeat=!!(document.getElementById('bo-repeat')||{}).checked;
  var repeatUntil=(document.getElementById('bo-repeat-until')||{}).value||'';
  if(!date){ toast('Choisir une date'); return; }
  if(!allDay && parseFloat(endH)<=parseFloat(startH)){ toast('L\'heure de fin doit être après l\'heure de début'); return; }
  if(repeat && !repeatUntil){ toast('Choisir une date de fin pour la répétition'); return; }
  if(repeat && repeatUntil<date){ toast('La date de fin doit être après la date de début'); return; }
  var dates = repeat ? weeklyRecurrenceDates(date, repeatUntil) : [date];
  var btn=document.getElementById('save-blackout-btn');
  if(btn){ btn.disabled=true; btn.textContent='...'; }
  try{
    // Sequentiel (pas Promise.all) — evite de bombarder le serveur de dizaines de POST simultanes
    // pour une longue recurrence, et si une occurrence echoue (ex. conflit), les precedentes
    // restent quand meme creees plutot que de tout perdre en cas d'echec partiel groupe.
    var failed=0;
    for(var i=0;i<dates.length;i++){
      try{
        await apiFetch('POST','/closer-blackouts',{
          date:dates[i], allDay:allDay,
          startHour:allDay?null:parseFloat(startH),
          endHour:allDay?null:parseFloat(endH),
          reason:reason
        });
      }catch(e){ failed++; }
    }
    await reloadBlackouts();
    closeSheet();
    if(failed) toast((dates.length-failed)+'/'+dates.length+' créneaux bloqués ('+failed+' échec(s))');
    else toast(dates.length>1?dates.length+' créneaux bloqués':'Créneau bloqué');
    render();
  }catch(e){
    toast('Erreur: '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='🚫 Bloquer ce créneau'; }
  }
}

  var rows = gate.fields.map(function(f){ return a[f.key] ? ir(f.label, htmlEsc(a[f.key])) : ''; }).join('');
  if(!rows) return '';
  return '<div style="background:var(--surface-3);border-radius:9px;padding:9px;margin:6px 0 0">'+rows+'</div>';
}
function openApptSheet(idStr){
  var id=String(idStr); // Keep as string — UUIDs from API are strings
  var rawA=S.appts.find(function(x){ return String(x.id)===id; });
  if(!rawA){ toast('RDV introuvable'); return; }
  var a=normAppt(rawA);
  a.id=rawA.id; // preserve original id for API calls
  var col=STATUS_COL[a.status]||'#CCAA00';
  var scheduledStr=a.date?a.date+' · '+fh(a.hour):'?';
  var viewerRole=(S.impersonate||S.user).role;
  // "Confirmed" ajoute aux options du closer — demande utilisateur : le closer doit pouvoir
  // confirmer lui-meme un RDV (jusqu'ici seul le setter avait ce statut dans ses options).
  // "Cancelled" ajoute aux options du closer/owner — demande utilisateur : pouvoir annuler un RDV
  // (jusqu'ici seul le setter avait cette option, voir setterSts ci-dessous).
  var fullSts=['Scheduled','Confirmed','Closed Won','Closed Lost','No Answer','Not Home','Callback','Rescheduled','Cancelled'];
  var setterSts=['Scheduled','Cancelled','Confirmed'];
  // Setter voit toujours le statut reel du RDV (badge ci-dessous), mais ne peut le changer
  // que parmi ses 3 options. Le closer garde ses options habituelles (+Confirmed).
  var sts=viewerRole==='setter'?setterSts:fullSts;
  var h='<div style="background:var(--surface-3);border-radius:9px;padding:11px;margin-bottom:10px">'
    +'<div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px">'+htmlEsc(a.name)+'</div>'
    +'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">Tel: '+htmlEsc(a.phone||'')+'</div>'
    +'<div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">Adresse: '+htmlEsc(a.addr||'')+'</div>'
    +'<div style="font-size:11px;color:var(--text-dim);margin-bottom:5px">Date: '+scheduledStr+'</div>'
    +'<span class="badge" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'">'+htmlEsc(a.status)+'</span>'
    +(a.setter?'<div style="font-size:10px;color:var(--text-faint);margin-top:5px">Setter: '+htmlEsc(a.setter)+'</div>':'')
    +(a.notes?'<div style="font-size:10px;color:var(--text-faint);margin-top:2px">'+htmlEsc(a.notes)+'</div>':'')
    +'</div>'
    // RDV issu du Leads CRM (lead marketing booke via POST /leads-crm/leads/:id/book) — affiche ici
    // toutes les reponses de la fiche de qualification remplies par l'admin avant le booking, pour
    // que le closer ait le contexte complet sans devoir redemander au client. N'apparait que s'il y
    // a effectivement quelque chose a montrer (voir demande utilisateur ci-dessus).
    +apptQualificationInfoHtml(a)
    // Notes du lead (Queue) — demande utilisateur 2026-09-29 : "quand je save une note sur un
    // lead dans queue, la note ne s'affiche pas sur la fiche du lead quand je set le rendez vous
    // dans le calendrier d'un closer". Ces notes horodatees (voir GET /leads-crm/leads/:id/notes,
    // ajoutees depuis openAdLeadSheet dans Queue) vivent sur le LEAD (ad_leads), pas sur le
    // rendez-vous (appointments.notes, deja affiche plus haut, un champ libre distinct) — booker
    // le lead au calendrier (POST /leads-crm/leads/:id/book) ne les copie jamais dans le RDV,
    // elles n'etaient donc simplement jamais chargees ici. On reutilise EXACTEMENT
    // loadAdLeadNotes() (meme conteneur #al-notes-list, meme rendu) — lecture seule ici, l'ajout
    // de nouvelles notes reste dans la fiche du lead (Queue).
    +(a.adLeadId
      ? '<div class="sdiv" style="margin-top:8px">Notes du lead (Queue)</div><div id="al-notes-list" style="margin:6px 0;max-height:180px;overflow-y:auto">Chargement...</div>'
      : '')
    // Infos client + notes editables en tout temps, meme RDV deja pris/ferme (voir demande
    // utilisateur "setters puissent modifier leurs RDV meme apres qu'ils soient pris") — repliees
    // par defaut pour garder la fiche compacte, ouvertes au clic.
    +'<button class="btn" id="edit-appt-btn" type="button" style="margin-bottom:8px;background:var(--surface-3);border:1px solid var(--border);color:var(--text)">✏️ Modifier les infos / notes</button>'
    +'<div id="edit-appt-form" style="display:none">'
      +'<div class="frow"><div class="field"><label>Prenom</label><input id="ea-first" value="'+htmlEsc(a.firstName)+'"></div><div class="field"><label>Nom</label><input id="ea-last" value="'+htmlEsc(a.lastName)+'"></div></div>'
      +'<div class="field"><label>Telephone</label><input id="ea-phone" type="tel" value="'+htmlEsc(a.phone||'')+'"></div>'
      +'<div class="field"><label>Email</label><input id="ea-email" type="email" value="'+htmlEsc(a.email||'')+'"></div>'
      +'<div class="field"><label>Adresse</label><input id="ea-addr" value="'+htmlEsc(a.addr||'')+'"></div>'
      +'<div class="frow"><div class="field"><label>Ville</label><input id="ea-city" value="'+htmlEsc(a.city||'')+'"></div><div class="field"><label>Code postal</label><input id="ea-postal" value="'+htmlEsc(a.postal||'')+'"></div></div>'
      +'<div class="field"><label>Notes</label><textarea id="ea-notes">'+htmlEsc(a.notes||'')+'</textarea></div>'
      +'<button class="btn btn-red" id="save-appt-edit-btn" type="button">Enregistrer</button>'
    +'</div>'
    // Photos du RDV — demande utilisateur : pouvoir rajouter une photo sur les RDV pour les
    // callbacks (ex: photo prise au porte-a-porte pour se souvenir de la maison/du client au
    // rappel). Pas restreint au seul statut Callback : utile sur n'importe quel RDV, mais mis en
    // avant ici puisque c'est le cas d'usage demande.
    +'<div class="sdiv">Photos'+(a.status==='Callback'?' (callback)':'')+'</div>'
    +(a.photoUrls.length
      ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px">'+a.photoUrls.map(function(u){
          return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="Photo RDV" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)"></a>';
        }).join('')+'</div>'
      : '<div style="font-size:11px;color:var(--text-dim);margin:4px 0 8px">Aucune photo</div>')
    +'<input type="file" id="appt-photos" accept="image/*" multiple style="display:block;margin-bottom:6px;font-size:11px;color:var(--text-dim)">'
    +'<button class="btn" id="appt-upload-photos-btn" type="button" style="background:var(--surface-3);border:1px solid var(--border);margin-bottom:8px">📷 Ajouter des photos</button>'
    +'<div class="sdiv">Statut</div>'
    // Le bouton de statut actif ("on") etait toujours rouge via la classe CSS generique .scc.on
    // (var(--red)), meme pour un statut dont la couleur reelle (STATUS_COL) est differente — ex:
    // Callback (sarcelle #0E7490) s'affichait rouge une fois selectionne dans cette grille. On
    // applique maintenant un style inline base sur STATUS_COL[s] quand le bouton est actif, qui
    // prime sur la classe CSS — coherent avec le badge et la carte du jour, qui utilisent deja
    // STATUS_COL. Voir signalement utilisateur (closer) "Callback : sarcelle partout".
    +'<div class="scgrid">'+sts.map(function(s){
      var isOn=a.status===s;
      var sc=STATUS_COL[s]||'#CC3333';
      return '<button class="scc'+(isOn?' on':'')+'"'+(isOn?' style="border-color:'+sc+';color:'+sc+';background:'+sc+'1A"':'')+' data-set-status="'+s+'" data-appt-id="'+a.id+'">'+s+'</button>';
    }).join('')+'</div>'
    +apptStatusReasonSummaryHtml(a)
    +'<div id="appt-status-gate-slot"></div>'
    +'<div class="sdiv" style="margin-top:8px">Reprogrammer / Callback</div>'
    +'<button class="btn btn-green" id="rs-btn">📅 Choisir un nouveau créneau dans le calendrier</button>'
    +(a.status==='Closed Won'?'<button class="btn btn-green" id="deal-btn" style="margin-top:6px">Creer un Deal</button>':'')
    +((viewerRole==='closer'||viewerRole==='team_leader_vente')?'<button class="btn" id="ask-cost-btn" style="margin-top:6px;background:var(--surface-3);border:1px solid #DE1212;color:#DE1212">Ask for Cost</button>':'');
  // Suppression du RDV — owner uniquement (demande utilisateur 2026-09-23 : pouvoir supprimer un
  // rendez-vous depuis l'horaire d'un closer en "Vue de"). On verifie S.user.role (le VRAI compte
  // connecte), jamais viewerRole (qui reflete le role impersonne) — meme principe que le serveur
  // (requireOwner sur DELETE /appointments/:id), donc le bouton apparait aussi bien en Vue de
  // qu'en consultant son propre calendrier. Confirmation en deux temps inline (pas de
  // window.confirm) pour rester coherent avec le reste de l'app (voir le pattern gate-confirm/
  // gate-cancel plus haut) et eviter une suppression accidentelle en un seul clic.
  var isRealOwner = S.user.role==='owner';
  if(isRealOwner){
    h += '<div class="sdiv" style="margin-top:10px">Zone dangereuse</div>'
      + '<button class="btn" id="del-appt-btn" type="button" style="background:var(--surface-3);border:1px solid #CC3333;color:#CC3333">🗑️ Supprimer le rendez-vous</button>'
      + '<div id="del-appt-confirm-slot"></div>';
  }
  openSheet('Rendez-vous', h);
  if(a.adLeadId) setTimeout(function(){ loadAdLeadNotes(a.adLeadId); }, 0);
  setTimeout(function(){
    // Toggle infos/notes edit form
    var editBtn=document.getElementById('edit-appt-btn');
    var editForm=document.getElementById('edit-appt-form');
    if(editBtn && editForm) editBtn.addEventListener('click', function(){
      editForm.style.display = editForm.style.display==='none' ? 'block' : 'none';
    });
    var saveEditBtn=document.getElementById('save-appt-edit-btn');
    if(saveEditBtn) saveEditBtn.addEventListener('click', async function(){
      saveEditBtn.disabled=true; saveEditBtn.textContent='...';
      try {
        await apiFetch('PATCH','/appointments/'+a.id,{
          clientFirstName:(document.getElementById('ea-first')||{}).value||'',
          clientLastName:(document.getElementById('ea-last')||{}).value||'',
          phone:(document.getElementById('ea-phone')||{}).value||'',
          email:(document.getElementById('ea-email')||{}).value||'',
          address:(document.getElementById('ea-addr')||{}).value||'',
          city:(document.getElementById('ea-city')||{}).value||'',
          postal:(document.getElementById('ea-postal')||{}).value||'',
          notes:(document.getElementById('ea-notes')||{}).value||'',
        });
        await Promise.all([reloadAppts(), reloadLeads(), reloadMasterDbIfOwner()]);
        toast('RDV mis a jour');
        openApptSheet(a.id);
      } catch(e) {
        toast('Erreur: '+e.message);
        saveEditBtn.disabled=false; saveEditBtn.textContent='Enregistrer';
      }
    });
    // Photos — meme pattern que le quote du Leads CRM (uploadPhotosBatched + PATCH photoUrls).
    var uploadPhotosBtn=document.getElementById('appt-upload-photos-btn');
    if(uploadPhotosBtn) uploadPhotosBtn.addEventListener('click', async function(){
      var input=document.getElementById('appt-photos');
      if(!input || !input.files.length){ toast('Choisir au moins une image'); return; }
      uploadPhotosBtn.disabled=true;
      try{
        var uploaded = await uploadPhotosBatched(input.files, 'appointments', uploadPhotosBtn, 'Televersement');
        var newUrls = uploaded.map(function(p){ return p.url; });
        var existing = Array.isArray(a.photoUrls) ? a.photoUrls : [];
        await apiFetch('PATCH','/appointments/'+a.id,{photoUrls: existing.concat(newUrls)});
        await Promise.all([reloadAppts(), reloadMasterDbIfOwner()]);
        toast('Photo(s) ajoutee(s)!');
        openApptSheet(a.id);
      }catch(e){ toast('Erreur: '+e.message); uploadPhotosBtn.disabled=false; uploadPhotosBtn.textContent='📷 Ajouter des photos'; }
    });
    // Status chips — soumet le nouveau statut au serveur (voir submitApptStatus). Certains
    // statuts (Cancelled/Callback/Rescheduled/Closed Lost) affichent d'abord un petit formulaire
    // obligatoire (demande utilisateur) au lieu de soumettre tout de suite — voir plus bas.
    function submitApptStatus(aid, s, extra){
      var payload=Object.assign({status:s}, extra||{});
      return apiFetch('PATCH','/appointments/'+aid,payload).then(function(){
        // "Closed Won" met aussi a jour leads.status et peut creer un ticket cote serveur
        // si un deal existait deja pour ce RDV (cas rare) — on recharge les trois par prudence.
        return Promise.all([reloadAppts(), reloadLeads(), reloadTickets(), reloadMasterDbIfOwner()]).then(function(){ toast('Statut: '+s); openApptSheet(aid); });
      }).catch(function(e){ toast('Erreur: '+e.message); throw e; });
    }
    document.querySelectorAll('[data-set-status]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var s=this.dataset.setStatus;
        var aid=this.dataset.apptId;
        var gate=GATED_APPT_STATUSES[s];
        var gatedRole=(viewerRole==='closer'||viewerRole==='setter');
        var gateSlot=document.getElementById('appt-status-gate-slot');
        if(gate && gatedRole){
          if(gateSlot){
            gateSlot.innerHTML=apptStatusGateFormHtml(s, a);
            gateSlot.scrollIntoView({behavior:'smooth', block:'nearest'});
            var confirmBtn=document.getElementById('gate-confirm-btn');
            var cancelBtn=document.getElementById('gate-cancel-btn');
            if(confirmBtn) confirmBtn.addEventListener('click', function(){
              var extra={};
              var missingField=false;
              gate.fields.forEach(function(f){
                var el=document.getElementById('gate-'+f.key);
                var val=el?el.value.trim():'';
                if(!val) missingField=true;
                extra[f.key]=val;
              });
              if(missingField){ toast('Veuillez remplir tous les champs ci-dessus'); return; }
              confirmBtn.disabled=true; confirmBtn.textContent='...';
              submitApptStatus(aid, s, extra).catch(function(){
                confirmBtn.disabled=false; confirmBtn.textContent='Confirmer « '+s+' »';
              });
            });
            if(cancelBtn) cancelBtn.addEventListener('click', function(){ gateSlot.innerHTML=''; });
          }
          return;
        }
        submitApptStatus(aid, s, {});
      });
    });
    // Reschedule — meme calendrier "clic direct" que le Leads CRM (voir openApptPickerSheet),
    // affiche tous les RDV deja planifies (porte-a-porte ET Leads CRM) pour eviter tout
    // double-booking, peu importe l'origine du conflit. excludeApptId exclut ce RDV lui-meme de
    // son propre calcul d'occupation (sinon son creneau actuel apparaitrait "occupe").
    var rsBtn=document.getElementById('rs-btn');
    if(rsBtn) rsBtn.addEventListener('click', function(){
      openApptPickerSheet({initialDate:a.date, excludeApptId:a.id, closerId:a.closerId, closerName:a.closerName}, async function(newDate, newHour){
        S.calYear=new Date(newDate+'T12:00:00').getFullYear();
        S.calMonth=new Date(newDate+'T12:00:00').getMonth();
        S.calSelDate=newDate;
        try {
          await apiFetch('PATCH','/appointments/'+a.id,{apptDate:newDate,apptHour:newHour});
          await Promise.all([reloadAppts(), reloadMasterDbIfOwner()]);
          toast(a.name+' reprogramme');
          closeSheet(); render();
        } catch(e){ toast('Erreur: '+e.message); }
      });
    });
    // Deal
    var dealBtn=document.getElementById('deal-btn');
    if(dealBtn) dealBtn.addEventListener('click', function(){ closeSheet(); openDealSheet(a.id); });
    // Ask for Cost
    var askCostBtn=document.getElementById('ask-cost-btn');
    if(askCostBtn) askCostBtn.addEventListener('click', function(){ closeSheet(); openAskCostSheet(a); });
    // Supprimer le RDV — owner uniquement (voir DELETE /appointments/:id cote serveur, qui
    // refuse si un deal/ticket d'installation y est deja rattache). Confirmation inline avant
    // l'appel reel, pour un clic accidentel sans consequence.
    var delBtn=document.getElementById('del-appt-btn');
    var delSlot=document.getElementById('del-appt-confirm-slot');
    if(delBtn && delSlot) delBtn.addEventListener('click', function(){
      delSlot.innerHTML = '<div style="background:#FEE2E2;border:1px solid #FCA5A5;border-radius:9px;padding:11px;margin-top:8px">'
        + '<div style="font-size:12px;color:#991B1B;margin-bottom:8px">Supprimer définitivement ce rendez-vous ? Le créneau sera libéré dans l\'horaire du closer. Cette action est irréversible.</div>'
        + '<button class="btn btn-red" id="del-appt-confirm-btn" type="button">Confirmer la suppression</button>'
        + '<button class="btn" id="del-appt-cancel-btn" type="button" style="margin-top:6px;background:var(--surface-3);border:1px solid var(--border)">Annuler</button>'
        + '</div>';
      delSlot.scrollIntoView({behavior:'smooth', block:'nearest'});
      var confirmDelBtn=document.getElementById('del-appt-confirm-btn');
      var cancelDelBtn=document.getElementById('del-appt-cancel-btn');
      if(confirmDelBtn) confirmDelBtn.addEventListener('click', async function(){
        confirmDelBtn.disabled=true; confirmDelBtn.textContent='...';
        try{
          await apiFetch('DELETE','/appointments/'+a.id,{});
          // Un RDV supprime peut avoir ete lie a un lead marketing/referencement (voir cote
          // serveur, qui delie sans les supprimer) — on recharge aussi ces listes par prudence,
          // en plus du calendrier/base globale, pour que la fiche du lead concerne reflete
          // immediatement "non booke" si l'owner l'ouvre juste apres.
          await Promise.all([reloadAppts(), reloadLeads(), loadLeadsCrmData(), reloadMasterDbIfOwner()]);
          closeSheet();
          toast('Rendez-vous supprimé');
          render();
        }catch(e){
          toast('Erreur: '+e.message);
          confirmDelBtn.disabled=false; confirmDelBtn.textContent='Confirmer la suppression';
        }
      });
      if(cancelDelBtn) cancelDelBtn.addEventListener('click', function(){ delSlot.innerHTML=''; });
    });
  },0);
}

// ASK FOR COST — le closer envoie une demande de prix structuree (canal "Cost")
// depuis un rendez-vous. L'owner y repond ensuite avec un prix (voir attachChatEvents).
// ═══════════════════════════════════════════
function openAskCostSheet(a, kind){
  kind = kind || 'appt';
  var h = '<div style="background:var(--surface-3);border-radius:9px;padding:10px 11px;margin-bottom:12px;font-size:12px;color:var(--text-dim)">'
      + 'Client: <span style="color:var(--text)">'+htmlEsc(a.name||'')+'</span>'
      + (a.addr?'<br>Adresse: <span style="color:var(--text)">'+htmlEsc(a.addr)+'</span>':'')
      + '</div>'
    + '<div class="field"><label>How many linear feet?</label><input id="cost-footage" type="number" inputmode="decimal" placeholder="0"></div>'
    + '<div class="field"><label>Necessary ladder</label><select id="cost-ladder">'
      + '<option value="">Select...</option><option>Step ladder</option><option>18-foot ladder</option>'
      + '<option>25-foot ladder</option><option>32-foot ladder</option><option>Boom lift</option>'
      + '</select></div>'
    + '<div class="field"><label>Tools needed for the job</label><textarea id="cost-tools" placeholder="ex: screwdriver, oscillating tool, sawzall"></textarea></div>'
    + '<div class="field"><label>What do we need to remove to do the job?</label><textarea id="cost-obstacles" placeholder="ex: gutters, window bars, obstacles"></textarea></div>'
    + '<div style="background:var(--surface-3);border:1px dashed var(--border);border-radius:9px;padding:14px;text-align:center;margin-bottom:12px">'
      + '<input type="file" id="cost-photos" accept="image/*" multiple style="display:none">'
      + '<button type="button" class="btn" id="cost-photo-btn" style="width:auto;margin-top:0;padding:8px 16px;display:inline-block">Add Photos</button>'
      + '<div id="cost-photo-count" style="font-size:11px;color:var(--text-dim);margin-top:6px">No photos selected</div>'
      + '</div>'
    + '<button class="btn btn-red" id="submit-cost-btn">Ask for Cost</button>';
  openSheet('Ask for Cost', h);
  setTimeout(function(){
    var photoBtn=document.getElementById('cost-photo-btn');
    var photoInput=document.getElementById('cost-photos');
    var photoCount=document.getElementById('cost-photo-count');
    if(photoBtn && photoInput) photoBtn.addEventListener('click', function(){ photoInput.click(); });
    if(photoInput) photoInput.addEventListener('change', function(){
      var n=this.files.length;
      if(photoCount){
        photoCount.textContent = n+(n===1?' photo selected':' photos selected');
        photoCount.style.color = n>0?'#44AA44':'#555';
      }
    });
    var submitBtn=document.getElementById('submit-cost-btn');
    if(submitBtn) submitBtn.addEventListener('click', function(){
      if(kind==='adlead') doSubmitAdLeadCostRequest(a, submitBtn);
      else doSubmitCostRequest(a, submitBtn);
    });
  },0);
}
async function doSubmitCostRequest(a, btn){
  var footage=(document.getElementById('cost-footage')||{}).value||'';
  var ladder=(document.getElementById('cost-ladder')||{}).value||'';
  var tools=(document.getElementById('cost-tools')||{}).value||'';
  var obstacles=(document.getElementById('cost-obstacles')||{}).value||'';
  var photoInput=document.getElementById('cost-photos');
  if(!footage){ toast('Enter linear feet'); return; }
  if(!ladder){ toast('Select a ladder'); return; }
  btn.disabled=true;
  var origLabel=btn.textContent;
  try{
    var photoUrls=[];
    if(photoInput && photoInput.files.length>0){
      var urls = await uploadPhotosBatched(photoInput.files, 'cost', btn, 'Uploading photos');
      photoUrls = urls.map(function(p){ return p.url; });
    }
    btn.textContent='Sending...';
    var costChannel=(S.chatChannels||[]).find(function(c){ return c.name==='Cost'; });
    if(!costChannel){ toast('Cost channel not found'); btn.disabled=false; btn.textContent=origLabel; return; }
    await apiFetch('POST','/chat/messages',{
      channelId: costChannel.id,
      type: 'cost_request',
      appointmentId: a.id,
      clientName: a.name||'',
      footageTotal: footage,
      ladderType: ladder,
      toolsNeeded: tools,
      obstaclesToRemove: obstacles,
      photoUrls: photoUrls,
    });
    closeSheet();
    toast('Cost request sent!');
    // Redirige automatiquement vers Chat > canal Cost pour que le closer voie sa demande
    // tout de suite, sans devoir naviguer manuellement jusqu'au chat.
    var role = (S.impersonate||S.user).role;
    S.page[role] = 'chat';
    S.activeChannelId = costChannel.id;
    await loadChatMessages();
    render();
    setTimeout(scrollChatToBottom, 0);
  } catch(e){
    toast('Error: '+e.message);
    btn.disabled=false; btn.textContent=origLabel;
  }
}

// Variante "Ask for Cost" pour le Leads CRM — meme formulaire (openAskCostSheet), mais poste
// vers /leads-crm/cost-requests (isole du chat porte-a-porte) au lieu du canal Cost du chat.
async function doSubmitAdLeadCostRequest(a, btn){

  var obstacles=(document.getElementById('cost-obstacles')||{}).value||'';
  var photoInput=document.getElementById('cost-photos');
  if(!footage){ toast('Enter linear feet'); return; }
  if(!ladder){ toast('Select a ladder'); return; }
  btn.disabled=true;
  var origLabel=btn.textContent;
  try{
    var photoUrls=[];
    if(photoInput && photoInput.files.length>0){
      var urls = await uploadPhotosBatched(photoInput.files, 'leads-crm', btn, 'Uploading photos');
      photoUrls = urls.map(function(p){ return p.url; });
    }
    btn.textContent='Sending...';
    await apiFetch('POST','/leads-crm/cost-requests',{
      adLeadId: a.id,
      clientName: a.name||'',

// IMPORTANT : ce bandeau reste TOUJOURS visible (sur chaque dashboard, voir bindPushBanner) quel

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  var rawData = window.atob(base64);
  var arr = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;i++) arr[i]=rawData.charCodeAt(i);
  return arr;
}
// Re-synchronise l'abonnement push avec le serveur a chaque ouverture de l'app (login ET session
// reprise), plutot que de compter uniquement sur le clic ponctuel "Activer" (enablePushNotifications
// ci-dessous, toujours disponible pour la premiere activation / apres un refus).
//
// BUG racine des notifications "parfois ca marche, parfois non" : Notification.permission (etat du
// NAVIGATEUR, persistant) et l'abonnement push (endpoint+cles, stocke cote serveur dans
// push_subscriptions) sont deux etats SEPARES qui peuvent diverger silencieusement — un abonnement
// expire/tourne (Apple/Google font tourner les endpoints periodiquement), le service worker est
// reinstalle (nouveau CACHE_NAME), la personne change de telephone/reinstalle la PWA, ou le serveur
// supprime la ligne apres un 410/404 (voir push.js) — dans TOUS ces cas, permission reste "granted"
// donc le bandeau affiche "Notifications activées" et ne montre plus JAMAIS le bouton "Activer" :
// il n'existait avant ce correctif AUCUN moyen de re-souscrire sans que la personne clique d'abord
// "Désactiver" (ce qui n'a aucun effet si getSubscription() renvoie deja null cote navigateur) —
// silencieux, quasi impossible a diagnostiquer pour un utilisateur.
// Corrige en reconciliant l'abonnement a chaque ouverture d'app (voir les 2 appels dans init() et
// doLogin() plus bas) : si permission=granted mais aucun abonnement navigateur actif, on en recree
// un ; dans tous les cas on repousse endpoint+cles au serveur (upsert idempotent cote backend, voir
// POST /push/subscribe) pour que le serveur ait toujours la version courante, meme si elle n'avait
// pas change (protege aussi contre une ligne supprimee cote serveur sans que le navigateur le sache).
async function ensurePushSubscription(){
  try{
    if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if(Notification.permission!=='granted') return; // ne JAMAIS re-demander tout seul, sans clic explicite
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){
      var vapid = await apiFetch('GET','/push/vapid-public-key');
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(vapid.publicKey),
      });
    }
    var json = sub.toJSON();
    // `app` tague cet abonnement (voir migration push_subscriptions.app cote backend) pour que le
    // serveur route les notifs Soumission Calfeutrage UNIQUEMENT vers l'app dediee (icone SC) et
    // toutes les autres notifs UNIQUEMENT vers l'app principale — sans ce tag, les deux apps
    // installees sur le meme telephone recevraient chacune TOUTES les notifs en double.
    await apiFetch('POST','/push/subscribe',{endpoint:json.endpoint, keys:json.keys, app: IS_SC_APP?'soumission-calfeutrage':'main'});
  }catch(e){
    console.warn('[push] resync failed:', e && e.message);
  }
}
async function enablePushNotifications(btn){
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    toast('Notifications non supportées sur ce navigateur.');
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent='...'; }
  try{
    var perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifications refusées.'); render(); return; }
    var reg = await navigator.serviceWorker.ready;
    var vapid = await apiFetch('GET','/push/vapid-public-key');
    var sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(vapid.publicKey),
    });
    var json = sub.toJSON();
    await apiFetch('POST','/push/subscribe',{endpoint:json.endpoint, keys:json.keys, app: IS_SC_APP?'soumission-calfeutrage':'main'});
    toast('Notifications activées !');
  }catch(e){
    toast('Erreur: '+(e.message||'impossible d\'activer les notifications'));
  }
  render();
}
// Desactive le push pour CET appareil : retire l'abonnement navigateur ET le supprime cote
// serveur (sinon le backend continuerait d'essayer d'y envoyer des push vers un abonnement mort).
// Note: la permission navigateur (Notification.permission) elle-meme ne peut pas etre revoquee
// par du JS — seule la personne peut le faire dans les reglages du site ; ce bouton coupe donc
// l'envoi reel des push sans avoir besoin d'aller dans les reglages du navigateur/telephone.
async function disablePushNotifications(btn){
  if(btn){ btn.disabled=true; btn.textContent='...'; }
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(sub){
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      await apiFetch('DELETE','/push/subscribe',{endpoint:endpoint}).catch(function(){});
    }
    toast('Notifications désactivées.');
  }catch(e){
    toast('Erreur: '+(e.message||'impossible de désactiver les notifications'));
  }
  render();
}

function nextAdLeadStage(status){
  var i = AD_LEAD_STAGES.indexOf(status);

function kanbanCardHtml(l, readOnly){

    // Deplacement direct et facile vers "Non qualifiés" — jamais bloque par la fiche de
    // qualification (voir qualificationBlocksStatusChange), disponible depuis n'importe quelle

    h += '</div>';

function buildAdLeadKanban(leads, readOnly){

      + '</div></div>';

// Verrou de qualification (Leads CRM) — un lead_closer ne peut pas faire progresser un lead NON
// exempt (qualification_exempt, voir migration database.js) tant que la fiche de qualification
// n'est pas complete (qualification_completed_at). Meme message exact que cote serveur (voir
// QUALIFICATION_LOCK_MESSAGE dans routes/index.js) — le check ici n'est qu'un pre-filtre UX
// instantane, le serveur re-valide de toute facon a chaque PATCH.
var QUALIFICATION_LOCK_MESSAGE = 'Veuillez compléter la fiche de qualification avant de pouvoir déplacer ce lead vers un autre statut.';
function isLeadQualified(l){
  return !!(l && (l.qualification_exempt || l.qualification_completed_at));
}
function qualificationBlocksStatusChange(l, newStatus){
  var role = (S.impersonate||S.user||{}).role;
  if(role!=='lead_closer') return false;
  if(!l || newStatus===l.status) return false;
  // "Contacted" (premier contact effectue) et "Not Qualified" (sortie anticipee du pipeline) ne
  // sont JAMAIS bloques par la fiche de qualification — miroir exact du serveur, voir
  // isQualificationBlocking dans routes/index.js.
  if(newStatus==='Contacted' || newStatus==='Not Qualified') return false;
  return !isLeadQualified(l);
}
// Verrou "Closed Lost" cote Leads CRM (ad_leads) — demande utilisateur : etendre le meme
// verrou raison+photo au pipeline Leads CRM. Le chemin le plus frequent (RDV reellement booke
// au calendrier d'un closer) est deja couvert par le verrou sur appointments (voir
// GATED_APPT_STATUSES) qui synchronise ensuite ce statut ici automatiquement — ce verrou-ci
// couvre le chemin restant : le bouton "Avancer" du kanban, utilise directement par lead_closer.
// Miroir client de isAdLeadClosedLostBlocking/adLeadClosedLostSatisfied cote serveur.
function adLeadClosedLostSatisfiedClient(lead){
  var hasReason = !!(lead && lead.closed_lost_reason && String(lead.closed_lost_reason).trim());
  var quoteUrls = (lead && Array.isArray(lead.quote_image_urls)) ? lead.quote_image_urls : [];
  return hasReason && quoteUrls.length>0;
}
var AD_LEAD_CLOSED_LOST_LOCK_MESSAGE = 'Veuillez indiquer la raison de la perte et ajouter une photo de la soumission avant de marquer ce lead Closed Lost.';
function openAdLeadClosedLostGateSheet(lead){
  var quoteUrls = Array.isArray(lead.quote_image_urls) ? lead.quote_image_urls : [];
  var h = '<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">'+AD_LEAD_CLOSED_LOST_LOCK_MESSAGE+'</div>'
    + '<div class="field"><label>Raison de la perte</label><textarea id="cl-reason" placeholder="Raison de la perte">'+htmlEsc(lead.closed_lost_reason||'')+'</textarea></div>'
    + '<div class="sdiv">Photo de la soumission</div>'
    + (quoteUrls.length
        ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px">'+quoteUrls.map(function(u){ return '<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="Quote" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)"></a>'; }).join('')+'</div>'
        : '<div style="font-size:11px;color:var(--text-dim);margin:4px 0 8px">Aucune soumission televersee</div>')
    + '<input type="file" id="cl-photos" accept="image/*" multiple style="display:block;margin-bottom:6px;font-size:11px;color:var(--text-dim)">'
    + '<button class="btn btn-red" id="cl-confirm-btn" type="button" style="margin-top:6px">Confirmer « Closed Lost »</button>';
  openSheet('Lead perdu — raison requise', h);
  setTimeout(function(){
    var confirmBtn=document.getElementById('cl-confirm-btn');
    if(confirmBtn) confirmBtn.addEventListener('click', async function(){
      var reasonEl=document.getElementById('cl-reason');
      var reason=reasonEl?reasonEl.value.trim():'';
      if(!reason){ toast('Veuillez indiquer la raison de la perte'); return; }
      var input=document.getElementById('cl-photos');
      confirmBtn.disabled=true; confirmBtn.textContent='...';
      try{
        var newUrls=[];
        if(input && input.files.length){
          var uploaded = await uploadPhotosBatched(input.files, 'quotes', confirmBtn, 'Televersement');
          newUrls = uploaded.map(function(p){ return p.url; });
        }
        var allUrls = quoteUrls.concat(newUrls);
        if(!allUrls.length){
          toast('Veuillez ajouter une photo de la soumission');
          confirmBtn.disabled=false; confirmBtn.textContent='Confirmer « Closed Lost »';
          return;
        }
        await apiFetch('PATCH','/leads-crm/leads/'+lead.id,{status:'Closed Lost', claim:true, closedLostReason:reason, quoteImageUrls:allUrls});
        await Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]);
        toast('Statut: Closed Lost');
        closeSheet(); render();
      }catch(e){
        toast('Erreur: '+e.message);
        confirmBtn.disabled=false; confirmBtn.textContent='Confirmer « Closed Lost »';
      }
    });
  },0);
}
function bindAdLeadKanbanMoves(main){
  main.querySelectorAll('[data-move-adlead]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = this.dataset.moveAdlead;
      var to = this.dataset.moveTo;
      var lead = (S.adLeads||[]).find(function(x){ return String(x.id)===String(id); });
      if(qualificationBlocksStatusChange(lead, to)){
        toast(QUALIFICATION_LOCK_MESSAGE);
        openAdLeadSheet(id);
        return;
      }
      var role=(S.impersonate||S.user||{}).role;
      if(to==='Closed Lost' && role==='lead_closer' && !adLeadClosedLostSatisfiedClient(lead)){
        openAdLeadClosedLostGateSheet(lead);
        return;
      }
      apiFetch('PATCH','/leads-crm/leads/'+id,{status:to, claim:true})
        .then(function(){ return Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]); })
        .then(function(){ toast('Statut: '+to); render(); })
        .catch(function(err){ toast('Erreur: '+err.message); });
    });
  });
}

// Delegation sur le conteneur de la liste "Cost" — permet a l'owner de confirmer un prix
// (voir costTicketHtml pour le rendu de la carte data-set-cost-btn / data-cost-input).
function bindAdLeadCostPricing(containerEl){
  if(!containerEl || containerEl.dataset.costBound) return;
  containerEl.dataset.costBound='1';
  containerEl.addEventListener('click', async function(e){
    var editBtn = e.target.closest('[data-edit-cost-btn]');
    if(editBtn){ EDITING_COST[editBtn.dataset.editCostBtn] = true; render(); return; }
    var setBtn = e.target.closest('[data-set-cost-btn]');
    if(!setBtn) return;
    var id = setBtn.dataset.setCostBtn;
    var inputEl = containerEl.querySelector('[data-cost-input="'+id+'"]');
    var val = inputEl ? parseFloat(inputEl.value) : NaN;
    if(!val || val<=0){ toast('Enter a valid price'); return; }
    setBtn.disabled = true;
    try{
      await apiFetch('PATCH', '/leads-crm/cost-requests/'+id+'/cost', {cost: val});
      EDITING_COST[id] = false;
      await Promise.all([loadLeadsCrmData(), reloadMasterDbIfOwner()]);
      render();
      toast('Price saved');
    } catch(err){ toast('Error: '+err.message); setBtn.disabled=false; }
  });
}

async function doCreateAdLead(){
  var source=(document.getElementById('al-source')||{}).value||'Autre';

// FICHE DE QUALIFICATION (Leads CRM) — verrou obligatoire avant l'appel initial du lead_closer.
// Tant que qualification_completed_at est NULL (et le lead non exempt, voir isLeadQualified), ce
// formulaire s'affiche EN PREMIER dans la fiche du lead, avant tout le reste (Quote/Notes/Statut).
// Une fois complete, on affiche plutot un resume en lecture seule (qualificationSummaryHtml) —
// les reponses restent toujours visibles, peu importe le statut/etape ulterieur du lead.

var QUAL_BUILDING_TYPES = ['Maison','Condo','Duplex','Triplex','Immeuble','Commercial','Industriel','Autre'];
var QUAL_SEALANT_COLORS = ['Blanc','Noir','Gris','Beige','Brun','Autre'];

var QUAL_TIMELINES = ['Dès que possible','1 à 3 mois','3 à 6 mois','Plus de 6 mois','Pas encore décidé'];

function qualSelectHtml(id, options, current, placeholder){
  var opts = '<option value="">'+placeholder+'</option>'+options.map(function(o){
    return '<option value="'+htmlEsc(o)+'"'+(current===o?' selected':'')+'>'+htmlEsc(o)+'</option>';
  }).join('');
  return '<select id="'+id+'">'+opts+'</select>';
}
// Groupe de boutons toggle (Oui/Non, langue, etc.) — meme classe .scc/.scgrid que les boutons de
// statut pour une apparence coherente. La valeur choisie se lit au moment de la sauvegarde via
// querySelector('.scc.on[data-ql-toggle="name"]') plutot que par un etat JS separe : plus simple,
// et evite tout risque de desynchronisation avec l'affichage.
function qualToggleHtml(name, options, current){
  return '<div class="scgrid" data-ql-group="'+name+'">'+options.map(function(o){
    return '<button type="button" class="scc'+(current===o?' on':'')+'" data-ql-toggle="'+name+'" data-ql-value="'+htmlEsc(o)+'">'+htmlEsc(o)+'</button>';
  }).join('')+'</div>';
}
function qualToggleValue(main, name){
  var btn = main.querySelector('.scc.on[data-ql-toggle="'+name+'"]');
  return btn ? btn.dataset.qlValue : '';
}

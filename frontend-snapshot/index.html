<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PROTEK CRM</title>

<!-- PWA: makes the app installable to the home screen on phones (Android/Chrome + iOS/Safari). -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

<!-- iOS Safari doesn't read manifest.json for home-screen install — needs its own tags. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protek">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,200;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS — matched to protek-admin.netlify.app (light, near-black/white admin
   UI, Inter throughout, 16px cards with soft shadow, pill badges/buttons, minimal red
   accent used only for the logo mark + a couple of highlight moments). Same class
   names as before — this is a values-only refresh, no markup/behavior changes.
   ═══════════════════════════════════════════ */
:root{
  --red:#DE1212; --red-rgb:222,18,18; --red-light:#DE1212; --red-dim:#B40E0E;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F2F2F2;
  --border:#E7E7E7; --border-soft:#EFEFEF;
  --text:#0A0A0A; --text-dim:#5D5D5D; --text-faint:#8A8A8A; --fill:#0A0A0A;
  --radius-sm:8px; --radius:12px; --radius-lg:16px;
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Inter',system-ui,-apple-system,sans-serif;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);
}
body.dark-mode{
  --bg:#000000; --surface:#0D0D0D; --surface-2:#141414; --surface-3:#1C1C1C;
  --border:#2A2A2A; --border-soft:#222222;
  --text:#F2F2F2; --text-dim:#ABABAB; --text-faint:#767676; --fill:#DE1212;
  --shadow-card:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
}
body.dark-mode .bnav,body.dark-mode .overlay{background-color:transparent}
body.dark-mode ::-webkit-scrollbar{background:#000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font-ui);font-size:14px;background:var(--bg);color:var(--text);height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);position:relative}
@media(min-width:480px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.tbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tbar-r{display:flex;align-items:center;gap:10px}
.ptitle{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.07em}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;background:var(--surface-2)}
.hbtn{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--radius-sm);color:var(--text);cursor:pointer;padding:0}
.hbtn:hover{background:var(--surface-3)}
/* Hamburger nav drawer — protek-admin.netlify.app style (dark slide-in panel, white
   pill for the active item), replaces the old always-visible bottom tab bar. Reuses the
   same #bnav element/click-listener as before so page-switching JS is untouched. */
.drawer-scrim{position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:59;opacity:0;pointer-events:none;transition:opacity .18s}
.drawer-scrim.on{opacity:1;pointer-events:auto}
.bnav{position:fixed;top:0;bottom:0;left:0;width:260px;max-width:82vw;background:#0A0A0A;z-index:60;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease;box-shadow:8px 0 30px rgba(0,0,0,.25)}
.bnav.open{transform:translateX(0)}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 14px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid #1F1F1F;color:#FFF;flex-shrink:0}
.drawer-nav{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:2px}
.drawer-ftr{flex-shrink:0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1F1F1F}
.dftr-row{display:flex;align-items:center;gap:9px;padding:6px 4px 10px}
.dftr-logout{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;color:var(--text-faint);font-size:12.5px;font-weight:600;padding:8px 4px;cursor:pointer;font-family:var(--font-ui)}
.dftr-logout:hover{color:#FFF}
.bn{width:100%;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:10px 10px;border:none;background:transparent;cursor:pointer;border-radius:var(--radius-sm);color:#B0B0B0;font-size:13px;font-weight:600;letter-spacing:normal;position:relative;transition:background .12s,color .12s;text-align:left}
.bn:hover{background:#161616;color:#FFF}
.bn.on{background:var(--surface);color:var(--text)}
.bni{line-height:1;color:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bni svg{width:19px;height:19px;display:block}
.bnl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card)}
.sl{font-size:11.5px;color:var(--text-faint);margin-bottom:8px;font-weight:500}
.sv{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.ss{font-size:10.5px;color:var(--text-faint);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin:0 12px 10px;overflow:hidden;box-shadow:var(--shadow-card)}
.chdr{padding:12px 15px;border-bottom:1px solid var(--border-soft);font-size:12.5px;font-weight:700;color:var(--text);background:var(--surface);display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em}
.row{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border-soft);cursor:pointer;gap:9px;transition:background .12s}
.row:last-child{border-bottom:none}
.row:active,.row:hover{background:var(--surface-2)}
.rav{width:34px;height:34px;border-radius:50%;background:var(--fill);border:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#FFF;flex-shrink:0}
.rmain{flex:1;min-width:0}
.rn{font-size:12.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:10px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.bs{background:#FEF3C7;color:#B45309}
.bw{background:#DCFCE7;color:#15803D}
.bl{background:#FEE2E2;color:#B91C1C}
.bn2{background:#DBEAFE;color:#1D4ED8}
.ba{background:#FEE2E2;color:var(--red)}
.bna{background:#F3E8FF;color:#7E22CE}
.bpend{background:#FEF3C7;color:#B45309}
.bcb{background:#CFFAFE;color:#0E7490}
.bowner{background:#F3E8FF;color:#7E22CE}
.bsetter{background:#DBEAFE;color:#1D4ED8}
.bcloser{background:#DCFCE7;color:#15803D}
.bmanager{background:#FFEDD5;color:#C2410C}
.btech{background:#FCE7F3;color:#BE185D}
.btl{background:#FEF9C3;color:#A16207}
.bwait{background:#F3F4F6;color:#6B7280}
.tel-link{color:#1D4ED8;text-decoration:none;cursor:pointer}
.tel-link:hover,.tel-link:active{color:var(--red);text-decoration:underline}
.empty{padding:36px 16px;text-align:center;color:var(--text-faint);font-size:12px}
.pipe{display:flex;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.pip{flex:1;min-width:55px;text-align:center;padding:7px 2px;font-size:9px;font-weight:700;background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border);border-right:none;letter-spacing:.02em}
.pip:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.pip:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-right:1px solid var(--border)}
.pip.done{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
.pip.cur{background:var(--red);color:#FFF;border-color:var(--red)}
.pip strong{display:block;font-size:13px;margin-top:2px}
.revitem{margin-bottom:10px}
.revitem:last-child{margin-bottom:0}
.revtop{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.revtrack{background:var(--surface-3);border-radius:3px;height:6px;overflow:hidden}
.revfill{height:6px;border-radius:3px;background:var(--red)}
.fab{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));right:14px;width:50px;height:50px;border-radius:50%;background:var(--fill);border:none;color:#FFF;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .12s}
.fab:active{transform:scale(.94)}
.tabs{display:flex;gap:6px;margin:8px 12px 0;padding:4px;border-radius:99px;background:var(--surface-3)}
.tab{flex:1;padding:7px 4px;border:none;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-ui);letter-spacing:normal}
.tab.on{background:var(--fill);color:#FFF}
.tab:not(.on){background:transparent;color:var(--text-dim)}
.banner{background:var(--red);color:#FFF;font-size:11px;font-weight:700;padding:8px 13px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.section-hdr{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 13px 7px}
.urow{display:flex;align-items:flex-start;padding:13px;border-bottom:1px solid var(--border-soft);gap:10px}
.urow:last-child{border-bottom:none}
.uav{width:36px;height:36px;border-radius:50%;background:var(--fill);border:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#FFF;flex-shrink:0}
.uinfo{flex:1;min-width:0}
.uname{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.uemail{font-size:10px;color:var(--text-faint);margin-top:2px}
.uacts{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0}
.ab{padding:5px 9px;border-radius:var(--radius-sm);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font-ui);border:none;letter-spacing:.02em}
.abok{background:#DCFCE7;color:#15803D}
.abno{background:#FEE2E2;color:#B91C1C}
.absus{background:#FEF3C7;color:#B45309}
.abr{background:#FEE2E2;color:#B91C1C}
.rsel{font-size:10px;padding:4px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;cursor:pointer;font-family:var(--font-ui)}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}
.viewrow{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border-soft);cursor:pointer;gap:9px;transition:background .12s}
.viewrow:last-child{border-bottom:none}
.viewrow:hover{background:var(--surface-2)}
.calday{min-height:58px;min-width:0;overflow:hidden;padding:2px;border-radius:var(--radius-sm);cursor:pointer;background:transparent;border:1px solid transparent;transition:background .12s,border-color .12s;box-sizing:border-box}
.calday.sel{background:#FEE2E2;border-color:var(--red)}
.calday.today{background:var(--surface-3);border-color:var(--border)}
.acard2{margin:5px 12px;border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:opacity .12s}
.acard2:hover{opacity:.85}
/* Bannieres "hype" pour les notifications automatiques (+1 RDV / +1 deal) dans Team Rive-Sud —
   pulsation douce en boucle pour attirer l'oeil sans etre distrayante. */
@keyframes hypePulse{0%,100%{box-shadow:0 0 10px var(--hc),0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 22px var(--hc),0 0 6px var(--hc)}}
.hypecard{animation:hypePulse 2.2s ease-in-out infinite}
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end}
.overlay.on{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;border:1px solid var(--border);width:100%;max-width:480px;margin:0 auto;max-height:90vh;overflow-y:auto;padding-bottom:28px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.shandle{width:34px;height:3px;background:var(--border);border-radius:2px;margin:10px auto 12px}
.shdr{padding:0 15px 11px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between}
.shtitle{font-size:14px;font-weight:700;color:var(--text)}
.sbody{padding:13px 15px}
.ir{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border-soft);gap:12px}
.ir:last-of-type{border-bottom:none}
.ilbl{font-size:11px;color:var(--text-faint);flex-shrink:0}
.ival{font-size:12px;color:var(--text);text-align:right;flex:1}
.sdiv{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;padding:11px 0 6px;border-top:1px solid var(--border-soft);margin-top:4px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:11px;color:var(--text-dim);font-weight:600}
.field input,.field select,.field textarea{font-size:13px;padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%;outline:none;-webkit-appearance:none;font-family:var(--font-ui);transition:border-color .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--text)}
.field textarea{resize:none;min-height:70px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tooltag{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;user-select:none;transition:background .12s,border-color .12s,color .12s}
.tooltag .toolcircle{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:var(--surface);flex-shrink:0;transition:background .12s,border-color .12s,box-shadow .12s}
.tooltag.on{background:#FEE2E2;border-color:var(--red);color:var(--red)}
.tooltag.on .toolcircle{background:var(--red);border-color:var(--red);box-shadow:0 0 8px rgba(var(--red-rgb),.4)}
.tooltag:active{opacity:.75}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface-3);color:var(--text);width:100%;min-height:44px;font-family:var(--font-ui);margin-top:8px;transition:opacity .12s,transform .08s;letter-spacing:normal}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-red{background:var(--red);color:#FFF;border-color:var(--red)}
.btn-green{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
.btn-sm{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;color:var(--text-dim);font-size:10px;cursor:pointer;font-family:var(--font-ui);font-weight:600}
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.scc{padding:10px;border-radius:var(--radius-sm);font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);text-align:center;font-family:var(--font-ui);font-weight:600;transition:border-color .12s,color .12s,background .12s}
.scc.on{border-color:var(--red);color:var(--red);background:#FEE2E2}
.info-green{font-size:11px;color:#166534;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px}
.info-yellow{font-size:11px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px}
/* Pipeline kanban (Leads CRM) — colonnes par etape, scroll horizontal snap, style
   inspire de GoHighLevel/LeadConnector (board d'opportunites en colonnes). */
.kanban-wrap{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.kanban-wrap::-webkit-scrollbar{display:none}
.kcol{flex:0 0 210px;scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:64vh}
.kcol-hdr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;white-space:nowrap}
.kcol-count{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);border-radius:99px;padding:1px 7px;font-size:10px;flex-shrink:0}
.kcol-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;display:flex;flex-direction:column;gap:8px}
.kcol-empty{text-align:center;color:var(--text-faint);font-size:11px;padding:16px 4px}
.kcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;cursor:pointer;transition:background .12s;box-shadow:var(--shadow-card)}
.kcard:active,.kcard:hover{background:var(--surface-2)}
.kcard-name{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:4px;margin-bottom:3px}
.kcard-meta{font-size:10px;color:var(--text-dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard-actions{margin-top:7px}
.kmove{width:100%;font-size:10px;font-weight:700;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 6px;color:var(--text-dim);cursor:pointer;font-family:var(--font-ui)}
.kmove:active{background:var(--surface-3)}
.avatar,#profile-btn{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--fill)!important;color:#FFF!important;border-radius:50%!important;font-weight:700;font-size:12px;border:none!important}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--fill);color:#FFF;border:1px solid var(--fill);padding:8px 17px;border-radius:var(--radius-sm);font-size:11px;font-weight:700;z-index:999;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.dm-toggle{width:40px;height:23px;border-radius:99px;border:1px solid #333;background:#333;position:relative;cursor:pointer;flex-shrink:0;padding:0;transition:background .15s,border-color .15s}
.dm-toggle .dm-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#B0B0B0;transition:transform .15s,background .15s}
.dm-toggle[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.dm-toggle[aria-pressed="true"] .dm-knob{transform:translateX(17px);background:#FFF}

/* ═══════════════════════════════════════════
   DESKTOP LAYOUT (>=1024px) — demande utilisateur 2026-09-25 : "je veux une interface
   pour ordinateur, pas une interface de cellulaire" quand on se connecte sur un
   ordinateur. Aucun changement de fonctionnalite/JS/markup : le tiroir hamburger
   (#bnav, meme element, meme code de construction du menu) devient simplement une
   barre laterale FIXE et toujours visible via une transformation CSS forcee, #app
   perd son plafond de 480px et prend le reste de la largeur a cote d'elle, et les
   boutons qui servaient a ouvrir/fermer le tiroir sont caches puisqu'il ne se
   ferme plus. En dessous de 1024px (cellulaire/tablette), rien ne change.

   Ecrans avant connexion (choix CRM, login, inscription, mot de passe oublie, compte en
   attente) : ces vues vident deja #drawer-nav et cachent le hamburger en JS (aucune
   modification ici) — on ajoute juste la classe body.no-sidebar au meme endroit pour que
   la barre laterale (qui n'a alors aucun menu a afficher) reste cachee et que #app
   reprenne toute la largeur, plutot que de montrer un panneau vide. */
@media(min-width:1024px){
  #app{max-width:none;margin:0 0 0 260px;border-left:none}

<script>
// ═══════════════════════════════════════════
// API
// ═══════════════════════════════════════════
var API_URL = (location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? 'http://localhost:3001/api'
  : 'https://protek-backend-production.up.railway.app/api';

// Mini-app "Soumission Calfeutrage" — demande utilisateur 2026-09-29 (suite) : sur iOS, une
// notification web push affiche TOUJOURS l'icone de l'app installee sur l'ecran d'accueil
// (limite Safari — le champ `icon` du payload est ignore), donc aucun moyen de differencier le
// logo par notification au sein d'UNE SEULE app installee. Solution : une deuxieme "app" (meme
// index.html, servi sous /soumission-app/, avec son propre manifest.json + sw.js + icone SC —
// voir Netlify) qui, une fois ajoutee a l'ecran d'accueil separement, a sa propre identite
// visuelle cote iOS. Ce flag pilote TOUT le comportement "app dediee" ci-dessous : page forcee,
// nav masquee, acces reserve a owner, abonnement push tague pour router les notifs Soumission
// Calfeutrage uniquement vers cette app (voir POST /push/subscribe {app:...} plus bas).
var IS_SC_APP = location.pathname.indexOf('/soumission-app/') === 0;

var TOKEN = localStorage.getItem('protek_token');

async function apiFetch(method, path, body) {
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  var res = await fetch(API_URL + path, opts);
  var data = await res.json().catch(function(){ return {}; });
  if (!res.ok) throw Object.assign(new Error(data.error || 'Error'), { data: data });
  return data;
}

// ═══════════════════════════════════════════
// SYNC ERROR TRACKING — voir audit securite 2026-09-05 : les echecs reseau/401/403/serveur au
// chargement etaient avales silencieusement puis remplaces par [], ce qui affichait "aucun lead"/
// "aucune commission" a la place d'un vrai signal "donnees non synchronisees". markSyncFail garde
// la derniere copie valide en memoire (n'ecrase JAMAIS S.<champ> par [] sur erreur) et alimente
// syncErrorBannerHtml() ; markSyncOk efface le drapeau des qu'un chargement reussit a nouveau.
// ═══════════════════════════════════════════
function markSyncFail(key, err){
  console.error('[sync] '+key+' failed:', err);
  S.syncErrors[key] = true;
}
function markSyncOk(key){ delete S.syncErrors[key]; }
function syncErrorBannerHtml(){
  var keys = Object.keys(S.syncErrors||{});
  if(!keys.length) return '';
  return '<div style="display:flex;align-items:center;gap:8px;background:#FEF3C7;border-bottom:1px solid #F59E0B;color:#92400E;font-size:11px;font-weight:600;padding:8px 12px">'
    + '⚠️ Certaines donnees n\'ont pas pu etre synchronisees (connexion ou serveur) — ce qui est affiche peut etre incomplet ou perime.'
    + '<button id="sync-retry-btn" class="btn-sm" style="margin-left:auto;background:rgba(255,255,255,.5);border-color:#F59E0B;color:#92400E">Réessayer</button>'
    + '</div>';
}
function bindSyncErrorBanner(root){
  var btn=(root||document).querySelector('#sync-retry-btn');
  if(btn) btn.addEventListener('click', async function(){
    btn.disabled=true; btn.textContent='...';
    await loadLeadsAndAppts();
    render();
  });
}

// ═══════════════════════════════════════════
// STATE — single source of truth
// ═══════════════════════════════════════════
var S = {
  syncErrors: {},
  view: 'login',   // crmChoice | login | register | forgotPassword | resetPassword | pending | app
  crmMode: null,        // 'd2d' | 'leads'
  // true seulement quand l'utilisateur a explicitement choisi DOOR/LEADS sur l'ecran "Choisir un
  // CRM" (via le lien "Changer de CRM") — demande utilisateur 2026-09-28 "je veux que pour tout
  // le monde ca soit le login direct". Par defaut cet ecran n'apparait plus JAMAIS au chargement :
  // S.view demarre direct sur 'login'. Ce flag distingue "connexion normale" (on fait toujours
  // confiance au role reel du compte, jamais de rejet) d'un "changement de CRM" explicitement
  // demande (seul cas ou on verifie encore la correspondance / propose le swap de double-role —
  // voir doLogin()).
  crmChoiceExplicit: false,
  resetToken: null,     // jeton "mot de passe oublie" tire de l'URL (?resetToken=...), voir init()
  user: null,
  users: [],
  // Queue (section 'queue' du Leads CRM) est reservee au owner depuis le 2026-09-15 (voir
  // requireQueueOwner cote serveur) — lead_marketing/lead_closer atterrissent desormais sur leur
  // Calendrier (page 'cal', inchangee, toujours alimentee par GET /leads-crm/leads en lecture).
  page: { owner: (IS_SC_APP ? 'soumissioncalfeutrage' : 'overview'), setter:'dash', closer:'cal', manager:'dash', tech:'dash', lead_marketing:'cal', lead_closer:'cal', team_leader_vente:'dash' },
  adminTab: 'pending',
  adminSearch: '', // recherche par nom dans "Equipe > Actifs" (admin) — demande utilisateur 2026-09-28
  installTab: 'horaire', // 'horaire' | 'attente' — onglet actif de la page Installations (admin+manager)
  impersonate: null,
  assignments: {},
  deals: [],
  leads: [],
  appts: [],
  // Leads de référencement (calfeutrageprotek.com/referencement) — owner/team_leader_vente/closer
  // uniquement, voir GET /referencement/leads et loadLeadsAndAppts()/reloadReferralLeads().
  referralLeads: [],
  tickets: [],
  chatChannels: [],
  activeChannelId: null,
  chatMessages: [],
  chatSearch: '',
  // Classement hebdomadaire (RDV pris / deals fermes), reinitialise automatiquement chaque
  // lundi — voir GET /leaderboard et computeLeaderboard() cote backend.
  leaderboard: { setters: [], closers: [] },
  showLeaderboard: false,
  adLeads: [],
  adLeadCostRequests: [],
  leadsView: 'kanban', // 'kanban' | 'list' — vue pipeline (style LeadConnector) vs liste plate
  calYear: null, calMonth: null, calSelDate: null,
  leadQ: '',
  jobSt: {},
  // Master database (owner) — chaque client jamais entre dans l'entreprise, porte-a-porte
  // et leads marketing confondus. Voir GET /database.
  masterDb: [],
  dbQuery: '',
  dbSort: 'createdAt',
  dbSortDir: 'desc',
  dbFilters: { crmType:'', status:'', source:'', closer:'', tech:'', city:'', postal:'',
    createdFrom:'', createdTo:'', apptFrom:'', apptTo:'', installFrom:'', installTo:'',
    saleMin:'', saleMax:'', costMin:'', costMax:'' },
  // Base de donnees du Leads CRM (marketing) — meme format que masterDb mais scopee aux leads
  // marketing uniquement (voir GET /leads-crm/database). Filtres separes de dbFilters pour ne
  // pas melanger l'etat de la vue owner et celle du marketing.
  leadsDb: [],
  leadsDbQuery: '',
  leadsDbFilters: { status:'', source:'', closer:'', tech:'', city:'', postal:'',
    createdFrom:'', createdTo:'', apptFrom:'', apptTo:'',
    saleMin:'', saleMax:'', costMin:'', costMax:'' },
  // Commission Ledger (owner) — recherche + filtres (role/personne/periode), voir
  // buildOwnerCommissionsPage/getFilteredCommissions. Filtres cote client uniquement, toutes les
  // commissions sont deja chargees via GET /commissions.
  commQuery: '',
  commFilters: { role:'', person:'', period:'all' },
  pollTime: null,   // ISO timestamp of last poll
  pollInterval: null, // setInterval handle
  // Dashboard du Team Leader Vente (voir computeTeamLeaderStats()) — periode consultee.
  // tlMode: 'week' | 'year'. tlWeekAnchor: ISO string d'un jour quelconque dans la semaine
  // consultee (null = semaine courante). tlYear: annee consultee (null = annee courante).
  tlMode: 'week',
  tlWeekAnchor: null,
  tlYear: null,
};

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
var MNAMES = ['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];
var DNAMES = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var ROLE_LABELS = {owner:'Owner',setter:'Setter',closer:'Closer',manager:'Manager',tech:'Technicien',lead_marketing:'Marketing',lead_closer:'Lead Closer',team_leader_vente:'Team Leader Vente'};

// Icones de la nav du bas — lignes fines (style Feather/Lucide), stroke="currentColor" pour
// suivre automatiquement la couleur du bouton (blanc au repos, rouge #FF4D4D actif/hover).
// Remplace les anciens emojis (rendus differemment selon l'OS/le navigateur) par un set visuel
// coherent et sobre.
var NAV_SVG_ATTRS = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
var NAV_ICONS = {
  home:     '<path d="M3 9.5 12 3l9 6.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  list:     '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 10.5h6M9 14.5h6M9 18.5h3"/>',
  cash:     '<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/><path d="M9.6 9.4a2 2 0 0 1 2-1.7h1a2 2 0 1 1 0 4h-1a2 2 0 1 0 0 4h1a2 2 0 0 0 2-1.7"/>',
  users:    '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 8.2a3 3 0 1 1 1 5.8"/><path d="M21 20c0-2.6-1.8-4.6-4-5.3"/>',
  chat:     '<path d="M4 4h16v11H8l-4 4V4Z"/>',
  plus:     '<path d="M12 5v14M5 12h14"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
  wrench:   '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 18l3 3 6.6-6.3a4 4 0 0 0 5.1-5.4l-2.8 2.8-2.6-.6-.6-2.6Z"/>',
  worker:   '<path d="M4 18a8 8 0 0 1 16 0"/><path d="M2 18h20"/><path d="M12 4v3"/>',
  eye:      '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  database: '<ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5V18c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8V5.5"/><path d="M4 12c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8"/>',
  chart:    '<path d="M4 20V12M9.5 20V6M15 20v-9M20.5 20V9"/><path d="M2 20h20"/>',
};
function navIconSvg(key){
  return '<svg '+NAV_SVG_ATTRS+'>'+(NAV_ICONS[key]||NAV_ICONS.list)+'</svg>';
}
var ROLE_BC = {owner:'bowner',setter:'bsetter',closer:'bcloser',manager:'bmanager',tech:'btech',pending:'bwait',lead_marketing:'bmanager',lead_closer:'bcloser',team_leader_vente:'btl'};
var D2D_ROLES = ['owner','setter','closer','manager','tech','team_leader_vente'];
var LEADS_CRM_ROLES = ['owner','lead_marketing','lead_closer'];
function roleCrmMode(role){ return LEADS_CRM_ROLES.indexOf(role)>-1 && D2D_ROLES.indexOf(role)===-1 ? 'leads' : (role==='owner'?'either':'d2d'); }
// Famille CRM d'un role assignable (jamais 'owner' ici — utilise seulement pour les menus
// "Role" / "Autre acces CRM" de l'Equipe, qui n'offrent que les 6 roles non-owner).
function roleFamily(r){ return (r==='lead_marketing'||r==='lead_closer') ? 'leads' : 'd2d'; }
var ASSIGNABLE_ROLES = ['setter','closer','manager','tech','lead_marketing','lead_closer','team_leader_vente'];
// Confirmed est bleu (#5599DD, meme teinte que Rescheduled/Contacted/Assigned) — demande
// utilisateur pour distinguer visuellement "confirme" de "Closed Won" (vert), qui partageaient
// auparavant la meme couleur.
var STATUS_COL = {Scheduled:'#CCAA00','Closed Won':'#44AA44','Closed Lost':'#CC3333','No Answer':'#AA66FF','Not Home':'#FF8844',Callback:'#0E7490',Rescheduled:'#5599DD',Completed:'#44AA44',Cancelled:'#CC3333',Confirmed:'#5599DD',New:'#44AA44',Contacted:'#5599DD','Appointment Set':'#44AA44','No Show':'#FF8844',Assigned:'#5599DD','In Progress':'#AA66FF','Left Quote':'#FF9900','Not Qualified':'#777777'};

// Formatte une heure de RDV — accepte les heures pleines (14 -> "2pm", comme avant) ET les
// demi-heures (14.5 -> "2:30pm") pour les creneaux aux 30 minutes (setters porte-a-porte +
// Leads CRM, voir LEAD_APPT_HOURS).
function fh(h){
  var wholeH = Math.floor(h);
  var mins = Math.round((h - wholeH) * 60);
  var p = wholeH>=12?'pm':'am', hh = wholeH>12?wholeH-12:(wholeH===0?12:wholeH);
  return mins ? hh+':'+String(mins).padStart(2,'0')+p : hh+p;
}
function ini(u){ return ((u.first_name||u.firstName||'?')[0]+(u.last_name||u.lastName||'?')[0]).toUpperCase(); }
function roleBdg(r){ return '<span class="badge '+(ROLE_BC[r]||'bwait')+'">'+(ROLE_LABELS[r]||r)+'</span>'; }
function bdg(s){
  // Confirmed -> bn2 (bleu), aligne sur STATUS_COL ci-dessus — distinct du vert "Closed Won".
  var map={Scheduled:'bs','Closed Won':'bw','Closed Lost':'bl','No Answer':'bna','Not Home':'bpend',Callback:'bcb',Rescheduled:'bn2',Completed:'bw',New:'bn2',Assigned:'ba','En Route':'bna','In Progress':'bn2',Pending:'bpend',Installed:'bw',Cancelled:'bl',Confirmed:'bn2',Contacted:'bn2','Appointment Set':'bw','No Show':'bpend','Left Quote':'bpend',
    'Nouveau':'bn2','Assigné':'ba','Booké':'bw','Ferme':'bw','Perdu':'bl'};
  return '<span class="badge '+(map[s]||'bs')+'">'+s+'</span>';
}
// Numero de telephone client cliquable (tel:) — declenche le composeur/dialer par defaut de
// l'appareil au clic. htmlEsc() applique a l'affichage (le numero brut ne sert qu'au href, filtre
// aux chiffres/+ pour rester un tel: valide meme si le champ contient des espaces/tirets/parentheses).
// Le hover (voir .tel-link en CSS) + l'attribut title indiquent clairement "cliquer pour appeler".
// stopPropagation en onclick : ce lien apparait souvent A L'INTERIEUR d'une ligne/carte cliquable
// (ouvre la fiche du lead) — sans ca, cliquer le numero ouvrirait AUSSI la fiche par-dessus l'appel.
function phoneLinkHtml(phone){
  if(!phone) return '';
  var digits = String(phone).replace(/[^0-9+]/g,'');
  if(!digits) return htmlEsc(phone);
  return '<a href="tel:'+digits+'" class="tel-link" title="Cliquer pour appeler" onclick="event.stopPropagation()">'+htmlEsc(phone)+'</a>';
}
// Petit badge d'origine (porte-a-porte vs lead marketing) affiche sur les tickets d'installation
// dans la queue du manager et le calendrier du technicien — le pipeline d'installation lui-meme
// est deja unifie (voir GET /database et createTicketFromDeal), ceci ne fait qu'indiquer la
// provenance du client.
function originDot(origin){
  if(!origin) return '';
  var label = origin==='marketing' ? 'Marketing' : (origin==='after_sales' ? 'Après-vente' : 'D2D');
  var col = origin==='marketing' ? '#FFAA44' : (origin==='after_sales' ? '#DE1212' : '#5599DD');
  return '<span style="font-size:9px;font-weight:700;color:'+col+';border:1px solid '+col+';border-radius:99px;padding:2px 7px;white-space:nowrap">'+label+'</span>';
}
function logo(){ return '<svg viewBox="0 0 90 18" height="13"><text x="0" y="13" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="var(--text)">PROTEK</text></svg>'; }
function empty(m){ return '<div class="empty">'+m+'</div>'; }
function card(title,body,extra){ return '<div class="card"><div class="chdr"><span>'+title+'</span>'+(extra||'')+'</div>'+body+'</div>'; }
function stats(items){
  var h='<div class="stats">';
  items.forEach(function(it){ h+='<div class="stat"><div class="sl">'+it[0]+'</div><div class="sv" style="color:'+(it[2]||'#EEE')+'">'+it[1]+'</div><div class="ss">'+(it[3]||'')+'</div></div>'; });
  return h+'</div>';
}
function revBars(items){ return items.map(function(x){ return '<div class="revitem"><div class="revtop"><span style="color:var(--text)">'+x[0]+'</span><span style="color:#DE1212;font-weight:700">'+x[1]+'</span></div><div class="revtrack"><div class="revfill" style="width:'+x[2]+'%"></div></div></div>'; }).join(''); }
function ir(l,v){ return '<div class="ir"><div class="ilbl">'+l+'</div><div class="ival">'+v+'</div></div>'; }
function todayStr(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }

// Debounce — utilise pour les champs de recherche (db-search, lead-search, chat-search) : sans
// ca, chaque frappe declenche un render() complet (regeneration de tout le HTML de la page +
// reattachement de tous les event listeners), ce qui rend la saisie visiblement saccadee des
// qu'il y a plus qu'une poignee de lignes a l'ecran. On attend une courte pause dans la frappe
// avant de re-rendre.
var _debounceTimers = {};
function debounce(key, fn, delay){
  clearTimeout(_debounceTimers[key]);
  _debounceTimers[key] = setTimeout(fn, delay || 200);
}
// Demandes de prix (cost_request) que l'owner a rouvertes pour modification apres soumission —
// simple etat d'UI local (pas persiste), remis a false des qu'un nouveau prix est confirme.
var EDITING_COST = {};

// Vue (texte brut vs liste a cocher) choisie manuellement par l'utilisateur pour un message chat
// multi-lignes donne — surcharge la detection automatique (isStreetListBody). Etat local a la
// session (pas persiste), un rechargement revient a la detection auto. Cle = id du message.
var CHAT_VIEW_MODE = {};

// Detecte un message chat qui ressemble a une liste de rues collee (ex. depuis Discord) plutot
// qu'un message normal sur plusieurs lignes — demande utilisateur : "liste de rues" postee dans
// le chat s'affichait en un gros bloc compact, difficile a suivre/cocher sur le terrain. Heuristique
// volontairement simple (>=3 lignes courtes, peu de ponctuation de fin de phrase) — imparfaite par
// nature, donc TOUJOURS doublee d'un bouton de bascule manuel (voir chatMessageHtml) pour que
// l'utilisateur corrige si la detection se trompe dans un sens ou l'autre.
function isStreetListBody(body){
  if(!body) return false;
  var lines = String(body).split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  if(lines.length<3) return false;
  var sentenceLike = lines.filter(function(l){ return l.length>70 || /[.!?]\s*$/.test(l); });
  return sentenceLike.length <= Math.ceil(lines.length*0.3);
}
// Cases cochees pour les listes de rues, cote client uniquement (localStorage) — c'est un aide-
// memoire personnel de progression sur le terrain pour celui qui coche (quelle rue deja couverte),
// pas une donnee d'equipe a synchroniser ; volontairement pas de colonne backend pour ca (aucun
// risque sur les donnees existantes du chat).
function getStreetChecks(msgId){
  try{ return (JSON.parse(localStorage.getItem('protek_street_checks')||'{}'))[msgId] || {}; }
  catch(e){ return {}; }
}
function setStreetCheck(msgId, lineIdx, checked){
  try{
    var all = JSON.parse(localStorage.getItem('protek_street_checks')||'{}');
    if(!all[msgId]) all[msgId] = {};
    if(checked) all[msgId][lineIdx] = true; else delete all[msgId][lineIdx];
    localStorage.setItem('protek_street_checks', JSON.stringify(all));
  } catch(e){ /* stockage indisponible — la case reste visuellement cochee pour la session en cours */ }
}
function streetChecklistBubbleHtml(m, lines, mine){
  var checks = getStreetChecks(m.id);
  var done = lines.filter(function(l,i){ return !!checks[i]; }).length;
  var rows = lines.map(function(line, i){
    var checked = !!checks[i];
    return '<label style="display:flex;align-items:center;gap:8px;padding:3px 1px;cursor:pointer">'
      +'<input type="checkbox" data-street-check="'+m.id+':'+i+'" '+(checked?'checked':'')+' style="width:16px;height:16px;flex-shrink:0;accent-color:#DE1212;margin:0">'
      +'<span style="font-size:13px;line-height:1.35'+(checked?';text-decoration:line-through;opacity:.55':'')+'">'+htmlEsc(line)+'</span>'
      +'</label>';
  }).join('');
  return '<div data-street-bubble="'+m.id+'" style="background:'+(mine?'var(--red)':'var(--surface-3)')+';color:'+(mine?'#FFF':'var(--text)')+';border-radius:12px;padding:9px 12px;min-width:200px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;gap:8px">'
      +'<div style="font-size:10px;font-weight:800;letter-spacing:.5px;opacity:.85">📋 LISTE DE RUES · <span data-street-count>'+done+'/'+lines.length+'</span></div>'
      +'<button type="button" data-street-view-toggle="'+m.id+'" style="background:transparent;border:none;color:inherit;opacity:.75;font-size:10px;text-decoration:underline;cursor:pointer;padding:0;flex-shrink:0">texte</button>'
    +'</div>'
    +rows
    +'</div>';
}

// ═══════════════════════════════════════════
// RENDER ENGINE — single place, no inline onclick strings
// ═══════════════════════════════════════════
// render() rebuilds #main from scratch on every state change (no virtual-DOM diffing in this
// app), which means a focused <input> (e.g. a search box) gets destroyed and recreated on every
// keystroke unless we explicitly save/restore focus + cursor position around it — otherwise
// typing feels laggy/unresponsive because the caret and focus jump around on every character.
function render(){
  var active = document.activeElement;
  var focusedId = active && active.id;
  var selStart, selEnd;
  if(focusedId && typeof active.selectionStart === 'number'){
    selStart = active.selectionStart; selEnd = active.selectionEnd;
  }
  renderInner();
  if(focusedId){
    var el = document.getElementById(focusedId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart != null && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// ═══════════════════════════════════════════
// EVENT ATTACHMENT — centralized, no inline onclick
// ═══════════════════════════════════════════
// bnav/overlay/sh-close/profile-btn font partie du "shell" HTML statique (voir <body> plus haut) —
// contrairement a #main/#banner dont l'innerHTML est entierement remplace a chaque render(), ces
// 4 elements ne sont JAMAIS recrees : ils existent une seule fois pour toute la duree de vie de la
// page. Bug corrige ici : leurs listeners etaient (re)attaches a l'INTERIEUR de attachEvents(),
// qui tourne a CHAQUE render() (chaque poll de 15s + apres presque chaque action). Comme un
// addEventListener sur un element deja porteur d'un listener identique s'EMPILE plutot que de le
// remplacer, une session de plusieurs heures accumulait des centaines/milliers de handlers
// identiques sur ces memes 4 elements. Resultat : un simple clic sur la barre de nav, le bouton
// profil, ou pour fermer une fiche redeclenchait TOUS ces handlers d'un coup (multiplie par le
// nombre de renders ecoules) — d'ou le ralentissement progressif puis le gel complet apres usage
// prolonge. Fix : attacher ces 4 listeners UNE SEULE FOIS via bindStaticShellEvents(), appelee au
// demarrage de l'app (voir IIFE init() plus bas), et ne plus jamais les re-attacher dans
// attachEvents().
var _staticShellEventsBound = false;
function bindStaticShellEvents(){
  if(_staticShellEventsBound) return;
  _staticShellEventsBound = true;

  document.getElementById('bnav').addEventListener('click', function(e){
    var btn = e.target.closest('[data-nav]');
    if(!btn) return;
    var p = btn.dataset.nav;
    var r = btn.dataset.role;
    closeDrawer();
    if(p==='newlead'){ openNewLeadSheet(); return; }
    if(p==='newadlead'){ openNewAdLeadSheet(); return; }
    S.page[r] = p;
    if((r==='owner' && (p==='users'||p==='team')) || (r==='team_leader_vente' && p==='team')){ loadUsers().then(render); } else { render(); }
  });
  // Hamburger drawer (nav menu), style protek-admin.netlify.app — reuses the exact same #bnav
  // element/listener above (just toggled between hidden and slid-in via .open), so page-switching
  // logic is untouched, only presentation changed.
  document.getElementById('hamburger-btn').addEventListener('click', openDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('drawer-scrim').addEventListener('click', closeDrawer);
  document.body.addEventListener('click', function(e){
    if(e.target && e.target.closest('#drawer-logout')) doLogout();
  });
  document.getElementById('profile-btn').addEventListener('click', function(){ openProfileSheet(); });
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) closeSheet(); });
  document.getElementById('sh-close').addEventListener('click', closeSheet);
}

function attachEvents(role, page){
  var main = document.getElementById('main');

  // Stop impersonate — #stop-imp est recree a chaque render() (banner.innerHTML est remplace),
  // donc contrairement aux 4 elements ci-dessus, reattacher son listener ici a chaque fois est
  // correct : c'est un NOUVEL element a chaque appel, pas le meme element reutilise.
  var stopBtn = document.getElementById('stop-imp');
  // S.user.role (pas le parametre "role" de attachEvents, qui pendant l'impersonation vaut le
  // role du compte VU, ex 'setter') — genereique pour tout role pouvant impersonner (owner ET
  // team_leader_vente), revient sur la page "Vue de" du VRAI compte connecte.
  if(stopBtn) stopBtn.addEventListener('click', async function(){
    S.impersonate=null; S.page[S.user.role]='team';
    render();
    await Promise.all([loadUsers(), loadLeadsAndAppts()]);
    render();
  });

  // Role-specific events
  if((role==='owner'||role==='manager') && page==='aftersales'){
    attachAfterSalesEvents(main);
  } else if(role==='owner' && S.crmMode==='leads'){
    // "Vue de" (impersonation) reutilise attachOwnerEvents('team', main) du CRM porte-a-porte —
    // c'est la ou vit le listener [data-imp-id] (voir buildOwnerTeamOrView), deja CRM-agnostique.
    if(page==='database') attachLeadsCrmDatabaseEvents(main);
    else if(page==='team') attachOwnerEvents('team', main);
    else attachLeadsCrmOwnerEvents(page, main);
  } else if(role==='owner'){
    // "Queue" (leads) fusionnee dans le CRM unique de l'owner — memes handlers que le Leads CRM
    // (kanban/liste, ouverture de fiche), voir renderInner() ci-dessus.
    if(page==='queue') attachLeadsCrmOwnerEvents('queue', main);
    else if(page==='soumissioncalfeutrage') attachSoumissionCalfeutrageEvents(main);
    else attachOwnerEvents(page, main);
  } else if(role==='setter'){
    attachSetterEvents(page, main);
  } else if(role==='closer'){
    attachCloserEvents(page, main);
  } else if(role==='manager'){
    attachManagerEvents(page, main);
  } else if(role==='tech'){
    attachTechEvents(page, main);
  } else if(role==='lead_marketing'){
    if(page==='database') attachLeadsCrmDatabaseEvents(main); else attachLeadCloserEvents(page, main);
  } else if(role==='lead_closer'){
    attachLeadCloserEvents(page, main);
  } else if(role==='team_leader_vente'){
    // "Vue de" reutilise le meme listener [data-imp-id] que l'owner (attachOwnerEvents('team',
    // main) est deja CRM/role-agnostique — voir buildOwnerTeamOrView). Le dashboard a ses
    // propres controles de filtre (semaine/annee), voir attachTeamLeaderEvents().
    if(page==='team') attachOwnerEvents('team', main);
    else attachTeamLeaderEvents(page, main);
  }
  if(page==='referencement' && (role==='owner'||role==='team_leader_vente'||role==='closer')){
    attachReferencementEvents(main);
  }
  if(page==='chat' && (role==='owner'||role==='setter'||role==='closer'||role==='team_leader_vente')){
    attachChatEvents(main);
  }

  // FAB
  var fab = main.querySelector('.fab');
  if(fab) fab.addEventListener('click', function(){ openNewLeadSheet(); });
}

async function doResetPassword(){
  var pass = document.getElementById('rp-pass').value||'';
  var pass2 = document.getElementById('rp-pass2').value||'';
  if(!pass || pass.length<8){ showAuthErr('Le mot de passe doit contenir au moins 8 caractères.'); return; }
  if(pass!==pass2){ showAuthErr('Les mots de passe ne correspondent pas.'); return; }
  if(!S.resetToken){ showAuthErr('Lien invalide. Redemandez un lien de réinitialisation.'); return; }
  var btn = document.getElementById('rp-btn');
  btn.textContent='...'; btn.disabled=true;
  try{
    await apiFetch('POST','/auth/reset-password',{token:S.resetToken, password:pass});
    toast('Mot de passe réinitialisé — connectez-vous.');
    S.resetToken=null;
    S.view='login';
    render();
  }catch(e){
    showAuthErr(e.message||'Ce lien est invalide ou a expiré.');
    btn.textContent='Réinitialiser le mot de passe'; btn.disabled=false;
  }
}

// AUTH ACTIONS
// ═══════════════════════════════════════════
async function doLogin(){
  var email = (document.getElementById('li-email').value||'').trim();
  var pass = document.getElementById('li-pass').value||'';
  var errEl = document.getElementById('auth-err');
  if(!email||!pass){ showAuthErr('Entrez votre email et mot de passe.'); return; }
  var btn = document.getElementById('li-btn');
  btn.textContent='...'; btn.disabled=true;
  try {
    var data = await apiFetch('POST','/auth/login',{email:email,password:pass});
    TOKEN = data.token;
    localStorage.setItem('protek_token', TOKEN);
    // Fetch fresh user data to ensure role/status is up to date
    var freshUser = await apiFetch('GET', '/auth/me');
    // Mini-app Soumission Calfeutrage (voir IS_SC_APP) : reservee a owner, meme regle que le
    // backend (requireOwner sur /soumission-calfeutrage/*) — juste applique ici en plus, cote UX,
    // pour ne pas laisser un autre role se connecter dans une app qui ne leur montrera de toute
    // facon jamais rien (403 partout) sans message clair.
    if(IS_SC_APP && freshUser.role!=='owner'){
      TOKEN=null; localStorage.removeItem('protek_token');
      showAuthErr('Cette application est réservée aux administrateurs.');
      btn.textContent='Se connecter'; btn.disabled=false;
      return;
    }
    var mode = roleCrmMode(freshUser.role);
    // CRM unique + login direct pour tout le monde — demande utilisateur 2026-09-28 "je veux que
    // pour tout le monde ca soit le login direct" : l'ecran "Choisir un CRM" ne s'affiche plus
    // JAMAIS par defaut (voir init(), S.view demarre sur 'login'), donc on ne peut plus se fier a
    // un "CRM choisi avant connexion" pour verifier une correspondance — on fait simplement
    // confiance au role REEL du compte, retourne par le serveur apres authentification. Aucun
    // rejet possible dans le flux normal.
    //
    // Le seul cas ou on verifie encore/propose le swap de double-role (S.crmChoiceExplicit) est
    // quand l'utilisateur a lui-meme demande "Changer de CRM" puis choisi explicitement DOOR ou
    // LEADS (voir renderCrmChoice()) — ca reste le seul moyen pour un compte a double role
    // (secondaryRole, ex: "Autre acces CRM" assigne par l'owner) de basculer vers son AUTRE role,
    // fonctionnalite entierement conservee, juste plus jamais imposee par defaut.
    if(freshUser.role==='owner'){
      S.crmMode = 'd2d';
    } else if(S.crmChoiceExplicit && freshUser.status==='active' && mode!=='either' && mode!==S.crmMode){
      // Le role ACTIF ne correspond pas au CRM explicitement choisi — mais si l'owner lui a aussi
      // assigne un acces "en reserve" dans l'autre CRM (voir Equipe > Actifs > "Autre acces CRM"),
      // on bascule automatiquement dessus au lieu de rejeter : cote serveur ca echange role_id <->
      // secondary_role_id (POST /auth/swap-crm-role), donc ce role devient actif partout
      // immediatement, sans creer de deuxieme compte/session.
      var secMode = freshUser.secondaryRole ? roleCrmMode(freshUser.secondaryRole) : null;
      if(secMode === S.crmMode){
        try{
          await apiFetch('POST','/auth/swap-crm-role',{});
          freshUser = await apiFetch('GET','/auth/me');
          mode = roleCrmMode(freshUser.role);
        }catch(e){
          TOKEN=null; localStorage.removeItem('protek_token');
          showAuthErr('Erreur lors du changement de CRM: '+(e.message||''));
          btn.textContent='Se connecter'; btn.disabled=false;
          return;
        }
      } else {
        TOKEN=null; localStorage.removeItem('protek_token');
        showAuthErr('Ce compte n\'a pas acces a ce CRM.');
        btn.textContent='Se connecter'; btn.disabled=false;
        return;
      }
      S.crmMode = mode;
    } else {
      // Flux normal (aucun choix explicite) : le mode CRM est toujours derive du role reel,
      // jamais du bouton pre-selectionne — evite tout faux rejet pour un compte leads-only sur un
      // appareil qui n'avait jamais servi (plus d'ecran de choix pour se tromper de bouton).
      S.crmMode = mode==='either' ? 'd2d' : mode;
    }
    S.crmChoiceExplicit = false;
    S.user = freshUser;
    localStorage.setItem('protek_user', JSON.stringify(freshUser));
    localStorage.setItem('protek_crm_mode', S.crmMode);
    // Memorise la famille CRM de ce compte sur cet appareil, pour que le prochain chargement (voir
    // init()) affiche directement l'ecran de connexion avec la bonne branding par defaut — purement
    // cosmetique desormais (n'affecte plus l'acces), la connexion reussit toujours peu importe.
    localStorage.setItem('protek_last_crm_family', S.crmMode);
    S.view = 'app';
    loadSavedData();
    await Promise.all([loadLeadsAndAppts(), loadUsers()]); // independants -> en parallele
    startPolling();
    ensurePushSubscription(); // voir commentaire sur ensurePushSubscription — resync silencieux, jamais bloquant
    render();
  } catch(e) {
    if(e.data && e.data.error==='pending'){
      S.user = {firstName:'',email:email,status:'pending'};
      S.view = 'pending';
      render();
    } else {
      showAuthErr(e.message||'Email ou mot de passe invalide.');
      btn.textContent='Se connecter'; btn.disabled=false;
    }
  }
}

async function doRegister(){
  var first = (document.getElementById('r-first').value||'').trim();
  var last = (document.getElementById('r-last').value||'').trim();
  var email = (document.getElementById('r-email').value||'').trim();

// Tous les fetches independants partent EN PARALLELE (Promise.all) au lieu de s'attendre les
// uns les autres — sur un backend distant (Railway), chaque aller-retour coute facilement
// 100-300ms ; les enchainer sequentiellement pouvait faire trainer un login/refresh sur 2-3s.
// On saute aussi les appels que le role courant ne peut de toute facon pas utiliser (403 cote
// serveur), pour ne pas gaspiller une requete et un round-trip pour rien.
async function loadLeadsAndAppts(){
  var role = (S.impersonate||S.user||{}).role;
  var isD2D = D2D_ROLES.indexOf(role)>-1;
  var tasks = [];

  if(isD2D){
    tasks.push(apiFetch('GET','/leads').then(function(d){ S.leads=d; markSyncOk('leads'); }).catch(function(e){ markSyncFail('leads', e); }));
    tasks.push(apiFetch('GET','/appointments').then(function(d){ S.appts=d; markSyncOk('appts'); }).catch(function(e){ markSyncFail('appts', e); }));
    tasks.push(apiFetch('GET','/assignments').then(function(d){ S.assignments=d; }).catch(function(){ /* keep local */ }));
    // /tickets est restreint cote serveur a owner/manager/tech (voir requireTicketAccess) — mais
    // D2D_ROLES inclut aussi setter/closer/team_leader_vente (qui ONT besoin des autres appels
    // isD2D ci-dessus : leads, appointments, assignments, closer-blackouts). Avant ce fix, CES
    // roles recevaient un 403 PERMANENT sur /tickets a CHAQUE chargement (jamais transitoire,
    // "Reessayer" ne resout jamais rien) -> markSyncFail('tickets') restait bloque pour toujours
    // -> bandeau "donnees non synchronisees" affiche en PERMANENCE pour tout setter/closer/team
    // leader vente, meme avec une connexion parfaite. On ne fetch /tickets ici que pour les roles
    // qui y ont reellement acces.
    if(role==='owner'||role==='manager'||role==='tech'){
      tasks.push(apiFetch('GET','/tickets').then(function(d){ S.tickets=d; markSyncOk('tickets'); }).catch(function(e){ markSyncFail('tickets', e); }));
    } else {
      S.tickets=[];
    }
    // Blocages d'horaire closer (vacances, sport...) — voir demande utilisateur, POST/GET/DELETE
    // /closer-blackouts. Charges pour tous les roles porte-a-porte : les setters en ont besoin
    // pour ne pas booker dans un creneau bloque (voir openNewLeadSheet).
    tasks.push(apiFetch('GET','/closer-blackouts').then(function(d){ S.closerBlackouts=d; markSyncOk('closerBlackouts'); }).catch(function(e){ markSyncFail('closerBlackouts', e); }));
  } else {
    S.leads=[]; S.appts=[]; S.tickets=[]; S.closerBlackouts=[];
  }
  // Référencement — owner/team_leader_vente/closer uniquement (403 cote serveur pour tout autre
  // role). Filtrage par closer deja fait cote serveur (voir GET /referencement/leads).
  if(role==='owner'||role==='team_leader_vente'||role==='closer'){
    tasks.push(apiFetch('GET','/referencement/leads').then(function(d){ S.referralLeads=d; markSyncOk('referralLeads'); }).catch(function(e){ markSyncFail('referralLeads', e); }));
  } else {
    S.referralLeads=[];
  }
  // Commissions — setter/closer/team_leader_vente voient les leurs, l'owner voit tout (voir
  // demande utilisateur, GET /commissions/mine et /commissions).
  if(role==='setter'||role==='closer'||role==='team_leader_vente'){
    tasks.push(apiFetch('GET','/commissions/mine').then(function(d){ S.myCommissions=d; markSyncOk('myCommissions'); }).catch(function(e){ markSyncFail('myCommissions', e); }));
  } else {
    S.myCommissions=[];
  }
  if(role==='owner'){
    tasks.push(apiFetch('GET','/commissions').then(function(d){ S.allCommissions=d; markSyncOk('allCommissions'); }).catch(function(e){ markSyncFail('allCommissions', e); }));
  } else {
    S.allCommissions=[];
  }
  // Les deals servent au CRM porte-a-porte ET au lead closer (formulaire de deal identique) —
  // le marketing n'en a pas besoin.
  if(isD2D || role==='lead_closer'){
    tasks.push(apiFetch('GET','/deals').then(function(d){ S.deals=d; markSyncOk('deals'); }).catch(function(e){ markSyncFail('deals', e); }));
  } else {
    S.deals=[];
  }
  tasks.push(loadChatMessages());
  tasks.push(loadLeadsCrmData());
  // Base de donnees porte-a-porte — owner uniquement (403 cote serveur pour tout autre role).
  // Scopee au porte-a-porte (voir GET /database/d2d) : le marketing n'y apparait jamais, meme
  // pour l'owner — chaque CRM garde sa propre Base, jamais un melange des deux.
  if(role==='owner'){
    tasks.push(apiFetch('GET','/database/d2d').then(function(d){ S.masterDb=d; markSyncOk('masterDb'); }).catch(function(e){ markSyncFail('masterDb', e); }));
  } else {
    S.masterDb=[];
  }
  // Base de donnees du Leads CRM — marketing uniquement, memes champs que masterDb mais filtree
  // aux leads marketing (voir GET /leads-crm/database) : le porte-a-porte n'y apparait jamais.
  // Utilisee par le role marketing ET par l'owner quand il est dans le CRM Leads.
  if(role==='lead_marketing'||role==='owner'){
    tasks.push(apiFetch('GET','/leads-crm/database').then(function(d){ S.leadsDb=d; markSyncOk('leadsDb'); }).catch(function(e){ markSyncFail('leadsDb', e); }));
  } else {
    S.leadsDb=[];
  }
  // Après-vente — owner ET gerant des installations (manager), voir requireManagerOrOwner cote
  // serveur sur GET /after-sales. Tout autre role recoit un 403 de toute facon.
  if(role==='owner'||role==='manager'){
    tasks.push(apiFetch('GET','/after-sales').then(function(d){ S.afterSales=d; markSyncOk('afterSales'); }).catch(function(e){ markSyncFail('afterSales', e); }));
  } else {
    S.afterSales=[];
  }
  // Soumission Calfeutrage — owner uniquement (voir requireOwner cote serveur sur
  // GET /soumission-calfeutrage), jamais manager/team_leader_vente/closer/setter.
  if(role==='owner'){
    tasks.push(apiFetch('GET','/soumission-calfeutrage').then(function(d){ S.soumissionLeads=d; markSyncOk('soumissionLeads'); }).catch(function(e){ markSyncFail('soumissionLeads', e); }));
  } else {
    S.soumissionLeads=[];
  }

  await Promise.all(tasks);
  S.pollTime = new Date().toISOString();
}

// ═══════════════════════════════════════════
// REVENU OWNER — calcule reellement a partir de S.deals (charge pour tout role D2D, voir
// loadInitialData), au lieu des $0/0 fixes d'avant (voir audit securite 2026-09-05 : "dashboard
// owner financierement faux"). Reutilise EXACTEMENT les memes bornes America/Toronto que les
// commissions (commissionPeriodBounds/commissionCreatedAt, definies plus bas — hoisting des
// function declarations, l'ordre dans le fichier n'a pas d'importance) pour rester coherent avec
// le reste du dashboard plutot que d'inventer un 2e systeme de dates.
// ═══════════════════════════════════════════
function dealCreatedAt(d){ return new Date((d.created_at||'').replace(' ','T')+'Z'); }
function computeOwnerRevenueStats(period){
  var bounds = commissionPeriodBounds(period);
  var deals = (S.deals||[]).filter(function(d){
    if(!bounds) return true;
    var dt = dealCreatedAt(d);
    return dt>=bounds.start && dt<bounds.end;
  });
  var revenue = deals.reduce(function(s,d){ return s+(parseFloat(d.price)||0); },0);
  var byCloser = {}, bySetter = {};
  deals.forEach(function(d){
    if(d.closer_id){
      if(!byCloser[d.closer_id]) byCloser[d.closer_id]={name:d.closer_name||'?', revenue:0, deals:0};
      byCloser[d.closer_id].revenue += parseFloat(d.price)||0;
      byCloser[d.closer_id].deals += 1;
    }
    if(d.setter_id){
      if(!bySetter[d.setter_id]) bySetter[d.setter_id]={name:d.setter_name||'?', revenue:0, deals:0};
      bySetter[d.setter_id].revenue += parseFloat(d.price)||0;
      bySetter[d.setter_id].deals += 1;
    }
  });
  var sortDesc=function(a,b){ return b.revenue-a.revenue; };
  return {
    deals: deals.length,
    revenue: revenue,
    byCloser: Object.keys(byCloser).map(function(k){ return byCloser[k]; }).sort(sortDesc),
    bySetter: Object.keys(bySetter).map(function(k){ return bySetter[k]; }).sort(sortDesc),
  };
}
function revenueBreakdownHtml(list){
  if(!list.length) return '<div style="padding:12px">'+empty('Pas de donnees')+'</div>';
  return list.map(function(r){
    return '<div class="row"><div class="rav">'+htmlEsc((r.name||'?').trim().charAt(0).toUpperCase()||'?')+'</div>'
      +'<div class="rmain"><div class="rn">'+htmlEsc(r.name||'?')+'</div><div class="rs">'+r.deals+' deal'+(r.deals>1?'s':'')+'</div></div>'
      +'<div style="font-weight:700;font-size:13px;color:var(--text)">$'+r.revenue.toFixed(0)+'</div></div>';
  }).join('');
}

function buildOwnerPage(pg){
  if(pg==='overview'){
    var pc = S.users.filter(function(u){ return u.status==='pending'; }).length;
    var ac = S.users.filter(function(u){ return u.status==='active'&&u.role!=='owner'; }).length;
    var rm = computeOwnerRevenueStats('month');
    var ticketsActive = (S.tickets||[]).filter(function(t){ return t.status!=='Completed'; }).length;
    var ticketsDone = (S.tickets||[]).filter(function(t){ return t.status==='Completed'; }).length;
    // L'owner doit recevoir TOUTE notification importante meme deconnecte/app fermee (nouveau
    // lead, demande de cout, RDV pris, deal ferme, changement de statut) — jusqu'ici le bandeau
    // d'activation des notifications push n'apparaissait que dans les vues Leads CRM, jamais sur
    // le dashboard D2D que l'owner voit par defaut a la connexion. Voir demande utilisateur
    // "notifications owner".
    return pushBannerHtml()
      + stats([['Revenue','$'+rm.revenue.toFixed(0),'#FF4D4D','ce mois'],['Deals',rm.deals,'#EEE','ce mois'],['Equipe active',ac,'#EEE','membres'],['En attente',pc,pc>0?'#FF4D4D':'#44AA44','approbations']])
      +'<div class="pipe"><div class="pip">Leads<strong>'+S.leads.length+'</strong></div><div class="pip">RDV<strong>'+S.appts.length+'</strong></div><div class="pip">Deals<strong>'+(S.deals||[]).length+'</strong></div><div class="pip">Install<strong>'+ticketsActive+'</strong></div><div class="pip">Done<strong>'+ticketsDone+'</strong></div></div>'
      +card('Revenu par Closer (ce mois)', revenueBreakdownHtml(rm.byCloser))
      +card('Revenu par Setter (ce mois)', revenueBreakdownHtml(rm.bySetter));
  }
  if(pg==='users'||pg==='team') return buildOwnerTeamOrView(pg);
  if(pg==='database') return buildMasterDbPage();
  if(pg==='revenue'){
    var rmM = computeOwnerRevenueStats('month'), rmY = computeOwnerRevenueStats('year');
    return stats([['Ce mois','$'+rmM.revenue.toFixed(0),'#FF4D4D',''],['Cette annee','$'+rmY.revenue.toFixed(0),'#EEE','']])
      +card('Par Closer (ce mois)', revenueBreakdownHtml(rmM.byCloser))
      +card('Par Setter (ce mois)', revenueBreakdownHtml(rmM.bySetter));
  }
  if(pg==='commissions') return buildOwnerCommissionsPage();
  return '';
}

var COMMISSION_ROLE_LABEL = {setter:'Setter', closer:'Closer'};

    : '<span class="badge" style="background:#FEF3C7;color:#B45309">À verser</span>';
}
function commissionMoney(n){
  var v=Number(n)||0;
  return (v<0?'-$':'$')+Math.abs(v).toFixed(2);
}
function buildMyCommissionsPage(){
  var rows=(S.myCommissions||[]).slice().sort(function(a,b){ return (b.created_at||'').localeCompare(a.created_at||''); });
  var pending=rows.filter(function(c){ return c.status==='pending'; }).reduce(function(s,c){ return s+(Number(c.amount)||0); },0);
  var paid=rows.filter(function(c){ return c.status==='paid'; }).reduce(function(s,c){ return s+(Number(c.amount)||0); },0);
  return stats([['À verser',commissionMoney(pending),'#B45309',''],['Versé',commissionMoney(paid),'#15803D','']])
    + card('Mes commissions', rows.length ? rows.map(function(c){

// ── Commission Ledger (owner) — filtres cote client sur S.allCommissions (deja tout charge via
// GET /commissions, voir loadInitialData/reloadCommissions). Periode alignee sur les memes bornes
// America/Toronto que le leaderboard (voir weekBoundsToronto/yearBoundsToronto plus bas dans ce
// fichier — hoisting des function declarations, l'ordre dans le fichier n'a pas d'importance).
function monthBoundsToronto(year, month){ // month: 1-12
  var start = tzWallTimeToUTCClient(year, month, 1, 0,0,0, STATS_TZ);
  var nextMonth = month===12?1:month+1, nextYear = month===12?year+1:year;
  var end = tzWallTimeToUTCClient(nextYear, nextMonth, 1, 0,0,0, STATS_TZ);
  return { start: start, end: end };
}
function commissionPeriodBounds(period){
  var now=new Date();
  if(period==='week') return weekBoundsToronto(now);
  if(period==='month'){
    var parts=new Intl.DateTimeFormat('en-CA',{timeZone:STATS_TZ,year:'numeric',month:'numeric'}).formatToParts(now).reduce(function(a,p){a[p.type]=p.value;return a;},{});
    return monthBoundsToronto(+parts.year, +parts.month);
  }
  if(period==='year') return yearBoundsToronto(now.getFullYear());
  return null; // 'all'
}
function commissionCreatedAt(c){ return new Date((c.created_at||'').replace(' ','T')+'Z'); }
function getFilteredCommissions(){
  var rows=(S.allCommissions||[]).slice();
  var f=S.commFilters||{};
  var bounds=commissionPeriodBounds(f.period||'all');
  if(bounds) rows=rows.filter(function(c){ var d=commissionCreatedAt(c); return d>=bounds.start && d<bounds.end; });
  if(f.role) rows=rows.filter(function(c){ return c.role===f.role; });
  if(f.person) rows=rows.filter(function(c){ return c.user_name===f.person; });
  var q=(S.commQuery||'').trim().toLowerCase();
  if(q) rows=rows.filter(function(c){
    return (c.client_name||'').toLowerCase().indexOf(q)!==-1 || (c.user_name||'').toLowerCase().indexOf(q)!==-1;
  });
  return rows.sort(function(a,b){ return (b.created_at||'').localeCompare(a.created_at||''); });
}
function buildCommissionTotalsByPerson(rows){
  var map={};
  rows.forEach(function(c){
    var key=(c.user_name||'?')+'|'+c.role;
    if(!map[key]) map[key]={ name:c.user_name||'?', role:c.role, deals:0, pending:0, paid:0 };
    map[key].deals++;
    if(c.status==='paid') map[key].paid += Number(c.amount)||0; else map[key].pending += Number(c.amount)||0;
  });
  return Object.keys(map).map(function(k){ var m=map[k]; m.total=m.pending+m.paid; return m; })
    .sort(function(a,b){ return b.total-a.total; });
}

function attachCommissionsEvents(main){

  if(personSel) personSel.addEventListener('change', function(){ S.commFilters.person=this.value; render(); });

}

// TEAM LEADER VENTE — dashboard de supervision porte-a-porte, sans acces Base de donnees ni
// horaire d'installation (voir role==='team_leader_vente' dans render()/attachEvents() et
// requireChatAccess/'/poll' cote serveur). Statistiques uniquement — AUCUN montant $ nulle part
// ici (voir demande utilisateur : "on exclut le revenu de ces statistiques").
//
// Definitions retenues pour les 3 compteurs (le CRM porte-a-porte n'a pas de statut "No Show"
// explicite aujourd'hui — voir STATUS_COL/fullSts plus haut, seulement Scheduled/Closed Won/
// Closed Lost/No Answer/Not Home/Callback/Rescheduled) :
//   - RDV pris    = tous les RDV crees pour ce setter dans la periode (meme volume que le
//                   leaderboard hebdomadaire existant, voir computeLeaderboard() cote backend).
//   - RDV show    = RDV ou le closer a reellement rencontre le client, deduit du statut final
//                   (Closed Won ou Closed Lost — les deux ne peuvent etre poses qu'APRES la
//                   rencontre). Exclut No Answer/Not Home/Callback/Rescheduled/Cancelled/Scheduled.
//   - RDV closing = RDV avec statut Closed Won.
// Ces definitions sont une deduction a partir des donnees existantes, pas un nouveau champ en
// base — si l'equipe veut un vrai statut "No Show" distinct plus tard, il faudra l'ajouter a
// fullSts/setterSts et refaire ce calcul dessus.
var STATS_TZ = 'America/Toronto';
var TL_SHOW_STATUSES = { 'Closed Won': 1, 'Closed Lost': 1 };

// Meme technique que tzWallTimeToUTC()/getWeekBoundsUTC() cote backend (routes/index.js) —
// reimplementee cote client (aucune dependance externe) pour que "cette semaine" / "cette annee"
// tombent exactement sur les memes bornes America/Toronto que le leaderboard, quel que soit le
// fuseau horaire du navigateur de l'utilisateur.
function tzWallTimeToUTCClient(y, m, d, h, mi, s, timeZone) {
  var guess = Date.UTC(y, m - 1, d, h, mi, s);
  for (var i = 0; i < 2; i++) {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: timeZone, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    }).formatToParts(new Date(guess)).reduce(function(a, p){ a[p.type] = p.value; return a; }, {});
    var hh = parts.hour === '24' ? 0 : parseInt(parts.hour, 10);
    var guessedLocalAsUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, hh, +parts.minute, +parts.second);
    guess += Date.UTC(y, m - 1, d, h, mi, s) - guessedLocalAsUTC;
  }
  return new Date(guess);
}
function weekBoundsToronto(anchorDate) {
  var parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: STATS_TZ, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short',
  }).formatToParts(anchorDate).reduce(function(a, p){ a[p.type] = p.value; return a; }, {});
  var WD = { Mon:0, Tue:1, Wed:2, Thu:3, Fri:4, Sat:5, Sun:6 };
  var daysSinceMonday = WD[parts.weekday] != null ? WD[parts.weekday] : 0;
  var localNoon = new Date(Date.UTC(+parts.year, +parts.month - 1, +parts.day, 12, 0, 0));
  var monday = new Date(localNoon.getTime() - daysSinceMonday * 86400000);
  var nextMonday = new Date(monday.getTime() + 7 * 86400000);
  var start = tzWallTimeToUTCClient(monday.getUTCFullYear(), monday.getUTCMonth()+1, monday.getUTCDate(), 0,0,0, STATS_TZ);
  var end = tzWallTimeToUTCClient(nextMonday.getUTCFullYear(), nextMonday.getUTCMonth()+1, nextMonday.getUTCDate(), 0,0,0, STATS_TZ);
  return { start: start, end: end };
}
function yearBoundsToronto(year) {
  var start = tzWallTimeToUTCClient(year, 1, 1, 0,0,0, STATS_TZ);
  var end = tzWallTimeToUTCClient(year+1, 1, 1, 0,0,0, STATS_TZ);
  return { start: start, end: end };
}
function sqlDT(d){ return d.toISOString().slice(0,19).replace('T',' '); }
function tlCurrentYear(){ return new Date().getFullYear(); }

function teamLeaderPeriodBounds(){
  if(S.tlMode==='year') return yearBoundsToronto(S.tlYear || tlCurrentYear());
  return weekBoundsToronto(S.tlWeekAnchor ? new Date(S.tlWeekAnchor) : new Date());

function teamLeaderPeriodLabel(){
  if(S.tlMode==='year') return String(S.tlYear || tlCurrentYear());
  var b = teamLeaderPeriodBounds();
  var fmt = new Intl.DateTimeFormat('fr-CA', { timeZone: STATS_TZ, day:'numeric', month:'short' });
  var endInclusive = new Date(b.end.getTime() - 86400000);
  return fmt.format(b.start) + ' au ' + fmt.format(endInclusive);
}
function teamLeaderShiftPeriod(dir){
  if(S.tlMode==='year'){ S.tlYear = (S.tlYear || tlCurrentYear()) + dir; return; }
  var anchor = S.tlWeekAnchor ? new Date(S.tlWeekAnchor) : new Date();
  anchor.setUTCDate(anchor.getUTCDate() + dir*7);
  S.tlWeekAnchor = anchor.toISOString();
}

// Calcule les compteurs pour la periode courante (S.tlMode/tlWeekAnchor/tlYear), a partir des
// donnees D2D deja chargees pour ce role (S.appts/S.deals — voir loadLeadsAndAppts(), non scopees
// par utilisateur cote serveur, memes donnees completes que setters/closers/owner recoivent).
function computeTeamLeaderStats(){
  var b = teamLeaderPeriodBounds();
  var startStr = sqlDT(b.start), endStr = sqlDT(b.end);
  var appts = (S.appts||[]).filter(function(a){ return a.created_at>=startStr && a.created_at<endStr; });
  // ad_lead_id non nul = deal issu du Leads CRM, hors scope porte-a-porte (meme filtre que
  // computeLeaderboard() cote backend) — meme si S.deals peut en contenir pour d'autres roles.
  var deals = (S.deals||[]).filter(function(d){ return !d.ad_lead_id && d.created_at>=startStr && d.created_at<endStr; });
  function isShow(a){ return !!TL_SHOW_STATUSES[a.status]; }
  function isClosing(a){ return a.status==='Closed Won'; }

  var setters = (S.users||[]).filter(function(u){ return u.role==='setter' && u.status==='active'; });
  var closers = (S.users||[]).filter(function(u){ return u.role==='closer' && u.status==='active'; });

  var setterStats = setters.map(function(u){
    var mine = appts.filter(function(a){ return a.setter_id===u.id; });
    return { id:u.id, name:(u.first_name+' '+u.last_name).trim(), pris:mine.length, show:mine.filter(isShow).length, closing:mine.filter(isClosing).length };
  }).sort(function(a,b){ return b.pris-a.pris || a.name.localeCompare(b.name); });

  var closerStats = closers.map(function(u){
    var mine = appts.filter(function(a){ return a.closer_id===u.id; });
    return { id:u.id, name:(u.first_name+' '+u.last_name).trim(), assigned:mine.length, show:mine.filter(isShow).length, closing:mine.filter(isClosing).length };
  }).sort(function(a,b){ return b.closing-a.closing || a.name.localeCompare(b.name); });

  var totals = {
    pris: appts.length,
    show: appts.filter(isShow).length,
    closing: appts.filter(isClosing).length,
    dealsCount: deals.length,
  };
  return { setterStats:setterStats, closerStats:closerStats, totals:totals };
}

function tlPct(num, den){ return den>0 ? Math.round(num/den*100) : 0; }
function tlInitials(name){
  var parts = (name||'??').trim().split(/\s+/);
  return ((parts[0]||'?')[0]+(parts[1]?parts[1][0]:'')).toUpperCase();

      +card('Mes Deals',tlDeals.length?tlDeals.map(function(d){

      }).join(''):empty('Aucun deal encore'),'<button class="btn-sm" id="new-deal-btn">+ Nouveau</button>');
  }
  if(pg!=='dash') return '';
  var st = computeTeamLeaderStats();
  var h = pushBannerHtml();
  h += '<div class="tabs">'
    +'<button class="tab'+(S.tlMode==='week'?' on':'')+'" data-tl-mode="week">Semaine</button>'
    +'<button class="tab'+(S.tlMode==='year'?' on':'')+'" data-tl-mode="year">Annee</button>'

    ['RDV pris', st.totals.pris, '#EEE', 'toute l\'equipe'],
    ['RDV show', st.totals.show, '#5599DD', st.totals.pris ? tlPct(st.totals.show, st.totals.pris)+'% des pris' : ''],
    ['RDV closing', st.totals.closing, '#44AA44', st.totals.show ? tlPct(st.totals.closing, st.totals.show)+'% des shows' : ''],

  h += card('Setters — RDV pris / show / closing', tlRowsHtml(st.setterStats, 'setter'));
